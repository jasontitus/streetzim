// PWA identity on the /drive/ origin only: the manifest and the Apple
// metas, so Add to Home Screen from this page installs the app rather
// than bookmarking it (docs/mobile-browser-review.md §B5). Inside Kiwix
// (zim://, content://, file://) nothing is added.
(function() {
  if (!/^\/drive\//.test(location.pathname)) return;
  function add(tag, attrs) {
    var el = document.createElement(tag);
    for (var k in attrs) el.setAttribute(k, attrs[k]);

  add('link', { rel: 'manifest', href: '/drive/manifest.webmanifest' });
  add('link', { rel: 'apple-touch-icon', href: '/drive/icon-192.png' });

// Light/dark: the same choice as the map viewer (135-map-theme.js), in the
// same order -- ?theme= in the URL, then the reader's saved choice; with
// neither (Auto), the CSS follows prefers-color-scheme. Each means what the
// reader SEES: under a host that inverts the page (Kiwix JS's dark mode,
// invert(1) on the frame) the opposite colours are set, and Auto there is
// the light set (inverted: dark), as in the viewer. Storage may throw.
// Follows a change made in another tab ('storage' event).
(function() {
  function inverted(el) {
    try { return !!el && /invert\(\s*(1|100%)/.test(getComputedStyle(el).filter || ''); }
    catch (e) { return false; }
  }
  function apply() {
    var m = /[?&]theme=(dark|light)(?:&|$)/.exec(location.search || '');
    var mode = m ? m[1] : null;
    if (!mode) {
      try {
        var v = window.localStorage && window.localStorage.getItem('streetzim.theme');
        if (v === 'light' || v === 'dark') mode = v;
      } catch (e) {}
    }
    var fe = null;
    try { fe = window.frameElement; } catch (e) {}
    var root = document.documentElement;
    if (inverted(fe) || inverted(root)) mode = mode === 'light' ? 'dark' : 'light';
    if (mode) root.setAttribute('data-sz-theme', mode);
    else root.removeAttribute('data-sz-theme');
  }
  apply();
  try {
    window.addEventListener('storage', function(e) {
      if (!e || e.key === 'streetzim.theme' || e.key === null) apply();
    });
  } catch (e) {}
})();
</script>

<style>
  :root {
    --bg:#fafafa; --fg:#1a1a1a; --muted:#666; --line:#e0e0e0;
    --card:#fff; --accent:#0a7cff; --chip-bg:#f0f0f0; --chip-on:#0a7cff;
    --chip-on-fg:#fff;
  }
  /* Dark follows the map viewer's theme switch (data-sz-theme, set by the
     script below from ?theme= or localStorage 'streetzim.theme'); with no
     choice (Auto) it follows the OS scheme. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-sz-theme=light]) { --bg:#111; --fg:#eee; --muted:#aaa; --line:#2a2a2a;
            --card:#1c1c1c; --chip-bg:#2a2a2a; }
  }
  :root[data-sz-theme=dark] { --bg:#111; --fg:#eee; --muted:#aaa; --line:#2a2a2a;
          --card:#1c1c1c; --chip-bg:#2a2a2a; color-scheme: dark; }
  :root[data-sz-theme=light] { color-scheme: light; }
  * { box-sizing: border-box; }
  html,body { margin:0; padding:0; background:var(--bg); color:var(--fg);
              font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
              line-height:1.4; }
  header { position:sticky; top:0; z-index:10; background:var(--bg);
           border-bottom:1px solid var(--line);
           padding:var(--top-inset, 12px) 16px 12px; }
  /* The title never shrinks under its text: when a translation makes the
     row too wide, the actions wrap to a second line instead of the title
     turning into "Ort…" (an English row fits and is unchanged). */
  .titlebar { display:flex; align-items:center; gap:10px; margin-bottom:10px;
              flex-wrap:wrap; row-gap:6px; }
  .titlebar h1 { margin:0; font-size:1.2rem; flex:1 0 auto; min-width:0;
                 overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .titlebar a.back { color:var(--accent); text-decoration:none; font-weight:600;
                     font-size:0.95rem; flex:0 0 auto; }
  /* Top-right action: jump to the map with the current results plotted.
     Lives in the sticky header so it stays reachable without floating
     over the list. Pill matches the back-link's accent colour but
     filled, to read as an action rather than navigation. */
  .titlebar .map-view {
    flex:0 0 auto; padding:6px 12px; border-radius:999px;
    border:1px solid var(--accent); background:var(--accent); color:#fff;
    font:inherit; font-size:0.85rem; font-weight:600;
    text-decoration:none; cursor:pointer; line-height:1;
    display:inline-flex; align-items:center; gap:6px;
  }
  .titlebar .map-view[hidden] { display:none; }
  .titlebar .map-view:hover { filter:brightness(1.05); }
  input[type=search] { width:100%; padding:11px 14px; border-radius:10px;
                       border:1px solid var(--line); background:var(--card);
                       color:var(--fg); font-size:1rem; -webkit-appearance:none; }
  input[type=search]:focus { outline:2px solid var(--accent); border-color:transparent; }
  nav.chips { display:flex; gap:8px; overflow-x:auto; padding:10px 16px;
              -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  nav.chips::-webkit-scrollbar { display:none; }
  nav.chips button { flex:0 0 auto; padding:7px 14px; border-radius:18px;
                     border:1px solid var(--line); background:var(--chip-bg);
                     color:var(--fg); font-size:0.9rem; cursor:pointer;
                     white-space:nowrap; }
  nav.chips button.on { background:var(--chip-on); color:var(--chip-on-fg);
                        border-color:var(--chip-on); }
  .near { padding:4px 16px 12px; display:flex; align-items:center;
          gap:10px; font-size:0.9rem; color:var(--muted); }
  .near label { flex:0 0 auto; }
  .near-wrap { position:relative; flex:1 1 auto; }
  #near-input {
    width:100%; padding:8px 28px 8px 12px; border-radius:10px;
    border:1px solid var(--line); background:var(--card); color:var(--text);
    /* 16 px: iOS Safari zooms into any focused input below that on a
       page that allows zooming (docs/mobile-browser-review.md §B5). */
    font:inherit; font-size:1rem;
  }
  #near-input:focus { outline:2px solid var(--chip-on); outline-offset:-1px; }
  #near-clear {
    position:absolute; right:6px; top:50%; transform:translateY(-50%);
    background:transparent; border:none; color:var(--muted);
    font-size:18px; line-height:1; cursor:pointer; padding:2px 6px;
  }
  #near-clear:hover { color:var(--text); }
  /* "Limit to map area" toggle — appears when index.html has stashed
     a recent viewport in sessionStorage. Hard-filters results to the
     bbox so "bars near my neighborhood" is just zoom + chip. */
  .map-area { padding:0 16px 12px; display:flex; align-items:center;
              gap:8px; font-size:0.85rem; color:var(--muted); }
  .map-area[hidden] { display:none; }
  .map-area input[type=checkbox] { margin:0; cursor:pointer; }
  .map-area label { cursor:pointer; user-select:none; }
  .map-area .info { color:var(--muted); font-size:0.8rem;
                    overflow:hidden; text-overflow:ellipsis;
                    white-space:nowrap; flex:1 1 auto; min-width:0; }
  /* Recent searches dropdown — reuses near-results visuals so the
     hit area + selection styling are familiar. */
  #recent-searches {
    position:absolute; left:0; right:0; top:calc(100% + 4px);
    background:var(--card); border:1px solid var(--line);
    border-radius:10px; box-shadow:0 6px 20px rgba(0,0,0,0.18);
    z-index:1100; max-height:300px; overflow-y:auto; padding:4px 0;
  }
  #recent-searches[hidden] { display:none; }
  #recent-searches .recent-head {
    padding:6px 12px; font-size:0.8rem; color:var(--muted);
    display:flex; align-items:center; justify-content:space-between;
  }
  #recent-searches .recent-head button {
    background:transparent; border:none; color:var(--accent);
    font:inherit; font-size:0.8rem; cursor:pointer; padding:2px 6px;
  }
  #recent-searches .recent-row {
    padding:8px 12px; cursor:pointer; display:flex;
    align-items:center; gap:8px; font-size:0.95rem;
  }
  #recent-searches .recent-row:hover,
  #recent-searches .recent-row.active { background:var(--chip-on); color:var(--chip-on-fg); }
  #recent-searches .recent-row .icon { color:var(--muted); flex:0 0 auto; }
  /* Sort selector — slim row above the result list. */
  .sort-row {
    padding:8px 16px 4px; display:flex; align-items:center; gap:6px;
    font-size:0.85rem; color:var(--muted); flex-wrap:wrap;
  }
  .sort-row[hidden] { display:none; }
  .sort-row label { flex:0 0 auto; }
  .sort-row .sort-btn {
    flex:0 0 auto; padding:4px 10px; border-radius:999px;
    border:1px solid var(--line); background:transparent;
    color:var(--text); font:inherit; font-size:0.85rem; cursor:pointer;
  }
  .sort-row .sort-btn.on {
    background:var(--accent); color:#fff; border-color:var(--accent);
  }
  /* Sub-filter chips — derived from the current result set's subtype
     histogram (top N). Sits above the sort row. */
  .subfilter-row {
    padding:4px 16px 8px; display:flex; gap:6px;
    overflow-x:auto; -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .subfilter-row[hidden] { display:none; }
  .subfilter-row::-webkit-scrollbar { display:none; }
  .subfilter-row .sub-chip {
    flex:0 0 auto; padding:5px 11px; border-radius:999px;
    border:1px solid var(--line); background:var(--card); color:var(--text);
    font:inherit; font-size:0.8rem; cursor:pointer;
    white-space:nowrap;
  }
  .subfilter-row .sub-chip:hover { background:#eef3fe; }
  .subfilter-row .sub-chip.on {
    background:var(--accent); color:#fff; border-color:var(--accent);
  }
  /* Wrap the search input so the recent-searches dropdown can absolutely
     position relative to it. */
  header .q-wrap { position:relative; }
  #near-results {
    position:absolute; top:calc(100% + 4px); left:0; right:0; z-index:20;
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    max-height:260px; overflow-y:auto; box-shadow:0 4px 16px rgba(0,0,0,0.4);
  }
  #near-results .near-result {
    padding:10px 12px; cursor:pointer; font-size:0.92rem; line-height:1.35;
    border-bottom:1px solid var(--line);
  }
  #near-results .near-result:last-child { border-bottom:none; }
  #near-results .near-result:hover,

<script>
"use strict";
// All data fetches go through the same origin as this page. Inside a
// ZIM (kiwix) the path is `search-data/...`; over the Firebase /drive
// PWA it's `viewer/search-data/...` because the viewer ships under
// `viewer/`. We compute the prefix once at boot.
//
// Handle both `…/viewer/places.html` (Kiwix native, no rewriting) AND
// `…/viewer/places/` (Firebase cleanUrls + trailingSlash) — treat the
// trailing slash as if it were the file extension by stripping the
// last non-empty path component plus any trailing slash.
const HERE = location.pathname.replace(/[^/]+\/?$/, '');
const DATA = HERE + 'search-data/';
const CAT  = HERE + 'category-index/';

// Wire the static back-link href now that HERE is known. Doing it
// in JS instead of HTML lets the same template work whether places
// is served at `/drive/viewer/places/` (PWA) or `<zim-root>/places.html`
// (Kiwix) — the two have different ../ semantics.
// A link to the map viewer keeps a ?uilang= override (docs/i18n.md), so a
// German check of an English ZIM stays German across the hand-off.
function withUiLang(url) {
  const m = /[?&]uilang=([A-Za-z]{2,3}(?:-[A-Za-z0-9]+)?)/.exec(location.search);
  if (!m) return url;
  const i = url.indexOf('#');
  const base = i < 0 ? url : url.slice(0, i), frag = i < 0 ? '' : url.slice(i);
  return base + (base.includes('?') ? '&' : '?') + 'uilang=' + m[1] + frag;
}
{
  const back = document.getElementById('back-link');
  if (back) back.href = withUiLang(HERE + 'index.html');
}

// Categories surfaced as chips. Each maps to either a single
// category-index slug (cheap one-fetch) or a subtype filter applied
// to the broader `poi` index. Order matters — first chip wins
// horizontal real-estate.
// Categories shown as chips. Each chip's filter runs on top of the
// category-index/<cat>.json records (cheap one-fetch).
// We mix two selectors: (1) `subtypes` — always-include by subtype
// (OpenMapTiles `class`/`subclass`). (2) `nameInclude` — broaden by
// name when the record's type is only a generic bucket. OpenMapTiles
// has a `museum` class, but older tilemaker-built ZIMs stored
// tilemaker's raw OSM key instead (`tourism`, `amenity`, …; newer
// builds store the subclass), and an attraction named "… Museum" is
// only `attraction` — so the nameInclude fallback catches those
// without inviting every random tourism POI into the Museums chip.
// Category chips. `subtypes` matches `r.s` (record subtype). After the
// Overture places merge, POI records have their subtype rewritten to
// Overture's normalized category when OMT had a noisy bucket — so a
// match like "museum" now catches everything correctly. We still keep
// OSM/OMT fallbacks (tourism etc.) for ZIMs built without Overture.
// Overture category strings follow a <noun>_<modifier> convention
// (vietnamese_restaurant, coffee_shop, wine_store, …) — `includeRegex`
// matches a regex against the subtype string for coarser buckets.
// BEGIN chip-rules  (must equal cloud/chip_rules.py CHIP_RULES; enforced by
// tests/chip_rules_js.test.mjs, so edit both together)
const CATEGORIES = [
  // Merged 2026-09-16 (cloud/chip_rules.py). ZIMs built before that have
  // chip-restaurants.json / chip-cafes.json and no chip-food.json, so all
  // three stay listed and chipsForThisZim() shows whichever the ZIM has.
  // ONE food chip. A pre-merge ZIM has no chip-food.json, so
  // chipsForThisZim() keeps this entry when the ZIM has restaurants and/or
  // cafes, and loadChipFile() fetches both and concatenates — the Find page
  // reads the same whatever vintage the ZIM is.
  { id: 'food',        label: 'Food & Drink', cat: 'poi',
    subtypes: ['restaurant', 'fast_food', 'food_court', 'ice_cream',
               'ice_cream_parlor', 'cafe', 'coffee_shop', 'bakery',
               'tea_room'],
    includeRegex: /_restaurant$|^food_|^coffee_|_bakery$|_cafe$/ },
  { id: 'bars',        label: 'Bars',        cat: 'poi',
    subtypes: ['bar', 'pub', 'biergarten', 'nightclub', 'beer',
               'alcohol_shop', 'wine_bar', 'sports_bar', 'cocktail_bar',
               'dive_bar', 'beer_bar', 'brewery', 'wine_store', 'liquor_store'] },
  { id: 'hotels',      label: 'Hotels',      cat: 'poi',
    subtypes: ['hotel', 'motel', 'hostel', 'bed_and_breakfast',
               'lodging', 'inn', 'guest_house', 'resort', 'campsite'] },
  { id: 'museums',     label: 'Museums',     cat: 'poi',
    // Exact `museum` (OMT + Overture generic) plus any Overture variant
    // suffixed `_museum` (art_museum, history_museum, science_museum,
    // childrens_museum, asian_art_museum, …) and the art_gallery bucket
    // — people conflate museums + galleries. Historic / landmarks /
    // monuments moved to their own "Landmarks" chip below.
    subtypes: ['museum', 'art_gallery', 'planetarium', 'observatory'],
    includeRegex: /_museum$|_gallery$/,
    nameInclude: {
      subtypes: ['tourism', 'attraction'],
      pattern: /\b(museum|gallery|exhibit|planetarium)\b/i,
    } },
  { id: 'landmarks',   label: 'Landmarks',   cat: 'poi',
    subtypes: ['historic', 'castle', 'monument', 'historical_landmark',
               'landmark_and_historical_building', 'memorial'],
    nameInclude: {
      subtypes: ['tourism', 'attraction'],
      pattern: /\b(landmark|monument|memorial|historic)\b/i,
    } },
  { id: 'parks',       label: 'Parks',       cat: 'park' },
  { id: 'libraries',   label: 'Libraries',   cat: 'poi',
    subtypes: ['library', 'public_library'] },
  { id: 'health',      label: 'Health',      cat: 'poi',
    subtypes: ['hospital', 'pharmacy', 'clinic', 'doctors', 'dentist',
               'urgent_care_clinic', 'veterinary'] },
  { id: 'shops',       label: 'Shops',       cat: 'poi',
    subtypes: ['shop', 'supermarket', 'mall', 'marketplace',
               'department_store', 'convenience', 'grocery',
               'clothing_store', 'jewelry_store'],
    includeRegex: /_store$|^store$/ },
  { id: 'fuel',        label: 'Gas',         cat: 'poi',
    subtypes: ['fuel', 'charging_station', 'gas_station', 'ev_charging_station'] },
];
// END chip-rules

const state = {
  manifests: { search: null, cat: null }, // small lookups
  cache: { chunks: new Map(), cats: new Map() }, // path → array of records (capped by cacheKeep)
  results: [],
  lastRecords: [],     // unsorted records from the last query — re-used by sort
  // Geo-sharded chip query info (CHIP_SHARDS.load result minus records):
  // the result set is the nearest matches to geo.point, not the region.
  geo: null,
  geoBase: null,       // geo info of the chip's unfiltered-by-subtype query
  geoSubRecords: null, // nearest matches of the active sub-filter
  query: '',
  chip: null,
  origin: null,        // {lat, lon} when GPS toggle is on
  mapArea: null,       // {n,s,e,w,z,ts} from index.html or null
  mapAreaOn: false,    // user toggled "Limit to map area"
  sortMode: null,      // 'distance' | 'name' | 'category' (null = auto)
  subFilter: null,     // selected r.s subtype (e.g. 'italian_restaurant')
};

// Recent searches are persisted in localStorage so they survive
// across sessions. Capped to keep storage bounded; users who want
// more history can star results once we ship saved-places.
const RECENT_KEY = 'streetzim_recent_searches';
const RECENT_LIMIT = 10;
function loadRecents() {
  try {
    const raw = localStorage.getItem(RECENT_KEY);
    if (!raw) return [];
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr.slice(0, RECENT_LIMIT) : [];
  } catch (e) { return []; }
}
function saveRecent(entry) {
  // entry: {kind: 'query'|'chip', label, value, ts}
  if (!entry || !entry.label) return;
  let arr = loadRecents();
  // De-dup by (kind, value); promote the existing entry to the top.
  arr = arr.filter(e => !(e.kind === entry.kind && e.value === entry.value));
  arr.unshift(entry);
  arr = arr.slice(0, RECENT_LIMIT);
  try { localStorage.setItem(RECENT_KEY, JSON.stringify(arr)); }
  catch (e) {}

// Viewport that index.html stashed on its last moveend. We accept it
// only if it's < 30 min old — otherwise the user has probably context-
// switched and the cached bbox is no longer what they mean by
// "this area".
const VIEWPORT_FRESH_MS = 30 * 60 * 1000;
// BEGIN chip-shards
// Geographic Find-chip shards (cloud/chip_shards.py). Chips over ~2 MiB
// ship as spatially compact shard files; the category manifest lists
// each shard's bbox (`chips[id].layout === 'geo'`, `shards[i] =
// [s, w, n, e, count, bytes]`, w > e crossing ±180). CHIP_SHARDS.load
// fetches only the shards needed for the k nearest matching records
// around a point, optionally inside a viewport — never the whole chip,
// which on continents is hundreds of MB of JSON (iOS WebView jetsam).
// This block is byte-identical in index.html and places.html
// (tests/chip_shards_js.test.mjs enforces it); edit both together.
var CHIP_SHARDS = (function() {
  var EARTH_KM = 6371.0088;
  var D2R = Math.PI / 180;

  function hav(rad) { var s = Math.sin(rad / 2); return s * s; }
  function havKm(h) { return 2 * EARTH_KM * Math.asin(Math.sqrt(Math.min(1, Math.max(0, h)))); }
  function distKm(lat1, lon1, lat2, lon2) {
    return havKm(hav((lat2 - lat1) * D2R)
      + Math.cos(lat1 * D2R) * Math.cos(lat2 * D2R) * hav((lon2 - lon1) * D2R));
  }
  function mod360(x) { return ((x % 360) + 360) % 360; }
  function norm180(x) { return mod360(x + 180) - 180; }
  function lonIn(lon, w, e) {
    return w <= e ? (lon >= w && lon <= e) : (lon >= w || lon <= e);
  }
  // Degrees from `lon` to the circular interval [w, e]; 0 inside.
  function lonGap(lon, w, e) {
    // 180 and -180 are one meridian; norm180 maps both to -180.
    lon = norm180(lon); w = norm180(w); e = norm180(e);
    if (lonIn(lon, w, e)) return 0;
    return Math.min(mod360(w - lon), mod360(lon - e));
  }
  // Great-circle lower bound (km) from a point to anything inside a box:
  // hav(d) = hav(dLat) + cos(lat1)cos(lat2)hav(dLon), each term at its
  // minimum over the box, so the bound never exceeds a true distance.
  function boxLowerBoundKm(lat, lon, s, w, n, e) {
    var dLat = lat < s ? s - lat : (lat > n ? lat - n : 0);
    var dLon = Math.min(lonGap(lon, w, e), 180);
    var cosMin = Math.max(0, Math.min(Math.cos(s * D2R), Math.cos(n * D2R)));
    return havKm(hav(dLat * D2R)
      + Math.max(0, Math.cos(lat * D2R)) * cosMin * hav(dLon * D2R));
  }
  // Viewport {s, w, n, e} as MapLibre reports it (longitudes may be
  // unwrapped past ±180, or span 360+ at low zoom) → normalized form.
  function normBbox(b) {
    if (!b) return null;
    if (!(b.e - b.w < 360)) return { s: b.s, n: b.n, all: true, w: -180, e: 180 };
    return { s: b.s, n: b.n, all: false, w: norm180(b.w), e: norm180(b.e) };

    return lat >= nb.s && lat <= nb.n && (nb.all || lonIn(norm180(lon), nb.w, nb.e));
  }
  function bboxMeetsShard(nb, row) {
    if (row[0] > nb.n || row[2] < nb.s) return false;
    if (nb.all) return true;
    // Two circular arcs intersect iff one contains the other's start.
    var sw = norm180(row[1]), se = norm180(row[3]);

  function makeCache(capBytes) {

    var total = 0;

      var ent = entries.get(key);
      if (!ent) return;
      entries['delete'](key);
      total -= ent.bytes;
    }
    return {
      get: function(key, bytes, fetcher) {
        var ent = entries.get(key);
        if (ent) {
          entries['delete'](key);
          entries.set(key, ent);
          return ent.p;
        }
        var p = Promise.resolve().then(fetcher);
        ent = { p: p, bytes: bytes };
        entries.set(key, ent);
        total += bytes;
        p.then(null, function() { if (entries.get(key) === ent) drop(key); });
        var it = entries.keys();
        while (total > capBytes && entries.size > 1) {
          var oldest = it.next().value;
          if (oldest === key) break;
          drop(oldest);

      },
      clear: function() { entries.clear(); total = 0; }

  }

  // (chip id), point {lat, lon} (required), bbox (optional viewport),
  // k (300), predicate(rec) (optional), inBox(rec) (optional: a further
  // test with the bbox, e.g. "on screen, not under the search box"; it
  // counts toward k like the bbox, so k records that pass it are found,
  // and the fallback without the bbox skips it), budgetBytes,
  // isCancelled(), fallbackToNearest (retry without bbox when nothing is
  // inside it).
  // Resolves null when cancelled, else {records (nearest first, <= k),
  // dists (km), partial, radiusKm, failed, fellBack, shardsLoaded,
  // bytesLoaded}. partial: a shard that could still hold one of the k
  // nearest was not loaded (budget or fetch failure); results are exact
  // within radiusKm. failed: at least one shard fetch failed.
  function load(meta, opts) {
    var k = opts.k || 300;
    var budget = opts.budgetBytes || budgetBytes();
    var plat = +opts.point.lat, plon = norm180(+opts.point.lon);
    var cancelled = opts.isCancelled || function() { return false; };
    function attempt(nb) {
      var cands = [];
      for (var i = 0; i < meta.shards.length; i++) {
        var row = meta.shards[i];

        if (nb && !bboxMeetsShard(nb, row)) continue;
        cands.push({ i: i, bytes: +row[5] || 0,
                     lb: boxLowerBoundKm(plat, plon, row[0], row[1], row[2], row[3]) });
      }
      cands.sort(function(a, b) { return a.lb - b.lb || a.i - b.i; });
      var best = [];
      var next = 0, loadedBytes = 0, shardsLoaded = 0;
      var unresolvedKm = Infinity;
      var failed = false;
      function kthKm() { return best.length >= k ? best[k - 1].d : Infinity; }
      function finish() {
        var partial = unresolvedKm < Infinity && !(kthKm() <= unresolvedKm);
        return {
          records: best.map(function(x) { return x.r; }),
          dists: best.map(function(x) { return x.d; }),
          partial: partial, radiusKm: partial ? unresolvedKm : Infinity,
          failed: failed, fellBack: false, shardsLoaded: shardsLoaded, bytesLoaded: loadedBytes

        // nearest, and the stop rule is only checked between batches.

          var c = cands[next];

          if (loadedBytes + c.bytes > budget && next > 0) {  // always try one
            unresolvedKm = Math.min(unresolvedKm, c.lb);
            next = cands.length;
            break;
          }
          batch.push(c);
          loadedBytes += c.bytes;
          next++;
        }
        if (!batch.length) return finish();
        return Promise.all(batch.map(function(c) {
          var suffix = meta.sub_chunks[c.i];
          var fetch1 = function() { return opts.fetchShard(suffix); };
          var p = opts.cache
            ? opts.cache.get((opts.cacheKey || '') + '/' + suffix, c.bytes, fetch1)
            : Promise.resolve().then(fetch1);

                        function() { return null; });
        })).then(function(arrays) {
          if (cancelled()) return null;
          for (var b = 0; b < batch.length; b++) {

              unresolvedKm = Math.min(unresolvedKm, batch[b].lb);
              continue;
            }
            shardsLoaded++;
            for (var j = 0; j < recs.length; j++) {
              var r = recs[j];
              if (!r || typeof r.a !== 'number' || typeof r.o !== 'number') continue;
              if (nb && !bboxHasPoint(nb, r.a, r.o)) continue;
              if (nb && opts.inBox && !opts.inBox(r)) continue;
              if (opts.predicate && !opts.predicate(r)) continue;
              best.push({ r: r, d: distKm(plat, plon, r.a, r.o) });
            }
          }
          best.sort(function(x, y) { return x.d - y.d; });
          if (best.length > k) best.length = k;
          return step();
        });
      }
      return Promise.resolve().then(step);
    }
    var nb0 = normBbox(opts.bbox);
    return attempt(nb0).then(function(res) {
      if (!res || !nb0 || res.records.length || !opts.fallbackToNearest || cancelled()) return res;
      return attempt(null).then(function(res2) {
        if (res2) res2.fellBack = true;
        return res2;
      });
    });
  }

  // Circular-mean centre of all geo shard boxes — last-resort origin
  // when there is no GPS, picked place, or map viewport.
  function centre(meta) {
    var x = 0, y = 0, lat = 0, n = 0;
    for (var i = 0; i < meta.shards.length; i++) {
      var r = meta.shards[i];
      if (!r || typeof r[0] !== 'number') continue;
      var mid = r[1] <= r[3] ? (r[1] + r[3]) / 2 : norm180((r[1] + r[3] + 360) / 2);
      var wgt = +r[4] || 1;
      x += wgt * Math.cos(mid * D2R);
      y += wgt * Math.sin(mid * D2R);
      lat += wgt * (r[0] + r[2]) / 2;
      n += wgt;
    }
    if (!n) return null;
    return { lat: lat / n, lon: Math.atan2(y, x) / D2R };
  }

  return {
    isGeo: isGeo, load: load, makeCache: makeCache, budgetBytes: budgetBytes,
    centre: centre, distKm: distKm,
    _test: { boxLowerBoundKm: boxLowerBoundKm, normBbox: normBbox,
             bboxHasPoint: bboxHasPoint, bboxMeetsShard: bboxMeetsShard }
  };
})();
// END chip-shards

function _readMapArea() {
  try {
    const raw = sessionStorage.getItem('streetzim_last_viewport');
    if (!raw) return null;
    const v = JSON.parse(raw);
    if (!v || typeof v.n !== 'number') return null;
    if (Date.now() - (v.ts || 0) > VIEWPORT_FRESH_MS) return null;
    return v;
  } catch (e) { return null; }
}

const els = {
  q:            document.getElementById('q'),
  chips:        document.getElementById('chips'),
  status:       document.getElementById('status'),
  statusText:   document.getElementById('status-text'),
  mapViewBtn:   document.getElementById('map-view-btn'),
  results:      document.getElementById('results'),
  near:         document.getElementById('near-input'),
  nearClear:    document.getElementById('near-clear'),
  nearResults:  document.getElementById('near-results'),
  mapAreaRow:   document.getElementById('map-area-row'),
  mapAreaCheck: document.getElementById('map-area-checkbox'),
  mapAreaInfo:  document.getElementById('map-area-info'),
  recents:      document.getElementById('recent-searches'),
  sortRow:      document.getElementById('sort-row'),
  subfilterRow: document.getElementById('subfilter-row'),
};

// If index.html stashed a recent viewport, expose the toggle so the
// user can constrain results to it. Otherwise the toggle row stays
// hidden and search is unchanged.
function initMapAreaToggle() {
  state.mapArea = _readMapArea();
  if (!state.mapArea || !els.mapAreaRow) return;
  // Brief, friendly description of the bbox. Zoom level is more
  // intuitive than degrees: "neighborhood / city / region".
  const z = state.mapArea.z || 0;
  let scale = szT('places.scale_map_area', 'map area');
  if      (z >= 15) scale = szT('places.scale_neighborhood', 'neighborhood');
  else if (z >= 12) scale = szT('places.scale_city', 'city');
  else if (z >= 9)  scale = szT('places.scale_region', 'region');
  els.mapAreaInfo.textContent = szT('places.map_area_info', '({scale}, zoom {z})', { scale: scale, z: szFixed(z, 1) });
  els.mapAreaRow.hidden = false;
  // Default ON when a fresh viewport is on hand. Searching the
  // user's current map area is what they almost always want; if the
  // filter would yield zero results, _sortAndShow auto-falls back
  // to the unfiltered set rather than showing nothing. The user
  // can still untick to force a wider search.
  state.mapAreaOn = true;
  els.mapAreaCheck.checked = true;
  els.mapAreaCheck.addEventListener('change', () => {
    state.mapAreaOn = els.mapAreaCheck.checked;
    rerunQuery();
  });
}

function initRecents() {
  if (!els.recents) return;
  // Show recents only when the search box is empty AND focused, so
  // typing-driven typeahead isn't competing with history. Hide on
  // outside click. Selecting an entry restores the query/chip.
  els.q.addEventListener('focus', () => {
    if (!els.q.value.trim()) renderRecents();
  });
  els.q.addEventListener('input', () => {
    // Hide as soon as the user types — typeahead takes over.
    if (els.q.value) els.recents.hidden = true;
  });
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.q-wrap')) els.recents.hidden = true;
  });
}

function renderRecents() {
  if (!els.recents) return;
  const items = loadRecents();
  if (items.length === 0) {
    els.recents.hidden = true;
    return;
  }
  // Tear down + rebuild via DOM APIs (no innerHTML) since the entries
  // come from user-typed history that can contain arbitrary text.
  while (els.recents.firstChild) els.recents.removeChild(els.recents.firstChild);
  const head = document.createElement('div');
  head.className = 'recent-head';
  const headLabel = document.createElement('span');
  headLabel.textContent = szT('places.recent_searches', 'Recent searches');
  head.appendChild(headLabel);
  const clear = document.createElement('button');
  clear.type = 'button';
  clear.textContent = szT('common.clear', 'Clear');
  clear.addEventListener('click', (e) => {
    e.stopPropagation();
    try { localStorage.removeItem(RECENT_KEY); } catch (e2) {}
    els.recents.hidden = true;
  });
  head.appendChild(clear);
  els.recents.appendChild(head);
  for (const item of items) {
    const row = document.createElement('div');
    row.className = 'recent-row';
    row.setAttribute('role', 'option');
    const icon = document.createElement('span');
    icon.className = 'icon';
    icon.textContent = item.kind === 'chip' ? '🏷️' : '🕘';
    row.appendChild(icon);
    const label = document.createElement('span');
    label.textContent = item.kind === 'chip' ? szChipLabel(item.value, item.label) : item.label;
    row.appendChild(label);
    row.addEventListener('mousedown', (e) => e.preventDefault()); // keep focus
    row.addEventListener('click', () => applyRecent(item));
    els.recents.appendChild(row);
  }
  els.recents.hidden = false;
}

// Resolve a saved or linked chip id against the chips THIS ZIM has, mapping
// across the 2026-09-16 Restaurants+Cafés merge in both directions: a recent
// saved as "restaurants" still opens Food & Drink on a new ZIM, and a
// "?chip=food" link still opens Restaurants on an old one. Without this the
// def resolves to a chip with no file and the page errors out.
function chipDefById(id) {
  const have = chipsForThisZim();
  const exact = have.find(c => c.id === id);
  if (exact) return exact;
  const alias = { restaurants: 'food', cafes: 'food',
                  food: 'restaurants' }[id];
  return alias ? have.find(c => c.id === alias) || null : null;
}

function applyRecent(item) {
  els.recents.hidden = true;
  if (item.kind === 'chip') {
    const def = chipDefById(item.value);
    if (!def) return;
    state.chip = null; // selectChip toggles, so make sure we end up "on"
    selectChip(def);
  } else {
    state.chip = null;
    for (const b of els.chips.querySelectorAll('button')) {
      b.classList.remove('on');
    }
    els.q.value = item.value;
    state.query = item.value;
    rerunQuery();
  }
}

function initSortRow() {
  if (!els.sortRow) return;
  for (const btn of els.sortRow.querySelectorAll('.sort-btn')) {
    btn.addEventListener('click', () => {
      state.sortMode = btn.dataset.sort;
      _refreshSortButtons();
      _resortCurrent();
    });
  }
}

function _refreshSortButtons() {
  if (!els.sortRow) return;
  const mode = _effectiveSortMode();
  for (const btn of els.sortRow.querySelectorAll('.sort-btn')) {
    btn.classList.toggle('on', btn.dataset.sort === mode);
  }
}

function _effectiveSortMode() {
  return state.sortMode || (state.origin ? 'distance' : 'name');
}

// Apply ?chip=…&mapArea=1 URL params, set by the index.html Explore
// menu. Idempotent — runs once on init. Pre-toggles the bbox filter
// when mapArea=1 is requested AND a viewport is actually on hand.
function applyUrlParamsOnce() {
  let params;
  try { params = new URLSearchParams(location.search); }
  catch (e) { return; }
  const chipId = params.get('chip');
  const mapArea = params.get('mapArea') === '1';
  if (mapArea && state.mapArea && els.mapAreaCheck) {
    state.mapAreaOn = true;
    els.mapAreaCheck.checked = true;
  }
  if (chipId) {
    const def = chipDefById(chipId);
    if (def) {
      // selectChip toggles, so make sure the starting state is "off".
      state.chip = null;
      selectChip(def);
    }
  }
}

// ---------- bootstrapping ----------

// map-config.json: its `language` picks the UI language (docs/i18n.md),
// its centre seeds geo chips with no other origin (_regionCentre).
const _mapConfigP = fetchJSON(HERE + 'map-config.json').catch(() => null);

(async function init() {
  // The UI language first, so nothing below renders in English and then
  // changes. A missing map-config.json (very old ZIM) means English.
  const cfg = await _mapConfigP;
  szUseLanguage(cfg && cfg.language, location.search);
  if (state.originMode === 'gps') {
    state.originLabel = myLocationLabel();
    if (els.near.hasAttribute('data-sz-here')) showNearHere();
  }
  // Manifests are tiny and always needed; fetch in parallel.
  try {
    const [s, c] = await Promise.all([
      fetchJSON(DATA + 'manifest.json'),
      fetchJSON(CAT  + 'manifest.json').catch((e) => {
        // Absent (404) means a ZIM built without it; anything else is a
        // failed fetch, which must not read as "no such category".
        if (!/HTTP 404/.test(e && e.message)) state.manifestCatFailed = true;
        return null;
      }),
    ]);
    state.manifests.search = s;
    state.manifests.cat = c; // may be null if the ZIM was built without it
  } catch (e) {
    setStatus(szT('places.index_failed', 'Couldn\'t load the search index: {error}', { error: e.message }), 'error');
    return;
  }
  renderChips();
  initMapAreaToggle();
  initRecents();
  initSortRow();
  applyUrlParamsOnce();
  els.q.addEventListener('input', debounce(onSearch, 200));
  // Search-near input: typeahead into the same place/POI index, click
  // a result to set the search origin manually. "My location" (GPS)
  // is the default when the input hasn't been edited. Clearing with
  // "×" reverts to GPS.
  els.near.addEventListener('input', debounce(onNearInput, 180));
  els.near.addEventListener('focus', () => {
    // Select the whole current label so the first keystroke replaces it.
    setTimeout(() => els.near.select(), 0);
  });
  els.near.addEventListener('keydown', onNearKeydown);
  els.nearClear.addEventListener('click', clearNearCustom);
  // Clicking outside the dropdown closes it without resetting state.
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.near-wrap')) hideNearResults();
  });
  // "Map view" hand-off: stash the current result set in
  // sessionStorage and navigate to index.html. The viewer reads the
  // stash on load and drops one search-pin per record. Same-origin
  // sessionStorage works in every host (PWA, Kiwix Desktop, iOS).
  if (els.mapViewBtn) {
    els.mapViewBtn.addEventListener('click', () => {
      if (state.results.length === 0) return;
      // Build a label that names what's being plotted — the chip
      // label if a chip is active, otherwise the query string.
      const label = (state.chip && chipLabel(state.chip))
                    || state.query
                    || szTn('places.n_places', state.results.length, { one: '{n} places', other: '{n} places' });
      if (stashResultsForMap(label)) {
        window.location.href = withUiLang(HERE + 'index.html#find=results');
      }
    });
  }
  // Restore filter from URL (#cat=museums or #q=foo). Also accepts
  // ``#lat=..&lon=..`` from the main viewer's Find link to default
  // "Search near" to the map's current view center instead of GPS.
  const hash = parseHash(location.hash);
  // Set state.query too so a `#cat=…&q=…` deep link name-filters the
  // chip results (onSearch only runs on the q-only path below).
  if (hash.q) { els.q.value = hash.q; state.query = hash.q.trim(); }
  if (hash.lat && hash.lon) {
    // Viewport-centered origin — kick off reverse-geocode in the
    // background so the "Search near" label reads the nearest city
    // name, but don't block chip/query rendering on it.
    const lat = parseFloat(hash.lat);
    const lon = parseFloat(hash.lon);
    if (isFinite(lat) && isFinite(lon)) {
      state.origin = { lat, lon };
      state.originMode = 'viewport';
      state.originLabel = szT('places.near_coords', 'Near ({lat}, {lon})', { lat: lat.toFixed(3), lon: lon.toFixed(3) });
      showNearPlace(state.originLabel);
      reverseGeocodeFromViewport(lat, lon).then(name => {
        if (name && state.originMode === 'viewport') {
          state.originLabel = name;
          showNearPlace(name);
        }
      }).catch(() => {});  // fallback stays as coord label
    }
  }
  if (hash.cat) {
    const def = CATEGORIES.find(c => c.id === hash.cat);
    if (def) selectChip(def);
  } else if (hash.q) {
    onSearch();
  } else {
    setStatus(szT('places.type_or_pick', 'Type to search, or pick a category above.'));
  }
})();

// Shared shard cache: used by the reverse geocoder below and by the chip
// loader further down. Declared here because `const` has no hoisting — the
// geocoder runs early and would hit the temporal dead zone otherwise.
const chipShardCache = CHIP_SHARDS.makeCache(CHIP_SHARDS.budgetBytes());
window.addEventListener('pagehide', () => chipShardCache.clear());

// ---------- reverse geocoder (viewport-center → nearest city) ----------

// Find the closest place:city|town|village record within ~50 km of
// (lat, lon) by scanning the category-index `place` chunk. The file
// name follows the OSM `type` field (singular `place`, never `places`)
// — older builds and the smoke harness both proved a hardcoded
// `places.json` 404s. Skip the request entirely if the manifest says
// no `place` chunk exists.
async function reverseGeocodeFromViewport(lat, lon) {
  try {
    const cats = state.manifests.cat && state.manifests.cat.categories;
    if (!cats || !cats.place) return null;
    // Big regions shard this category geographically (china's place.json is
    // 109 MB, europe's 480 MB, and this function only wants settlements
    // within 50 km). Read the shards around the point; older ZIMs still
    // have the single file.
    const kinds = { city: 4, town: 3, village: 2, hamlet: 1, suburb: 1 };
    const shardMeta = state.manifests.cat.category_shards
                      && state.manifests.cat.category_shards.place;
    let raw;
    if (CHIP_SHARDS.isGeo(shardMeta)) {
      // Settlements only, inside the search. 81.6% of this category is
      // neighbourhoods, quarters and localities, so asking for the nearest
      // 200 records of any kind and filtering afterwards left 11% of
      // viewports with no city name and 30% with a worse one (measured over
      // 400 points on japan). With the predicate the k-th match drives the
      // stop rule, so the answer is exact again.
      const res = await CHIP_SHARDS.load(shardMeta, {
        fetchShard: (suffix) => fetchJSON(CAT + 'place-' + suffix + '.json'),
        cache: chipShardCache,
        cacheKey: 'place',
        point: { lat, lon },
        predicate: (r) => !!(kinds[r.s] || kinds[r.t]),
        k: 32,
      }).catch(() => null);
      raw = res && res.records;
    } else {
      raw = await fetchJSON(CAT + 'place.json').catch(() => null);
    }
    if (!raw || !Array.isArray(raw)) return null;
    let bestName = null, bestScore = -Infinity;
    for (const r of raw) {
      const rlat = r.a, rlon = r.o;
      if (typeof rlat !== 'number' || typeof rlon !== 'number') continue;
      const d = haversine(lat, lon, rlat, rlon);
      if (d > 50000) continue;  // cap at 50 km
      const k = kinds[r.s] || kinds[r.t] || 0;
      if (!k) continue;
      // Score: prefer larger place types, break ties by proximity.
      const score = k * 1e6 - d;
      if (score > bestScore) {
        bestScore = score;
        bestName = r.n || null;
      }
    }
    return bestName;
  } catch (e) {
    return null;
  }
}

// ---------- chips ----------

// Show the chips this ZIM actually has. Restaurants + Cafés became one
// "Food & Drink" chip on 2026-09-16, but every ZIM built before that ships
// chip-restaurants.json / chip-cafes.json and no chip-food.json — so the
// table is filtered by the manifest rather than assumed.
function chipsForThisZim() {
  const chips = state.manifests.cat && state.manifests.cat.chips;
  if (!chips) return CATEGORIES;            // no chip files: legacy path
  // Food & Drink stands in for a pre-merge ZIM's restaurants/cafes pair.
  const alt = { food: ['food', 'restaurants', 'cafes'] };
  const have = CATEGORIES.filter(def =>
    (alt[def.id] || [def.id]).some(id => chips[id]));
  return have.length ? have : CATEGORIES;
}

// Which concrete chip files back a (possibly merged) chip on THIS ZIM.
function chipSourcesFor(chipId) {
  const chips = (state.manifests.cat && state.manifests.cat.chips) || {};
  if (chips[chipId]) return [chipId];
  const alt = { food: ['restaurants', 'cafes'] }[chipId] || [];
  const have = alt.filter(id => chips[id]);
  return have.length ? have : [chipId];
}

// A chip's label in the UI language (by id), alone and inside a sentence.
function chipLabel(def) { return szChipLabel(def.id, def.label); }
function chipInSentence(def) { return szChipInSentence(def.id, def.label); }

function renderChips() {
  for (const def of chipsForThisZim()) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = chipLabel(def);
    b.dataset.cat = def.id;
    b.addEventListener('click', () => selectChip(def));
    els.chips.appendChild(b);
  }
}

function selectChip(def) {
  const isSame = state.chip && state.chip.id === def.id;
  state.chip = isSame ? null : def;
  for (const b of els.chips.querySelectorAll('button')) {
    b.classList.toggle('on', state.chip && b.dataset.cat === state.chip.id);
  }
  // Sub-filter is scoped to the current chip's result histogram —
  // clear it on chip change so we don't ghost-apply across queries.
  state.subFilter = null;
  rerunQuery();
}

// ---------- search ----------

function onSearch() {
  state.query = els.q.value.trim();
  // Sub-filter is scoped to the current query's result histogram.
  state.subFilter = null;
  rerunQuery();
}

function rerunQuery() {
  // 1. If a chip is on, fetch the category index.
  // 2. Else if there's a name query, fetch the matching prefix chunk(s).
  // 3. Else (nothing) — clear results.
  if (state.chip) {
    runChipQuery(state.chip);
  } else if (state.query.length >= 2) {
    runNameQuery(state.query);
  } else {
    // Supersede a chip load still in flight (chip tapped off before its
    // shards arrived), or it would render under no highlighted chip.
    ++_querySeq;
    state.results = [];
    // Drop the previous result set's chrome too — the sort row,
    // sub-filter chips and "On map" pill used to stay up over an
    // empty list after the query was cleared.
    state.lastRecords = [];
    state.subFilter = null;
    if (els.subfilterRow) _renderSubfilterChips([]);
    if (els.sortRow) els.sortRow.hidden = true;
    if (els.mapViewBtn) els.mapViewBtn.hidden = true;
    setStatus(state.query.length === 1
      ? szT('places.type_two', 'Type at least 2 characters.')
      : szT('places.type_or_pick', 'Type to search, or pick a category above.'));
    renderResults();
  }
}

// Generation counter so a slow earlier query can't overwrite the
// results of a newer one (tap Bars, tap Shops before Bars resolves →
// bars rendered under a highlighted Shops chip).
let _querySeq = 0;

async function runChipQuery(def) {
  if (maybeFetchOriginFirst()) return;
  const seq = ++_querySeq;
  setStatus(szT('places.loading_chip', 'Loading {chip}…', { chip: chipInSentence(def) }), 'loading');
  // Prefer the pre-filtered per-chip file if the ZIM was built with
  // --split-find-chips. Otherwise fall back to loading the full OMT-
  // bucket file + client-side filtering (legacy path; OOMs Chrome on
  // Japan-sized ZIMs but works on smaller regions).
  // A merged chip (Food & Drink over a pre-merge ZIM's restaurants+cafes)
  // has no manifest entry of its own, so look the geo meta up per backing
  // source. Without this, chips[def.id] was undefined, isGeo() was false,
  // and the clicked chip fell through to the legacy whole-bucket loader —
  // which on a chip-split ZIM has no bucket to load, so the Find page hung
  // with no request made at all.
  const _srcIds = chipSourcesFor(def.id);
  const _allChips = (state.manifests.cat && state.manifests.cat.chips) || {};
  if (_srcIds.length > 1 && _srcIds.every(id => CHIP_SHARDS.isGeo(_allChips[id]))) {
    const parts = [];
    for (const sid of _srcIds) {
      const r = await loadGeoChip(Object.assign({}, def, { id: sid }),
                                  _allChips[sid], seq, null);
      if (r === null) return;                 // superseded or failed
      if (r === LEGACY_CHIP) { parts.length = 0; break; }
      parts.push(r);
    }
    if (parts.length) {
      // Union two k-nearest sets and re-trim by distance. Not an exact kNN
      // over both shard sets: where both are dense the true 300th-nearest
      // can sit past one source's cut. Exact needs one shard walk spanning
      // both chips with every index mapped back to its origin — more ways to be
      // silently wrong than this is worth.
      const rows = [];
      for (const p of parts) {
        for (let i = 0; i < p.records.length; i++) {
          rows.push({ r: p.records[i], d: p.dists ? p.dists[i] : Infinity });
        }
      }
      rows.sort((a, b) => a.d - b.d);
      if (rows.length > 300) rows.length = 300;
      const merged = Object.assign({}, parts[0], {
        records: rows.map(x => x.r),
        dists: rows.map(x => x.d),
        partial: parts.some(p => p.partial),
      });
      if (seq !== _querySeq) return;
      state.geoSubRecords = null;
      applyResults(merged.records, merged);
      return;
    }
  }
  const geoMeta = _allChips[def.id];
  if (CHIP_SHARDS.isGeo(geoMeta)) {
    // A rerun of the same chip (new origin, map-area toggle) fetches
    // shards; meanwhile re-sort the rows on screen against the new
    // origin rather than leave distances from the old one up.
    if (state.resultsChipId === def.id && state.lastRecords.length) {
      _resortCurrent();
      setStatus(szT('places.loading_chip', 'Loading {chip}…', { chip: chipInSentence(def) }), 'loading');
    }
    const res = await loadGeoChip(def, geoMeta, seq, null);
    if (res === null) return;            // superseded or failed (status set)
    if (res !== LEGACY_CHIP) {
      state.geoSubRecords = null;
      applyResults(res.records, res);
      // A sub-filter survives reruns (map-area toggle, late GPS, new
      // origin): search its own nearest set again, not a slice of these.
      if (state.subFilter) _subfilterChanged();
      return;
    }
  }
  let records;
  try {
    const chipsMani = state.manifests.cat
                      && state.manifests.cat.chips;
    // A merged chip (Food & Drink over a pre-merge ZIM) has no manifest
    // entry of its own — its backing files do. Testing chipsMani[def.id]
    // alone sent every such ZIM to the category loader, which threw
    // "category 'poi' not in the index" for a chip the ZIM serves fine.
    const srcIds = chipSourcesFor(def.id);
    if (chipsMani && srcIds.some(id => chipsMani[id])) {
      records = await loadChipFile(def.id);
    } else {
      records = await loadCategory(def.cat);
      // Legacy filter path.
      if (def.subtypes && def.subtypes.length) {
        const allowed = new Set(def.subtypes);
        const extra = def.nameInclude;
        const extraAllowed = extra && extra.subtypes ? new Set(extra.subtypes) : null;
        const pattern = extra && extra.pattern;
        const includeRegex = def.includeRegex;
        records = records.filter(r => {
          if (allowed.has(r.s)) return true;
          if (includeRegex && r.s && includeRegex.test(r.s)) return true;
          if (extraAllowed && pattern && extraAllowed.has(r.s)
              && pattern.test(r.n || '')) return true;
          return false;
        });
      }
    }
  } catch (e) {
    if (seq !== _querySeq) return;
    if (e && e.code === 'no-category') {
      // The ZIM has no data behind this chip (an older build without the
      // category): an empty list and a plain sentence, not an error.
      applyResults([]);
      setStatus(szT('places.none_in_map', 'No {chip} in this map', { chip: chipInSentence(def) }), 'empty');
      return;
    }
    setStatus(szT('places.chip_failed_error', 'Couldn\'t load ‘{chip}’: {error}', { chip: chipLabel(def), error: e.message }), 'error');
    return;
  }
  if (seq !== _querySeq) return;  // superseded while loading

// Geo-sharded chips (cloud/chip_shards.py): fetch only the shards the
// 300 nearest matches need, around the chosen origin, inside the map
// area when that filter is on. The name query and sub-filter are part of
// the search (predicate), so "Starbucks" under Food & Drink's Cafe
// sub-filter finds the nearest Starbucks rather than filtering the
// nearest 300 cafés.
const LEGACY_CHIP = {};
let _regionCentreP = null;

function _regionCentre(meta) {
  if (!_regionCentreP) {
    _regionCentreP = _mapConfigP
      .then(c => {
        const ctr = c && c.center;  // [lon, lat]
        return (Array.isArray(ctr) && isFinite(ctr[0]) && isFinite(ctr[1])
                && !(ctr[0] === 0 && ctr[1] === 0))
          ? { lat: +ctr[1], lon: +ctr[0] } : null;
      })
      .catch(() => null);
  }
  return _regionCentreP.then(p => p || CHIP_SHARDS.centre(meta));
}

// Resolves the CHIP_SHARDS.load result (+ point/pointLabel), null when
// superseded or failed, or LEGACY_CHIP when there's no usable origin.
async function loadGeoChip(def, meta, seq, subtype) {
  let point = state.origin, pointLabel = null;
  const v = state.mapArea;
  if (!point && v) {
    point = { lat: (v.s + v.n) / 2, lon: (v.w + v.e) / 2 };
    pointLabel = 'view';     // which phrase the count line uses
  }
  if (!point) {
    point = await _regionCentre(meta);
    pointLabel = 'region';
    if (seq !== _querySeq) return null;
    if (!point) return LEGACY_CHIP;
  }
  const bbox = (state.mapAreaOn && v) ? { s: v.s, w: v.w, n: v.n, e: v.e } : null;
  const q = state.query;
  const predicate = (q || subtype)
    ? (r) => (!q || matchesName(r, q)) && (!subtype || (r.s || '') === subtype)
    : null;
  let res;
  try {
    res = await CHIP_SHARDS.load(meta, {
      fetchShard: (suffix) => fetchJSON(CAT + 'chip-' + def.id + '-' + suffix + '.json'),
      cache: chipShardCache,
      cacheKey: def.id,
      point, bbox, predicate,
      k: 300,
      isCancelled: () => seq !== _querySeq,
      fallbackToNearest: true,
    });
  } catch (e) {
    if (seq === _querySeq) setStatus(szT('places.chip_failed_error', 'Couldn\'t load ‘{chip}’: {error}', { chip: chipLabel(def), error: e.message }), 'error');
    return null;
  }
  if (!res || seq !== _querySeq) return null;
  if (!res.records.length && res.failed) {
    setStatus(szT('places.chip_failed', 'Couldn\'t load ‘{chip}’.', { chip: chipLabel(def) }), 'error');
    return null;
  }
  res.point = point;
  res.pointLabel = pointLabel;
  return res;
}

// Sub-filter or sort change. Geo chips re-run the nearest search with
// the subtype as part of the predicate; the sub-filter chips keep
// showing the histogram of the chip's own nearest set.
async function _subfilterChanged() {
  // A merged chip has no manifest entry of its own; re-sorting the rows
  // already on screen is right for it, which is what !isGeo(meta) does.
  const meta = state.geoBase && state.chip && state.manifests.cat
               && state.manifests.cat.chips && state.manifests.cat.chips[state.chip.id];
  // Supersede any sub-filter load still in flight, in both branches.
  const seq = ++_querySeq;
  state.geoSubRecords = null;
  if (state.geoBase) state.geo = state.geoBase;
  if (!CHIP_SHARDS.isGeo(meta) || !state.subFilter) {
    _resortCurrent();
    return;
  }
  setStatus(szT('places.loading_chip', 'Loading {chip}…',
                { chip: SZ_I18N ? _humanSubtype(state.subFilter) : _humanSubtype(state.subFilter).toLowerCase() }), 'loading');
  const res = await loadGeoChip(state.chip, meta, seq, state.subFilter);
  if (res === null || res === LEGACY_CHIP) return;
  state.geoSubRecords = res.records;
  state.geo = res;
  _resortCurrent();
}

function _resortCurrent() {
  if (state.geo && state.subFilter && state.geoSubRecords) {
    _sortAndShow(state.geoSubRecords.slice(), state.lastRecords);
  } else {
    _sortAndShow(state.lastRecords.slice());
  }
}

// Whole-chip, chunk and category arrays can be 100 MB+ each on pre-shard
// ZIMs; a Map that keeps every one tapped in a session is what got the
// page killed on phones. Keep only the last few of each kind.
const CACHE_KEEP = (navigator.deviceMemory && navigator.deviceMemory <= 2) ? 1 : 3;
function cacheKeep(map, key, value) {
  if (map.has(key)) map.delete(key);
  map.set(key, value);
  while (map.size > CACHE_KEEP) map.delete(map.keys().next().value);
  return value;
}

async function loadChipFile(chipId) {
  if (state.cache.cats.has('chip:' + chipId)) {
    return cacheKeep(state.cache.cats, 'chip:' + chipId, state.cache.cats.get('chip:' + chipId));
  }
  // Sub-bucketed chips: the build emits chip-{id}-{NN}.json
  // when chip-{id}.json would exceed 10 MB (Japan restaurants
  // 164 MB, Canada shops 137 MB — both phone-fetchable but tight
  // against iOS heap). Manifest's chips[id].sub_chunks lists the
  // bucket suffixes; fan out parallel fetches, concatenate.
  // A merged chip (Food & Drink over a pre-merge ZIM) is backed by more
  // than one file; every other chip resolves to itself.
  const sources = chipSourcesFor(chipId);
  const perSource = await Promise.all(sources.map(async (sid) => {
    const meta = (state.manifests.cat &&
                  state.manifests.cat.chips &&
                  state.manifests.cat.chips[sid]) || {};
    const subBuckets = Array.isArray(meta.sub_chunks) ? meta.sub_chunks : null;
    if (subBuckets && subBuckets.length) {
      const blobs = await Promise.all(subBuckets.map(suffix =>
        fetchJSON(CAT + 'chip-' + sid + '-' + suffix + '.json')
          .catch(() => [])));
      return [].concat(...blobs);
    }
    return fetchJSON(CAT + 'chip-' + sid + '.json').catch(() => []);
  }));
  const data = [].concat(...perSource);
  return cacheKeep(state.cache.cats, 'chip:' + chipId, data);
}

async function runNameQuery(q) {
  if (maybeFetchOriginFirst()) return;
  const seq = ++_querySeq;
  setStatus(szT('places.searching_for', 'Searching for “{q}”…', { q: q }), 'searching');
  const alive = () => seq === _querySeq;

  // Character-split ZIM: read the leaves holding what was typed, streamed
  // and filtered as they arrive (docs/search-prefix-locality.md).
  const targetedLeaves = searchLeavesFor(q);
  if (targetedLeaves) {
    let hits = await streamLeaves(targetedLeaves, q, alive);
    if (!alive()) return;
    // Targeting misses matches inside a word ("Caiçara" for "car" —
    // measured ~2% of hits, nearly all streets). Rather than show almost
    // nothing, fall back to the old whole-prefix scan.
    if (hits.length < 5 && targetedLeaves.targeted) {
      const all = searchLeavesFor(q, { noTargeting: true }) || [];
      try {
        const wider = await streamLeaves(all, q, alive);
        if (!alive()) return;
        hits = wider;
      } catch (e) {
        // Keep what targeting found rather than leaving "Searching…" up.
        if (!alive()) return;
      }
    }
    const uniq = new Map();
    for (const rec of hits) uniq.set(`${rec.n}@${rec.a},${rec.o}`, rec);
    applyResults([...uniq.values()]);
    return;
  }

  const prefixes = prefixesFor(q);
  let merged = [];
  const seen = new Map();
  for (const p of prefixes) {
    // Skip prefixes the manifest has nothing for. expandPrefix
    // covers the unsplit / hot-split / recursive-split layouts,
    // including the "empty sub_chunks list" build bug we saw on
    // Midwest's `ch` prefix.
    if (!expandPrefix(p).length) continue;
    let chunk;
    try {
      chunk = await loadChunk(p);
    } catch (e) {
      // Single missing chunk shouldn't kill the whole query.
      continue;
    }
    if (seq !== _querySeq) return;  // superseded while loading
    for (const rec of chunk) {
      // Substring match across name + subtype.
      const k = `${rec.n}@${rec.a},${rec.o}`;
      if (matchesName(rec, q)) addOnce(merged, seen, k, rec);
    }
  }
  if (seq !== _querySeq) return;
  applyResults(merged);
}

function filterByName(records, q) {
  return records.filter(r => matchesName(r, q));
}
