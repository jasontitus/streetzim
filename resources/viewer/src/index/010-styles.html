<style>
  :root {
    --ui-font: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --panel-bg: rgba(255,255,255,0.96);
    --panel-shadow: 0 2px 12px rgba(0,0,0,0.15), 0 0 0 1px rgba(0,0,0,0.04);
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --text-primary: #1a1a1a;
    --text-secondary: #6b7280;
    --text-tertiary: #9ca3af;
    --border: rgba(0,0,0,0.06);
    --hover-bg: rgba(37,99,235,0.04);
    --radius: 10px;
  }

  /* Size the page to the REAL visible window. In the Kiwix WKWebView the
     layout viewport is the full device screen (client/scrollHeight = 956 on an
     iPhone 16) but only window.innerHeight = 772 is actually visible between
     the app's top chrome and bottom toolbar (ruler-measured; visualViewport
     agrees). Percentage/vh layout therefore dropped every bottom-anchored
     control ~184px below the fold. setViewportVars() publishes the truth as
     --app-height / --bottom-inset; body is position:relative at --app-height
     so all absolutely-positioned panels (and #map with its bottom controls)
     anchor to the visible bottom; position:fixed sheets use --bottom-inset.
     The JS touch-scroll lock (lockBodyScroll) keeps the page from dragging. */
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body { position: relative; height: var(--app-height, 100%); }
  /* Safe-area insets (docs/mobile-browser-review.md §B1). --top-inset lifts
     everything anchored to the top out from under the status bar / Dynamic
     Island once the PWA is installed (viewport-fit=cover); --safe-bottom
     keeps the bottom row above the home indicator. Both are 0 in a browser
     tab and inside Kiwix. */
  /* 2026-09-19: these are NOT 0 inside Kiwix. The comment above used to claim
     they were; a user screenshot showed the search overlay sitting ~120 px
     down the map in Kiwix on iOS, because its WKWebView reports a non-zero
     env(safe-area-inset-top) even though the WebView already sits below the
     app's own chrome — so the inset was double-counted. Default to 0 and only
     lift for a real standalone/PWA launch, which is what §B1 actually wanted.
     Matches isStandalone() further down: display-mode plus navigator.standalone
     for older iOS Safari, applied via the .sz-standalone class. */
  :root { --top-inset: 0px; --safe-bottom: 0px; }
  @media (display-mode: standalone) {
    :root { --top-inset: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px); }
  }
  html.sz-standalone { --top-inset: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px); }
  #map { position: absolute; top: 0; bottom: 0; left: 0; right: 0; width: 100%; height: 100%; }
  .maplibregl-ctrl-top-right, .maplibregl-ctrl-top-left { top: var(--top-inset, 0px); }
  /* 48px: MapLibre's attribution wraps to a 44px band at phone width and
     occupies bottom 10..54, so the scale bar at bottom:0 (+10px of
     MapLibre's own margin) printed straight on top of its second line.
     Verified by injection at 320/390/430 before editing. */
  .maplibregl-ctrl-bottom-left { bottom: calc(48px + var(--safe-bottom, 0px)); }
  /* Keep the locate button above the DEAD TOUCH BAND next to the app's bottom
     toolbar: in the Kiwix WebView, taps in the lowest ~50px are swallowed by
     the native toolbar hit-slop / home-indicator gestures even though the
     content renders. min() ties the lift to --bottom-inset, so on desktop/PWA
     (inset 0) the button stays in the normal corner position. */
  .maplibregl-ctrl-bottom-right .maplibregl-ctrl-group {
    margin-bottom: calc(min(var(--bottom-inset, 0px), 64px) + var(--safe-bottom, 0px));
  }

  /* --- Online-preview banner (PWA only; docs/online-preview.md) --- */
  #preview-banner {
    position: absolute; left: 50%; bottom: calc(84px + var(--safe-bottom, 0px)); transform: translateX(-50%);
    z-index: 1; box-sizing: border-box;
    display: flex; align-items: center; justify-content: center;
    gap: 10px; flex-wrap: wrap;
    width: max-content; max-width: min(560px, calc(100% - 20px));
    padding: 8px 12px;
    background: var(--panel-bg); border-radius: var(--radius);
    box-shadow: var(--panel-shadow);
    font-family: var(--ui-font); font-size: 12px; line-height: 1.4;
    color: var(--text-secondary);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  #preview-banner[hidden] { display: none; }
  #preview-banner b { color: var(--text-primary); font-weight: 600; }
  #preview-banner-note:not(:empty) { color: #b45309; font-weight: 600; }
  /* Phones: one line of copy; the map needs the room (§D). */
  @media (max-width: 480px) { #preview-banner .long { display: none; } }
  #preview-banner a.dl {
    color: #fff; background: var(--accent); padding: 5px 10px;
    border-radius: 6px; text-decoration: none; font-weight: 600;
    white-space: nowrap;
  }
  #preview-banner a.dl:hover { background: var(--accent-hover); }
  #preview-banner button {
    /* 44px hit area (iOS HIG / Android 48dp guidance) around an 18px glyph. */
    background: none; border: none; padding: 0; line-height: 1;
    min-width: 44px; min-height: 44px; margin: -10px -6px -10px -2px;
    color: var(--text-tertiary); font-size: 18px; cursor: pointer;
  }

  /* --- Attribution / info tag --- */
  #info {
    /* 58px, not 36px: MapLibre's attribution wraps to two lines on a phone
       and occupies a 44 px band (y=790..834 at 390x844), so bottom:36px put
       this label inside it — an 18 px overlap the detector confirmed at 320,
       390 and 430. Pre-dates the mobile merge; the Kiwix safe-area inset was
       masking it by lifting everything bottom-anchored clear. */
    position: absolute; bottom: calc(84px + var(--safe-bottom, 0px)); left: 10px; z-index: 1;
    background: rgba(255,255,255,0.65); padding: 3px 8px;
    border-radius: 4px; font-family: var(--ui-font);
    font-size: 10px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    /* Reserve #attr-btn's gutter instead of a flat 250px. #attr-btn is
       right:64px and ~71px wide, so at a 320px viewport its left edge is
       x=198; #info starts at left:10px, so anything wider than ~175px runs
       under it. The flat 250px cap was unreachable at 320px, so this only
       bit regions whose NAME rendered wide enough: measured against a
       loaded ZIM, "Switzerland and the Alps (light)" renders 196px (right
       edge 206) and overlaps #attr-btn by 7px at 320px, while the shipped
       short names (101-157px) clear it. Ukraine ("Ukraine, Moldova &
       Western Russia") would be next.

       vw, not %: #info is position:absolute, so a percentage resolves
       against its containing block (the map container), not the viewport.

       border-box, because max-width caps the CONTENT box by default: with
       padding 3px 8px the 175px cap still rendered a 191px border box
       (right edge 201 vs #attr-btn's left edge 198), leaving 3px of the
       overlap in place. Measured on a loaded ZIM, not a fatal-error page. */
    box-sizing: border-box;
    max-width: min(250px, calc(100vw - 145px));
  }
  #info h3 { margin: 0; font-size: 10px; font-weight: 600; display: inline; color: var(--text-primary); }
  #info p { margin: 0; color: var(--text-tertiary); font-size: 9px; }
  /* The ways back from a dead viewer (Try again, Change map) must be
     readable and tappable, not 9 px. */
  #info .sz-recover { font-size: 13px; margin-top: 4px; }
  #info .sz-recover a, #info a.sz-change { color: #2563eb; }
  @media (pointer: coarse) {
    #info .sz-recover a, #info a.sz-change { display: inline-block; line-height: 40px; padding: 0 6px; font-size: 14px; }
  }

  /* --- Unified control strip --- */
  #controls {
    /* 152px, not 120px: the MapLibre control column runs to y=142 once
       --top-inset is 0, which overlapped this panel by 44x22 px. */
    position: absolute; top: calc(152px + var(--top-inset, 0px)); right: 10px; z-index: 2;
    display: flex; flex-direction: column;
    background: var(--panel-bg); border-radius: var(--radius);
    box-shadow: var(--panel-shadow);
    overflow: hidden; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  #controls button {
    background: transparent; border: none;
    padding: 9px 14px; font-size: 12px; font-weight: 500;
    cursor: pointer; font-family: var(--ui-font);
    color: var(--text-secondary); display: none;
    text-align: left; white-space: nowrap;
    transition: background 0.2s, color 0.2s;
    letter-spacing: -0.01em;
  }
  #controls button:hover { background: var(--hover-bg); color: var(--text-primary); }
  #controls button.active-control {
    background: var(--accent); color: #fff; font-weight: 600;
  }
  #controls button.active-control:hover {
    background: var(--accent-hover);
  }
  #controls button + button { border-top: 1px solid var(--border); }
  /* (CSS for #places-link removed alongside the Find link on
     2026-05-10 — see HTML comment in #controls.) */

  /* Pulse marker for wiki item clicks */
  .pulse-marker {
    width: 60px; height: 60px; position: relative;
    pointer-events: none;
  }
  .pulse-marker::after {
    content: ''; position: absolute; top: 50%; left: 50%;
    width: 12px; height: 12px; margin: -6px 0 0 -6px;
    border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 8px rgba(37,99,235,0.6);
  }
  .pulse-marker::before {
    content: ''; position: absolute; top: 50%; left: 50%;
    width: 12px; height: 12px; margin: -6px 0 0 -6px;
    border-radius: 50%; background: transparent;
    border: 2px solid var(--accent);
    animation: pulse-ring 1.2s ease-out 0s 4;
  }
  @keyframes pulse-ring {
    0% { transform: scale(1); opacity: 0.8; }
    100% { transform: scale(4); opacity: 0; }
  }

  /* --- Search --- */
  #search-container {
    position: absolute; top: calc(10px + var(--top-inset, 0px)); left: 50%; transform: translateX(-50%);
    z-index: 2; width: 340px;
    /* Reserve the MapLibre top-right control column. It is 54 px wide
       (44 px button under pointer:coarse + 10 px margin) and now sits at
       top:0 since --top-inset is guarded, so the old 100 px reserve (50 px
       a side) left the box overlapping it by 4 px at every width. 128 px
       gives 64 px a side = a 10 px gap at 320/390/430. */
    max-width: calc(100% - 128px);
    font-family: var(--ui-font);
  }
  /* Hidden when the find-results "Search this area" pill is on
     screen — the two affordances would otherwise compete for the
     same top-center band. Class-based with !important so a stray
     inline display from a third party can't beat it. */
  #search-container.streetzim-hidden { display: none !important; }
  /* Chip rail beneath the search input — the on-map find UI.
     Tapping a chip fetches the corresponding category-index file,
     filters by current viewport, and renders as pins + carousel
     via the existing find-results path. Replaces the click-through
     to places.html for chip-based browsing.
     Edge fade via mask: chips that scroll past the right (or left)
     edge fade out gracefully so the user can tell there's more
     content rather than a hard cut-off. */
  #find-chips {
    margin-top: 8px;
    display: flex; gap: 6px;
    padding: 2px 4px;
    /* pan-x, not auto: with auto, iOS treats a tap that drifts a few px as
       the start of a scroll, fires pointercancel and never delivers click.
       Measured in-ZIM (chipdiag2-0846): touchstart 1, touchmove 7,
       pointercancel 1, chip click handler fired 0, chip.on 0 -- i.e. the
       tap reached the rail and was cancelled, which reads to a user as
       "chips aren't clickable". The JS tap fallback below covers the rest. */
    touch-action: pan-x;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    mask-image: linear-gradient(to right,
                  transparent 0, black 14px,
                  black calc(100% - 14px), transparent 100%);
    -webkit-mask-image: linear-gradient(to right,
                  transparent 0, black 14px,
                  black calc(100% - 14px), transparent 100%);
  }
  #find-chips::-webkit-scrollbar { display: none; }
  /* display:flex / inline-flex below outrank the UA [hidden] rule, so the
     chips the manifest says this ZIM lacks stayed on screen. */
  #find-chips[hidden], #find-chips .find-chip[hidden] { display: none; }
  #find-chips .find-chip {
    flex: 0 0 auto; padding: 7px 12px;
    border-radius: 999px;
    background: rgba(255,255,255,0.96);
    color: var(--text-primary, #222);
    border: 1px solid rgba(0,0,0,0.10);
    box-shadow: 0 2px 6px rgba(0,0,0,0.10);
    font: inherit; font-size: 13px; font-weight: 500;
    cursor: pointer; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 5px;
    transition: background .15s ease, transform .08s ease;
  }
  #find-chips .find-chip:hover { background: #fff; }
  #find-chips .find-chip:active { transform: scale(0.97); }
  #find-chips .find-chip.on {
    background: #1a73e8; color: #fff; border-color: #1a73e8;
  }
  #search-input {
    width: 100%; box-sizing: border-box;
    padding: 10px 36px 10px 14px; border: none; border-radius: var(--radius);
    font-size: 14px; font-weight: 400; background: var(--panel-bg);
    box-shadow: var(--panel-shadow);
    outline: none; color: var(--text-primary);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    letter-spacing: -0.01em;
  }
  #search-input::placeholder { color: var(--text-tertiary); font-weight: 400; }
  #search-input:focus { box-shadow: 0 2px 16px rgba(37,99,235,0.15), 0 0 0 2px rgba(37,99,235,0.2); }
  #search-clear {
    position: absolute; right: 10px; top: 9px;
    background: none; border: none; font-size: 18px; color: var(--text-tertiary);
    cursor: pointer; padding: 0 4px; display: none;
    line-height: 1;
  }
  #search-clear:hover { color: var(--text-secondary); }
  /* MapLibre popups carry NO z-index of their own, so they painted below
     #search-container (z-index 2): on a phone the place card's title,
     "Directions to here" button and its close X rendered underneath the
     search box and the chip rail, and could not be tapped. This is also
     the "no X to click on" report from 2026-09-19. 4 clears the search
     container and #attr-btn (both 2) while staying far below the modal
     overlays (100 / 1500+). Measured in-ZIM on iPhone, chipdiag2-0846. */
  .maplibregl-popup { z-index: 4; }
  #search-results {
    margin-top: 6px; background: var(--panel-bg); border-radius: var(--radius);
    box-shadow: var(--panel-shadow);
    max-height: 320px; overflow-y: auto; display: none;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .search-result {
    padding: 10px 14px; cursor: pointer; border-bottom: 1px solid var(--border);
    transition: background 0.12s;
  }
  .search-result:last-child { border-bottom: none; }
  .search-result:hover, .search-result.active { background: var(--hover-bg); }
  .search-result-name { font-size: 13px; color: var(--text-primary); font-weight: 500; letter-spacing: -0.01em; }
  /* No text-transform: capitalize here. It turned the distance into
     "1 Mi" and "Nearby" and recapitalised place names ("Ravin De ..."),
     while the category it was meant for never changed: the category
     follows the name with no space between, so Chrome and WebKit count
     "Casinogrocery" as one word. The category keeps that lower case. */
  .search-result-type {
    font-size: 11px; color: var(--text-tertiary); margin-left: 6px;
    font-weight: 400;
  }
  .search-no-results {
    padding: 16px 14px; color: var(--text-tertiary); font-size: 13px; text-align: center;
  }

  /* --- Wiki panel --- */
  #wiki-panel {
    position: absolute; top: calc(10px + var(--top-inset, 0px)); left: 10px;
    bottom: calc(30px + var(--safe-bottom, 0px)); width: 320px;
    z-index: 3; background: var(--panel-bg); border-radius: var(--radius);
    box-shadow: var(--panel-shadow);
    font-family: var(--ui-font);
    display: none; flex-direction: column; overflow: hidden;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    transition: opacity 0.2s, transform 0.2s;
  }
  #wiki-panel.wiki-visible {
    display: flex;
    animation: wiki-slide-in 0.25s ease-out;
  }
  @keyframes wiki-slide-in {
    from { opacity: 0; transform: translateX(-12px); }
    to { opacity: 1; transform: translateX(0); }
  }
  /* Mobile: bottom sheet, half height, full width */
  @media (max-width: 600px) {
    #wiki-panel {
      /* bottom: 0, not --bottom-inset: the body is already sized to the
         visible height, so the extra lift floated the sheet 184 px up
         inside Kiwix. */
      top: auto; left: 0; right: 0; bottom: 0;
      width: 100%; max-height: calc(var(--app-height, 100vh) * 0.45);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      border-radius: var(--radius) var(--radius) 0 0;
    }
    #wiki-panel.wiki-visible {
      animation: wiki-slide-up 0.25s ease-out;
    }
    @keyframes wiki-slide-up {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }
  }
  #wiki-panel-header {
    padding: 14px 16px 12px; border-bottom: 1px solid var(--border);
    flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
  }
  #wiki-panel-header span {
    font-size: 12px; font-weight: 600; color: var(--text-primary);
    letter-spacing: 0.02em; text-transform: uppercase;
  }
  #wiki-panel-count {
    font-size: 11px; font-weight: 500; color: var(--text-tertiary);
    background: rgba(0,0,0,0.04); padding: 2px 8px; border-radius: 10px;
  }
  #wiki-panel-close {
    background: none; border: none; font-size: 16px; color: var(--text-tertiary);
    cursor: pointer; padding: 0 2px; line-height: 1;
    margin-left: 8px;
  }
  #wiki-panel-close:hover { color: var(--text-primary); }
  #wiki-panel-list {
    flex: 1; overflow-y: auto; padding: 4px 0;
    -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  }
  #wiki-panel-loading {
    padding: 32px 16px; text-align: center;
    color: var(--text-tertiary); font-size: 12px;
    display: none;
  }
  .wiki-item {
    padding: 10px 16px; cursor: pointer;
    transition: background 0.12s;
    border-left: 3px solid transparent;
  }
  .wiki-item:hover {
    background: var(--hover-bg);
    border-left-color: var(--accent);
  }
  .wiki-item + .wiki-item { border-top: 1px solid var(--border); }
  .wiki-item-name {
    font-size: 13px; font-weight: 600; color: var(--text-primary);
    letter-spacing: -0.01em; line-height: 1.3;
  }
  .wiki-item-meta {
    display: flex; align-items: baseline; gap: 6px;
    margin-top: 2px;
  }
  .wiki-item-type {
    font-size: 10px; color: var(--accent); text-transform: uppercase;
    font-weight: 600; letter-spacing: 0.04em;
  }
  .wiki-item-pop {
    font-size: 10px; color: var(--text-tertiary); font-weight: 500;
  }
  .wiki-item-desc {
    font-size: 12px; color: var(--text-secondary); margin-top: 4px;
    line-height: 1.45; letter-spacing: -0.005em;
    overflow: hidden; text-overflow: ellipsis;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .wiki-item-nodesc .wiki-item-name { margin-bottom: 0; }
  #wiki-refresh {
    display: none; flex-shrink: 0;
    padding: 10px 16px; border-bottom: 1px solid var(--border);
    text-align: center;
  }
  #wiki-refresh button {
    background: var(--accent); color: #fff; border: none;
    border-radius: 6px; padding: 7px 16px; font-size: 12px;
    font-weight: 600; cursor: pointer; font-family: var(--ui-font);
    letter-spacing: 0.01em; width: 100%;
    transition: background 0.15s;
  }
  #wiki-refresh button:hover { background: var(--accent-hover); }
  /* Attribution dialog */
  #attr-btn {
    /* Left of MapLibre's bottom-right control stack (the locate button,
       44 px wide on a coarse pointer): at right:10px its lower third sat
       under that button on phones. */
    position: absolute; bottom: calc(58px + var(--safe-bottom, 0px)); right: 64px; z-index: 2;
    background: rgba(255,255,255,0.65); border: none; border-radius: 4px;
    padding: 2px 7px; font-size: 11px; cursor: pointer;
    font-family: var(--ui-font); color: var(--text-secondary);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  #attr-btn:hover { background: rgba(255,255,255,0.9); color: var(--text-primary); }
  #attr-overlay {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: var(--bottom-inset, 0px);
    z-index: 100; background: rgba(0,0,0,0.4);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  #attr-dialog {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: #fff; border-radius: var(--radius); padding: 24px 28px;
    max-width: 480px; width: calc(100% - 40px);
    max-height: calc(var(--app-height, 100vh) * 0.8); overflow-y: auto;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    font-family: var(--ui-font);
  }
  #attr-dialog h2 {
    margin: 0 0 16px; font-size: 16px; font-weight: 700;
    color: var(--text-primary); letter-spacing: -0.02em;
  }
  #attr-dialog section { margin-bottom: 14px; }
  #attr-dialog h3 {
    margin: 0 0 2px; font-size: 12px; font-weight: 700;
    color: var(--accent); text-transform: uppercase; letter-spacing: 0.04em;
  }
  #attr-dialog p {
    margin: 0; font-size: 13px; color: var(--text-secondary); line-height: 1.5;
  }
  #attr-dialog .license {
    font-size: 11px; color: var(--text-tertiary); font-style: italic;
  }
  #attr-close {
    position: absolute; top: 12px; right: 14px;
    background: none; border: none; font-size: 20px; color: var(--text-tertiary);
    cursor: pointer; line-height: 1;
  }
  #attr-close:hover { color: var(--text-primary); }

  .wiki-empty-state {
    padding: 40px 24px; text-align: center;
  }
  .wiki-empty-state-icon {
    font-size: 28px; margin-bottom: 8px; opacity: 0.3;
  }
  .wiki-empty-state-text {
    font-size: 13px; color: var(--text-tertiary); line-height: 1.5;
  }

  /* --- Routing --- */
  #routing-panel {
    display: none; position: absolute; top: calc(10px + var(--top-inset, 0px)); left: 10px; z-index: 3;
    width: 280px; max-width: calc(100% - 80px);
    background: var(--panel-bg); border-radius: var(--radius);
    box-shadow: var(--panel-shadow);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    font-family: var(--ui-font); font-size: 13px;
    padding: 12px 14px;
  }
  #routing-panel h4 {
    margin: 0 0 10px; font-size: 13px; font-weight: 600;
    color: var(--text-primary); display: flex; justify-content: space-between; align-items: center;
  }
  #routing-panel h4 button {
