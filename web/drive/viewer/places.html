    var out = [];
    for (var i = 0; i < declared.length; i++) {
      var p = declared[i] ? declared[i].split(SEP) : [];
      if (isPrefixOf(p, typed, true) || isPrefixOf(typed, p, false)) out.push(declared[i]);
    }
    return out;
  }

  // Leaf names for one prefix, tier by tier, in fetch order. Returns null
  // when this ZIM has no character split for the prefix (caller keeps the
  // old whole-prefix behaviour), or [] when the typed characters exist in
  // no path at all — which means no records, not "fetch everything".
  // The declared paths of a character-split prefix: char_split, or
  // char_ranges when its plan groups siblings (an older viewer ignores that
  // key and reads the prefix whole -- slow, never wrong).
  function splitPaths(manifest, prefix) {
    if (!manifest) return null;
    return (manifest.char_split && manifest.char_split[prefix])
      || (manifest.char_ranges && manifest.char_ranges[prefix]) || null;
  }

  function leavesFor(manifest, prefix, word, query, resolve) {
    var cs = splitPaths(manifest, prefix);
    if (!cs || !cs.length) return null;
    var typed = pathTokens(prefix, word);
    if (!typed.length) return null;            // 1-2 chars: whole prefix
    var paths = pathsFor(cs, typed);
    if (!paths.length) return [];
    // Addresses are ~86% of a hot prefix and are only what the user wants
    // once they type a house number; the map viewer already discards them
    // for non-digit queries, after downloading them.
    var tiers = TIERS.slice();
    if (/\d/.test(query || '') && String(query || '').replace(/\W/g, '').length >= 4) {
      tiers.push('a');
    }
    var out = [];
    var seen = {};
    for (var t = 0; t < tiers.length; t++) {
      for (var i = 0; i < paths.length; i++) {
        var name = prefix + SEP + paths[i] + SEP + tiers[t];
        // Through expandPrefix, never a direct fetch: a later repackage
        // hash-splits an oversized leaf into name-0…name-f and copies
        // char_split through verbatim.
        var leaves = resolve(name);
        for (var j = 0; j < leaves.length; j++) {
          if (!seen[leaves[j]]) { seen[leaves[j]] = 1; out.push(leaves[j]); }
        }
      }
    }
    return out;
  }

  return {
    fold: fold,
    wordRule: wordRule,
    words: words,
    tokenFor: tokenFor,
    pathTokens: pathTokens,
    pathsFor: pathsFor,
    splitPaths: splitPaths,
    tokenMatches: tokenMatches,
    leavesFor: leavesFor,
    TERMINAL: TERMINAL,
    _test: { isPrefixOf: isPrefixOf }
  };
})();
// END search-shards

// Accent-fold + lowercase, exactly the writer's `norm` in
// cloud/search_shards.py (SEARCH_SHARDS.fold above: NFKD, strip marks of
// canonical combining class != 0) so "ecouen" finds "Écouen", katakana
// dakuten fold, and Indic vowel signs are kept as the index keeps them.
function foldText(s) {
  return SEARCH_SHARDS.fold(s);
}

function matchesName(rec, q) {
  const ql = foldText(q);
  if (foldText(rec.n).includes(ql) || foldText(rec.s).includes(ql)) return true;
  // The name in its own script (cloud/search_shards.record_names).
  if (typeof rec.nn === 'string' && rec.nn && foldText(rec.nn).includes(ql)) return true;
  if (typeof rec.nl === 'string' && rec.nl && foldText(rec.nl).includes(ql)) return true;
  // Its names in other languages (`ln`: "Genf" for Geneva).
  if (rec.ln && typeof rec.ln === 'object'
      && Object.values(rec.ln).some((v) => typeof v === 'string' && v && foldText(v).includes(ql))) return true;
  // An administrative area (t: 'admin') also answers to its other names
  // and to "<name> <type>" / "<type> of <name>" ("City of Alexandria"),
  // as in the map's search box (index.html, admin-search).
  if (rec.t !== 'admin') return false;
  // Any word order; "of", "de", ... may be left out, but not every word.
  const CONNECTORS = new Set(['of', 'de', 'du', 'des', 'del', 'di', 'la', 'le', 'the']);
  const words = ql.split(/\s+/).filter((w) => w);
  if (!words.some((w) => !CONNECTORS.has(w))) return false;
  const label = foldText(rec.s);
  for (const nm of [rec.n, rec.nn, rec.nl].filter(Boolean).concat(Array.isArray(rec.alt) ? rec.alt : [])) {
    const h = foldText(nm);
    if (!h) continue;
    const forms = label ? [h, h + ' ' + label, label + ' of ' + h] : [h];
    if (forms.some((f) => words.every((w) => f.includes(w) || CONNECTORS.has(w)))) return true;
  }
  return false;
}

// The viewer fragment for a record's "Map" button: an administrative area
// with a box is fitted to it (`bounds=`; `map=` for older viewers).
function mapHashFor(r, here) {
  const pin = '&pin=' + r.a + ',' + r.o + '&label=' + encodeURIComponent(r.n || '');
  const bb = r.bb;
  if (r.t === 'admin' && Array.isArray(bb) && bb.length === 4
      && bb.every((v) => typeof v === 'number' && isFinite(v))) {
    const [w, s, e, n] = bb;
    const merc = (lat) => {
      const t = Math.max(-85, Math.min(85, lat)) * Math.PI / 180;
      return (1 - Math.log(Math.tan(t) + 1 / Math.cos(t)) / Math.PI) / 2;
    };
    const fx = Math.max((e - w) / 360, 1e-9), fy = Math.max(Math.abs(merc(s) - merc(n)), 1e-9);
    let z = Math.min(Math.log2(1024 / (512 * fx)), Math.log2(768 / (512 * fy))) - 0.25;
    z = Math.round(Math.max(2, Math.min(16, z)) * 10) / 10;
    return here + 'index.html#map=' + z + '/' + ((s + n) / 2).toFixed(5) + '/'
         + ((w + e) / 2).toFixed(5) + '&bounds=' + bb.join(',') + pin;
  }
  const zoom = r.t === 'admin'
    ? ({ 2: 5, 3: 6, 4: 7, 5: 8, 6: 10, 7: 11, 8: 12, 9: 13, 10: 14 }[r.al] || 12)
    : (r.t === 'place' || r.t === 'park') ? 14 : 16;
  return here + 'index.html#map=' + zoom + '/' + r.a + '/' + r.o + pin;
}

// Chunk key for a word — MUST match the writer's `prefix_key` in
// cloud/search_shards.py (and `keyFor` in index.html): Latin-leading words
// use their first two ASCII-alnum chars (anything else → '_'),
// non-ASCII first chars bucket into 'u' + hex codepoint. The previous
// `q.slice(0, 2)` never matched the writer for accented, CJK, or
// punctuation-leading names, so those searches returned nothing.
function prefixKeyFor(word) {
  if (!word) return '__';
  const c0 = word.codePointAt(0);
  if (c0 >= 128) return 'u' + c0.toString(16);
  function asciiNorm(ch) {
    const code = ch.charCodeAt(0);
    const alnum = (code >= 48 && code <= 57) || (code >= 97 && code <= 122);
    return (alnum || ch === '_') ? ch : '_';
  }
  const a = asciiNorm(word[0]);
  const b = word.length > 1 ? asciiNorm(word[1]) : '_';
  return a + b;
}

function prefixesFor(q) {
  // Same logic the build script uses to chunk: 2-char prefixes of any
  // word in the (accent-folded) name. Try the query head and each word.
  const out = new Set();
  const folded = foldText(q).trim();
  if (folded.length >= 2) out.add(prefixKeyFor(folded.replace(/\s/g, '_')));
  const man = state.manifests && state.manifests.search;
  for (const word of SEARCH_SHARDS.words(folded, man)) out.add(prefixKeyFor(word));
  return [...out];
}

// Leaf names to read for a query, using the character split when the ZIM
// has one (docs/search-prefix-locality.md). Returns null when no prefix is
// character-split, so the caller keeps the old whole-prefix path.
// `targeted` reports whether any prefix resolved through char_split, so the
// caller knows a thin result set is worth re-running unfiltered.
function searchLeavesFor(q, opts) {
  const man = state.manifests && state.manifests.search;
  if (!man || !(man.char_split || man.char_ranges)) return null;
  const folded = foldText(q).trim();
  if (folded.length < 3) return null;      // 2 chars: whole prefix, as before
  const words = SEARCH_SHARDS.words(folded, man);
  words.push(folded.replace(/\s/g, '_'));
  const seen = new Set();
  const out = [];
  let targeted = false;
  for (const word of words) {
    const key = prefixKeyFor(word);
    const leaves = (opts && opts.noTargeting) ? null
      : SEARCH_SHARDS.leavesFor(man, key, word, folded, expandPrefix);
    if (leaves === null) {
      for (const leaf of expandPrefix(key)) {
        if (!seen.has(leaf)) { seen.add(leaf); out.push(leaf); }
      }
      continue;
    }
    targeted = true;        // [] means "no records for those characters"
    for (const leaf of leaves) {
      if (!seen.has(leaf)) { seen.add(leaf); out.push(leaf); }
    }
  }
  out.targeted = targeted;
  return out;
}

// Fetch leaves in order, filtering as each arrives, and stop once we have
// enough. The map page has had this since "san " OOM'd iOS Safari; this
// page still concatenated every leaf, which is why the Find page was the
// worse of the two on a hot prefix.
async function streamLeaves(leaves, q, seqCheck) {
  const qn = foldText(q);
  // Address leaves are only in `leaves` when searchLeavesFor decided the
  // query earns them (a digit and >= 4 characters), so anything that
  // arrives here is wanted; this only filters the legacy whole-prefix path.
  const includeAddrs = /\d/.test(qn);
  const MAX_CONCURRENT = 6;
  const MAX_MATCHES = 2000;
  const matches = [];
  let i = 0;
  async function worker() {
    while (i < leaves.length && matches.length < MAX_MATCHES) {
      const name = leaves[i++];
      let chunk;
      try { chunk = await fetchJSON(DATA + name + '.json'); } catch (e) { continue; }
      if (seqCheck && !seqCheck()) return;
      for (const rec of chunk) {
        if (!includeAddrs && rec.t === 'addr') continue;
        if (!matchesName(rec, q)) continue;
        matches.push(rec);
        if (matches.length >= MAX_MATCHES) break;
      }
    }
  }
  await Promise.all(Array.from(
    { length: Math.min(MAX_CONCURRENT, leaves.length) }, worker));
  return matches;
}

// ---------- result presentation ----------

// sessionStorage key the viewer (index.html) reads on load to spawn
// pins for the current Find result set. Same key for places.html
// (the writer) and index.html (the reader); both are same-origin in
// every host (PWA, Kiwix Desktop, kiwix-serve, iOS Kiwix).
const FIND_RESULTS_STASH_KEY = 'streetzim_find_results';

// Only the fields the viewer actually needs to render a pin + popup
// — name, lat/lon, type/subtype/category, brand, contact links. Keeps
// the JSON blob small for sessionStorage (which has a few-MB cap on
// most browsers).
function _pinShape(r) {
  const out = { n: r.n, a: r.a, o: r.o };
  for (const k of ('t s cat l ws p soc brand wd'.split(' '))) {
    if (r[k]) out[k] = r[k];
  }
  return out;
}

function stashResultsForMap(label) {
  try {
    const stash = {
      label: label || '',
      // here: the GPS fix, so the map's place sheet says "from current
      // location" in its own words rather than echoing our label.
      origin: state.origin
        ? { lat: state.origin.lat, lon: state.origin.lon,
            label: state.originLabel, here: state.originMode === 'gps' } : null,
      items: state.results.map(_pinShape),
    };
    sessionStorage.setItem(FIND_RESULTS_STASH_KEY,
                           JSON.stringify(stash));
    return true;
  } catch (e) {
    // sessionStorage can throw QuotaExceededError on tiny mobile
    // budgets; surface to the user rather than silently navigating
    // to an empty map.
    console.warn('stash failed:', e);
    setStatus(szT('places.handoff_failed', 'Couldn\'t hand off to the map ({error}). Reduce the result set and try again.',
                  { error: e.message }), 'error');
    return false;
  }
}

function applyResults(records, geo) {
  // `geo`: set for geo-sharded chips — records are already scoped to the
  // map area (with fallback) and capped to the nearest matches.
  state.geo = geo || null;
  state.geoBase = state.geo;
  // Hard-filter to the map's last viewport when the user opted in.
  // Done before sort/cap so distance + count reflect the filtered set.
  // Auto-fallback: if the bbox filter would leave zero results,
  // expand to the unfiltered set instead of showing "0 matches".
  // The user has the toggle ticked by default; we don't want them
  // to think there's nothing in their area when there's just nothing
  // *of this type* in their immediate viewport — better to surface
  // what's around the city/region.
  let filteredOut = 0;
  let autoExpanded = false;
  if (geo) {
    autoExpanded = !!(geo.fellBack && state.mapAreaOn && state.mapArea);
  } else if (state.mapAreaOn && state.mapArea) {
    const v = state.mapArea;
    const inside = (r) =>
      r.a >= v.s && r.a <= v.n && _lonInside(r.o, v.w, v.e);
    const next = [];
    for (const r of records) {
      if (inside(r)) next.push(r); else filteredOut++;
    }
    if (next.length > 0) {
      records = next;
    } else if (records.length > 0) {
      // Filter would have wiped everything — keep the original set
      // and flag for the status line.
      autoExpanded = true;
      filteredOut = 0;
    }
  }
  // Stash the post-filter records so the sort row can re-sort
  // without re-running the search.
  state.lastRecords = records.slice();
  state.resultsChipId = state.chip ? state.chip.id : null;
  state._lastFilteredOut = filteredOut;
  state._autoExpanded = autoExpanded;
  // Save to recent history when the search produced anything.
  if (records.length > 0) {
    if (state.chip) {
      saveRecent({ kind: 'chip', value: state.chip.id,
                   label: state.chip.label, ts: Date.now() });
    } else if (state.query && state.query.length >= 2) {
      saveRecent({ kind: 'query', value: state.query,
                   label: state.query, ts: Date.now() });
    }
  }
  _sortAndShow(records);
}

// Build "italian / shoe shop / bakery" style sub-filter chips from
// the current result set's r.s histogram. Top 8 by count, hidden
// when there's only one (or zero) distinct subtype — nothing to
// filter against. Idempotent: re-runs on every applyResults / sort
// change without leaking listeners.
function _renderSubfilterChips(records) {
  if (!els.subfilterRow) return;
  const counts = new Map();
  for (const r of records) {
    const s = (r.s || '').trim();
    if (!s) continue;
    counts.set(s, (counts.get(s) || 0) + 1);
  }
  const subs = Array.from(counts.entries())
    .filter(([_, n]) => n >= 2)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 8);
  while (els.subfilterRow.firstChild) {
    els.subfilterRow.removeChild(els.subfilterRow.firstChild);
  }
  if (subs.length < 2) {
    els.subfilterRow.hidden = true;
    return;
  }
  els.subfilterRow.hidden = false;
  // "All" pseudo-chip for clearing the filter — only meaningful when
  // a subfilter is currently active.
  if (state.subFilter) {
    const all = document.createElement('button');
    all.type = 'button';
    all.className = 'sub-chip';
    all.textContent = szT('find.all', 'All');
    all.addEventListener('click', () => {
      state.subFilter = null;
      _subfilterChanged();
    });
    els.subfilterRow.appendChild(all);
  }
  for (const [sub, count] of subs) {
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'sub-chip' + (sub === state.subFilter ? ' on' : '');
    chip.textContent = `${_humanSubtype(sub)} · ${count}`;
    chip.addEventListener('click', () => {
      state.subFilter = (state.subFilter === sub) ? null : sub;
      _subfilterChanged();
    });
    els.subfilterRow.appendChild(chip);
  }
}

// "3 matches", or for none "No matches" rather than a count: CLDR files 0
// under "one" in some languages (Portuguese "0 resultado").
function _szMatchCount(n) {
  if (n === 0) return szT('places.zero_matches', 'No matches');
  return szTn('places.n_matches', n, { one: '{n} match', other: '{n} matches' });
}

function _humanSubtype(s) {
  // OSM/Overture subtypes are snake_case; humans want spaces and
  // sentence case. "italian_restaurant" → "Italian restaurant".
  if (!s) return s;
  return szPlaceType(s).replace(/^./, c => c.toUpperCase());
}

function _sortAndShow(records, histogramRecords) {
  // Render sub-filter chips from the unfiltered set so the user
  // can always see all subtypes available, even after a sub-filter
  // is applied. Then narrow `records` if a subfilter is active.
  _renderSubfilterChips(histogramRecords || records);
  if (state.subFilter) {
    records = records.filter(r => (r.s || '') === state.subFilter);
  }
  const mode = _effectiveSortMode();
  if (mode === 'distance' && state.origin) {
    for (const r of records) {
      r._dist = haversine(state.origin.lat, state.origin.lon, r.a, r.o);
    }
    records.sort((a, b) => a._dist - b._dist);
  } else {
    // Records are shared cached objects: a distance computed for an
    // earlier origin would otherwise keep rendering after the origin
    // was dropped (GPS denied after a custom pick, etc.).
    for (const r of records) r._dist = undefined;
  }
  if (mode === 'distance' && state.origin) {
    // sorted above
  } else if (mode === 'category') {
    records.sort((a, b) => {
      const ca = (a.cat || a.s || a.t || '').toString();
      const cb = (b.cat || b.s || b.t || '').toString();
      return ca.localeCompare(cb)
          || (a.n || '').localeCompare(b.n || '');
    });
  } else { // name (default)
    records.sort((a, b) => (a.n || '').localeCompare(b.n || ''));
  }
  // Cap to keep the DOM responsive on big indices.
  state.results = records.slice(0, 300);
  // Built from clauses, each a whole phrase in the table: the count, then
  // where / how it was searched, then the map-area note.
  let countLine;
  if (state.geo) {
    // Geo-sharded chip: the nearest matches to geo.point, not every
    // match in the region.
    const n = state.results.length;
    countLine = n >= 300
      ? szT('places.n_nearest', '{n} nearest matches', { n: n })
      : _szMatchCount(n);
    if (!state.origin && state.geo.pointLabel) {
      countLine += ' ' + (state.geo.pointLabel === 'view'
        ? szT('places.near_map_view', 'near the map view')
        : szT('places.near_region_middle', 'near the middle of the region'));
    }
    if (n >= 300 && mode !== 'distance') {
      countLine += mode === 'category' ? szT('places.sorted_by_category', ', sorted by category')
                                       : szT('places.sorted_by_name', ', sorted by name');
    }
    if (state.geo.partial && isFinite(state.geo.radiusKm)) {
      countLine += ' ' + szT('places.searched_within', '(searched within {dist})',
                             { dist: formatDistance(state.geo.radiusKm * 1000) });
    }
  } else if (records.length > state.results.length) {
    countLine = szT('places.showing_first', 'Showing first {shown} of {total} matches',
                    { shown: state.results.length, total: records.length });
  } else {
    countLine = _szMatchCount(state.results.length);
  }
  if (state.mapAreaOn && state.mapArea && state._lastFilteredOut > 0) {
    countLine += ' ' + szT('places.filtered_outside', '(filtered {n} outside map area)', { n: state._lastFilteredOut });
  } else if (state._autoExpanded) {
    countLine += ' ' + szT('places.none_in_area_all', '(none in map area — showing all)');
  }
  // The full stop is the language's: none in Thai, 。 in Chinese.
  countLine = szT('places.status_sentence', '{text}.', { text: countLine });
  state._statusBase = countLine;  // applyStatusNote rebuilds from this
  if (state.originMode === 'none' && state.originNote) {
    countLine += ' — ' + state.originNote;
  }
  setStatus(countLine, state.results.length ? 'done' : 'empty');
  // Show the sort row only when there's a meaningful number to sort.
  if (els.sortRow) {
    els.sortRow.hidden = state.results.length < 2;
    _refreshSortButtons();
  }
  // Show the "On map" pill iff there's something to plot. Toggle
  // every applyResults call so chip/query swaps refresh visibility.
  if (els.mapViewBtn) els.mapViewBtn.hidden = state.results.length === 0;
  renderResults();
}

function renderResults() {
  els.results.innerHTML = '';
  for (const r of state.results) {
    const li = document.createElement('li');
    // Metres, for the smoke gate: the text is in the map's language.
    if (r._dist != null) li.dataset.distM = String(Math.round(r._dist));

    const h = document.createElement('h3');
    // Shown cut at a ";" (runtime szFirstName); matching keeps the record's value.
    h.textContent = szFirstName(r.n) || szT('common.unnamed', '(unnamed)');
    li.appendChild(h);

    const meta = document.createElement('p');
    meta.className = 'meta';
    const parts = [];
    // Prefer Overture's normalized category over OMT's subtype for display.
    const kindLabel = r.cat || r.s;
    if (kindLabel) parts.push(prettyKind(kindLabel));
    if (r._dist != null) parts.push(formatDistance(r._dist));
    if (r.l) parts.push(r.l);
    meta.textContent = parts.join(' · ');
    li.appendChild(meta);

    // Enrichment row — website / phone / socials when Overture supplied
    // them. Keep the markup lean: icon-only links row.
    // `ws` (website), not `w` — `w` is reserved for the OSM Wikipedia
    // tag in the same record; see commit fa6208b.
    if (r.ws || r.p || (r.soc && r.soc.length) || r.brand || r.w) {
      const rich = document.createElement('p');
      rich.className = 'rich';
      if (r.brand) {
        const b = document.createElement('span');
        b.className = 'brand';
        b.textContent = r.brand;
        rich.appendChild(b);
      }
      const links = document.createElement('span');
      links.className = 'links';
      const wsUrl = safeHttpUrl(r.ws);
      if (wsUrl) {
        const a = document.createElement('a');
        a.href = wsUrl; a.target = '_blank'; a.rel = 'noopener';
        a.title = wsUrl; a.textContent = '🌐';
        links.appendChild(a);
      }
      if (r.w) {
        // OSM Wikipedia title ("en:Article Title"), incl. titles backfilled
        // from a wikidata Q-ID. Links to the public site (the rich detail
        // panel in index.html prefers a local Wikipedia ZIM when present).
        const wt = String(r.w), wc = wt.indexOf(':');
        const isLang = wc >= 2 && wc <= 3 && /^[a-z]+$/i.test(wt.slice(0, wc));
        const wl = isLang ? wt.slice(0, wc).toLowerCase() : 'en';
        const wtitle = (isLang ? wt.slice(wc + 1) : wt).replace(/ /g, '_');
        const a = document.createElement('a');
        a.href = 'https://' + wl + '.wikipedia.org/wiki/' + encodeURIComponent(wtitle);
        a.target = '_blank'; a.rel = 'noopener';
        a.title = szT('place.wikipedia', 'Wikipedia'); a.textContent = '📖';
        links.appendChild(a);
      }
      if (r.p) {
        const a = document.createElement('a');
        a.href = 'tel:' + String(r.p).replace(/\s+/g, '');
        a.title = String(r.p); a.textContent = '📞';
        links.appendChild(a);
      }
      if (r.soc && r.soc.length) {
        for (const raw of r.soc.slice(0, 3)) {
          const s = safeHttpUrl(raw);
          if (!s) continue;
          const host = s.toLowerCase();
          const g = /facebook/.test(host) ? 'f'
                  : /instagram/.test(host) ? 'IG'
                  : /twitter|x\.com/.test(host) ? '𝕏'
                  : /tiktok/.test(host) ? 'TT' : '•';
          const a = document.createElement('a');
          a.href = s; a.target = '_blank'; a.rel = 'noopener';
          a.title = s; a.textContent = g;
          links.appendChild(a);
        }
      }
      rich.appendChild(links);
      li.appendChild(rich);
    }

    const ctas = document.createElement('div');
    ctas.className = 'ctas';
    const dirA = document.createElement('a');
    dirA.className = 'primary';
    dirA.textContent = szT('place.directions', 'Directions');
    // If we already have the user's location (from the sort-by-distance
    // toggle), pass it as `origin=…` so the viewer's routing panel can
    // fill both endpoints up front instead of forcing the user to tap
    // the GPS button and wait for a second fix.
    // Use the runtime-computed `HERE` (line ~146) instead of static
    // `../index.html` or bare `index.html`. The two hosting paths
    // disagree on what the right base is:
    //   - Firebase PWA serves places at `/drive/viewer/places/`
    //     (trailingSlash:true) → relative `index.html` resolves to
    //     `/drive/viewer/places/index.html` (404). `../index.html`
    //     works here but…
    //   - Kiwix Desktop / iOS Kiwix serve places.html at the ZIM
    //     root → `../index.html` is OUT OF BOUNDS (zimcheck failure
    //     on every shipped ZIM). Bare `index.html` works here.
    // HERE = location.pathname stripped of the trailing filename,
    // so HERE + 'index.html' resolves correctly on both: PWA gets
    // `/drive/viewer/index.html`, Kiwix gets `<zim-root>/index.html`.
    let href = HERE + 'index.html#dest=' + r.a + ',' + r.o
             + '&label=' + encodeURIComponent(r.n || '');
    // Only a real GPS fix may ride along as origin — index.html labels
    // any `origin=` "Current location" and caches it as the device
    // position, which was wrong for a "Search near <city>" pick or a
    // viewport-centre deep link.
    if (state.origin && state.originMode === 'gps') {
      href += '&origin=' + state.origin.lat + ',' + state.origin.lon;
    }
    dirA.href = withUiLang(href);
    ctas.appendChild(dirA);
    const mapA = document.createElement('a');
    mapA.textContent = szT('controls.map', 'Map');
    mapA.href = withUiLang(mapHashFor(r, HERE));
    ctas.appendChild(mapA);

    li.appendChild(ctas);
    els.results.appendChild(li);
  }
}

function prettyKind(s) {
  return szPlaceType(s);
}

// In the units the map's scale bar is set to: the viewer keeps the choice
// in localStorage 'streetzim.units'; with none saved, the locale decides as
// in the viewer (szLocaleUnit): imperial for en-US or a US/LR/MM region.
function distanceUnit(nav) {
  try {
    const u = window.localStorage.getItem('streetzim.units');
    if (u === 'metric' || u === 'imperial') return u;
  } catch (e) { /* no storage: fall through */ }
  nav = nav === undefined ? (typeof navigator !== 'undefined' ? navigator : null) : nav;
  let tag = '';
  try { tag = String((nav && nav.languages && nav.languages[0]) || (nav && nav.language) || ''); } catch (e) { /* none */ }
  const m = /^[a-z]{2,3}(?:-[a-z]{4})?-([a-z]{2})\b/i.exec(tag);
  const region = m ? m[1].toUpperCase() : '';
  return region === 'US' || region === 'LR' || region === 'MM' ? 'imperial' : 'metric';
}

// An isolated left-to-right run in a right-to-left UI (szLtr).
function formatDistance(m, unit) {
  if (m == null || !isFinite(m)) return '';
  if ((unit || distanceUnit()) === 'imperial') {
    const feet = m * 3.28084;
    if (feet < 1000) return szLtr(Math.round(feet) + ' ft');
    const miles = m / 1609.344;
    return szLtr((miles < 10 ? szFixed(miles, 1) : Math.round(miles)) + ' mi');
  }
  if (m < 1000) return szLtr(Math.round(m) + ' m');
  return szLtr(szFixed(m / 1000, m < 10000 ? 1 : 0) + ' km');
}

// ---------- Origin selection ----------
// originMode: 'gps' (implicit my-location) | 'custom' (user picked a
// named place from the near-typeahead) | 'none' (GPS denied/refused —
// falls back to alphabetical sort).
state.originMode = 'gps';
state.originLabel = 'My location';

// The "Search near" box shows either a place or "My location" (the GPS
// fix). Which one is a flag, data-sz-here, not the text: the text is in
// the map's language.
function myLocationLabel() { return szT('places.my_location', 'My location'); }
function showNearHere() {
  els.near.value = myLocationLabel();
  els.near.setAttribute('data-sz-here', '');
}
function showNearPlace(text) {
  els.near.value = text;
  els.near.removeAttribute('data-sz-here');
}

function requestGPS() {
  if (!navigator.geolocation) {
    state.origin = null;
    state.originMode = 'none';
    state.originNote = szT('places.no_geolocation', 'No geolocation on this device — pick a place under "Search near" to sort by distance.');
    // Re-run so the chip / query that triggered this isn't dropped.
    rerunQuery();
    return;
  }
  setStatus(szT('places.getting_location', 'Getting your location…'), 'locating');
  // Ownership: while the prompt is up the user may pick "Search near
  // <place>" or a deep link may install a viewport origin. Those set
  // originMode to 'custom' / 'viewport'; none of the callbacks below
  // may then clobber the origin they chose.
  function gpsStillWanted() {
    return state.originMode === 'gps' || state.originMode === 'none';
  }
  // The 8 s geolocation timeout only starts once permission is
  // granted; an unanswered permission prompt would otherwise leave
  // "Getting your location…" up forever with the query never run.
  let gaveUp = false;
  const giveUp = setTimeout(() => {
    gaveUp = true;
    if (!gpsStillWanted() || state.origin) return;
    state.originMode = 'none';
    state.originNote = szT('places.location_not_yet', 'Location not available yet — sorted by name.');
    rerunQuery();
  }, 12000);
  navigator.geolocation.getCurrentPosition(
    pos => {
      clearTimeout(giveUp);
      // A late grant (after the 12 s give-up) is still welcome as long
      // as nobody picked another origin in the meantime.
      if (!gpsStillWanted()) return;
      state.origin = { lat: pos.coords.latitude, lon: pos.coords.longitude };
      state.originMode = 'gps';
      state.originLabel = myLocationLabel();
      state.originNote = '';
      showNearHere();
      rerunQuery();
    },
    err => {
      clearTimeout(giveUp);
      if (!gpsStillWanted() || state.origin) return;
      state.originMode = 'none';
      // Kept in state and appended to the result count line by
      // _sortAndShow, because a plain setStatus here was overwritten
      // a moment later by the query's own status text.
      state.originNote = szT('places.location_unavailable', 'Location unavailable ({error}) — sorted by name. Pick a place under "Search near" to sort by distance.',
                             { error: err.message });
      if (!gaveUp) rerunQuery();  // the give-up timer already re-ran it
      else applyStatusNote();
    },
    { enableHighAccuracy: false, maximumAge: 60000, timeout: 8000 }
  );
}

// Re-apply the origin note to the current status line (used when the
// note changes after the results have already been rendered).
function applyStatusNote() {
  if (state.originNote && state._statusBase && state.results.length) {
    // Rebuild from the stored base line — splitting the live text on
    // ' — ' also cut "(none in map area — showing all)" in half.
    setStatus(state._statusBase + ' — ' + state.originNote, 'done');
  }
}

// Lazy trigger — called before running a chip or name query. When the
// user hasn't picked a custom origin and we haven't fetched GPS, ask
// for it; return true so the caller waits (requestGPS's success
// handler fires rerunQuery). Returns false when caller can proceed.
function maybeFetchOriginFirst() {
  // Viewport origin (from hash) and custom origin (user picked a
  // named place) both skip GPS — they already have a point.
  if (state.originMode === 'viewport' && state.origin) return false;
  if (state.originMode === 'custom' && state.origin) return false;
  if (state.originMode === 'none') return false;
  if (!state.origin) { requestGPS(); return true; }
  return false;
}

// --- near-typeahead ---

function hideNearResults() {
  els.nearResults.hidden = true;
  els.nearResults.replaceChildren();
}

function renderNearResults(cands, activeIdx) {
  els.nearResults.replaceChildren();
  if (!cands.length) {
    const msg = document.createElement('div');
    msg.className = 'near-result';
    msg.style.color = 'var(--muted)';
    msg.textContent = szT('places.no_matches', 'No matches.');
    els.nearResults.appendChild(msg);
    els.nearResults.hidden = false;
    return;
  }
  cands.forEach((c, i) => {
    const row = document.createElement('div');
    row.className = 'near-result' + (i === activeIdx ? ' active' : '');
    row.setAttribute('role', 'option');
    const nameEl = document.createElement('div');
    nameEl.textContent = szFirstName(c.n) || szT('common.unnamed', '(unnamed)');
    row.appendChild(nameEl);
    const sub = [];
    if (c.cat) sub.push(prettyKind(c.cat));
    else if (c.s) sub.push(prettyKind(c.s));
    if (c.l) sub.push(c.l);
    if (sub.length) {
      const subEl = document.createElement('div');
      subEl.className = 'sub';
      subEl.textContent = sub.join(' · ');
      row.appendChild(subEl);
    }
    row.addEventListener('click', () => pickNearResult(c));
    els.nearResults.appendChild(row);
  });
  els.nearResults.hidden = false;
}

// Add a record to `list` once per name and point (`seen`: key -> index).
// An administrative area is often placed at its label node, which is also
// a place record with the same name and point: the area's record, with
// its box, wins that tie whichever comes first (as in the viewer).
function addOnce(list, seen, key, rec) {
  const at = seen.get(key);
  if (at === undefined) { seen.set(key, list.length); list.push(rec); return; }
  if (rec.t === 'admin' && list[at].t !== 'admin') list[at] = rec;
}

let nearActive = -1;
let nearCandidates = [];

let _nearSeq = 0;

async function onNearInput() {
  // Without the bidi isolates a right-to-left UI puts around coordinates
  // (places.near_coords, szLtr), should the reader edit them.
  const q = els.near.value.replace(/[\u200e\u200f\u2066-\u2069]/g, '').trim();
  // Still the untouched "My location" entry: nothing to look up.
  const here = els.near.hasAttribute('data-sz-here') && els.near.value === myLocationLabel();
  if (!here) els.near.removeAttribute('data-sz-here');
  if (q.length < 2 || here) { hideNearResults(); return; }
  const seq = ++_nearSeq;
  const alive = () => seq === _nearSeq;
  const seen = new Map();
  const matches = [];
  const needle = q.toLowerCase();

  // Same targeted path the name search (#q) uses — see runNameQuery.
  // This input used to walk prefixesFor() -> expandPrefix() -> one
  // awaited loadChunk() per leaf, serially. On a dense region that is
  // hundreds of sequential round-trips for a single city name: "Chicago"
  // expands to 465 leaves on midwest-us, "Cancun" to 1161 on mexico, and
  // the dropdown took ~40 s to appear while the same ZIM's #q box
  // answered the same word instantly. Measured leaf counts split cleanly
  // at the 15 s browser-gate budget -- Denver 353, Chicago 465, Boston
  // 475, Bangkok 938, Cancun 1161 all timed out; Sydney 1, Tokyo 95,
  // Dubai 98, Buenos Aires 113, Istanbul 135, Seattle 250 all rendered.
  // Total bytes did not predict it (Bangkok 1.1 MB failed, Seattle
  // 0.6 MB passed) -- the count of serial fetches did.
  const targetedLeaves = searchLeavesFor(q);
  if (targetedLeaves) {
    let hits = await streamLeaves(targetedLeaves, q, alive);
    if (!alive()) return;                 // a newer keystroke owns the UI
    // Mirror runNameQuery's widening: targeting misses matches inside a
    // word, so a thin targeted result is worth re-running unfiltered
    // rather than showing "No matches." for a place that exists.
    if (hits.length < 5 && targetedLeaves.targeted) {
      const all = searchLeavesFor(q, { noTargeting: true }) || [];
      try {
        const wider = await streamLeaves(all, q, alive);
        if (!alive()) return;
        hits = wider;
      } catch (e) {
        if (!alive()) return;             // keep what targeting found
      }
    }
    for (const r of hits) {
      if (!r.n) continue;
      addOnce(matches, seen, `${r.n}|${r.a}|${r.o}`, r);
    }
  } else {
    // Legacy whole-prefix path, for ZIMs built without a character split.
    const prefixes = prefixesFor(q);
    if (!prefixes.length) { hideNearResults(); return; }
    for (const p of prefixes) {
      // Skip prefixes the manifest has nothing for. expandPrefix
      // covers the unsplit / hot-split / recursive-split layouts,
      // including the "empty sub_chunks list" build bug we saw on
      // Midwest's `ch` prefix.
      if (!expandPrefix(p).length) continue;
      let chunk;
      try { chunk = await loadChunk(p); } catch { continue; }
      if (!alive()) return;
      for (const r of chunk) {
        if (!r.n) continue;
        const lower = r.n.toLowerCase();
        if (!lower.includes(needle)) continue;
        addOnce(matches, seen, `${r.n}|${r.a}|${r.o}`, r);
      }
    }
  }
  if (!alive()) return;
  // Rank on the folded form. streamLeaves filters through matchesName,
  // which accent-folds both sides, so an unfolded startsWith() would rank
  // the exact city BELOW incidental matches on every accented name:
  // "Cancún".toLowerCase().startsWith("cancun") is false. The legacy
  // branch filters unfolded, but folding here is a no-op for the ASCII
  // names it can return, so one comparator is correct for both.
  const foldedNeedle = foldText(q);
  matches.sort((a, b) => {
    const aStart = foldText(a.n).startsWith(foldedNeedle) ? 0 : 1;
    const bStart = foldText(b.n).startsWith(foldedNeedle) ? 0 : 1;
    if (aStart !== bStart) return aStart - bStart;
    return a.n.length - b.n.length;
  });
  nearCandidates = matches.slice(0, 12);
  nearActive = nearCandidates.length ? 0 : -1;
  renderNearResults(nearCandidates, nearActive);
}

function onNearKeydown(e) {
  if (els.nearResults.hidden) return;
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    nearActive = Math.min(nearCandidates.length - 1, nearActive + 1);
    renderNearResults(nearCandidates, nearActive);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    nearActive = Math.max(0, nearActive - 1);
    renderNearResults(nearCandidates, nearActive);
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (nearActive >= 0 && nearCandidates[nearActive]) {
      pickNearResult(nearCandidates[nearActive]);
    }
  } else if (e.key === 'Escape') {
    hideNearResults();
  }
}

function pickNearResult(r) {
  state.origin = { lat: r.a, lon: r.o };
  state.originMode = 'custom';
  state.originLabel = szFirstName(r.n);
  showNearPlace(szFirstName(r.n));
  // When the user explicitly pins a near-origin, drop the
  // "Limit to map area" filter. The implicit viewport from
  // index.html is almost certainly stale relative to the user's
  // new choice (e.g. user types "Cancún" while map is parked on
  // Caribbean center → otherwise mapArea filter strips all
  // Mexican results and we surface 600+ km Cayman gas stations
  // as "nearest to Cancún"). The user can re-tick the box to
  // re-engage map-area filtering.
  if (state.mapAreaOn) {
    state.mapAreaOn = false;
    if (els.mapAreaCheck) els.mapAreaCheck.checked = false;
  }
  hideNearResults();
  rerunQuery();
}

function clearNearCustom() {
  state.origin = null;
  state.originMode = 'gps';
  state.originLabel = myLocationLabel();
  showNearHere();
  hideNearResults();
  requestGPS();
}

// No-op shim — the GPS toggle is gone from the UI but we keep the
// symbol so any deep-link code that still references onGpsToggle()
// doesn't explode. Real origin-selection is in requestGPS +
// pickNearResult above.
function onGpsToggle() { /* intentionally empty */ }

// ---------- data loading ----------

// Expand a prefix to the set of leaf chunk filenames that hold its
// records. Three layouts in the wild:
//   1. Unsplit:        chunks['de'] = size; load 'de.json'.
//   2. Hot-split:      sub_chunks['de'] = ['de-0','de-1',...,'de-f'];
//                      each child appears in chunks. Load all 16.
//   3. Recursively-split (hot prefix split *again*): sub_chunks['ch']
//      may be empty, with intermediate keys ('ch-0'→['ch-0-0']) and
//      4-char leaves ('ch-0-0-0') in chunks. The Midwest build hit
//      this for "ch" (Chicago, Cherokee, …). The manifest *should*
//      list the intermediate children under sub_chunks['ch'], but
//      that array can be empty in current builds — fall back to a
//      chunks-map scan for keys starting with `<prefix>-`.
// Names that have hash children (`ca~r~c-0`…) or declared sub-chunks,
// computed once per manifest. searchLeavesFor asks about hundreds of
// candidate leaves per keystroke, and the scan below is four passes over
// every chunk key — 1.06 s on a CJK prefix in a 10,855-chunk manifest.
function _searchHashParents(m) {
  if (m.__hashParents) return m.__hashParents;
  const parents = Object.create(null);
  for (const k in (m.chunks || {})) {
    const cut = k.lastIndexOf('-');
    if (cut > 0) parents[k.slice(0, cut)] = 1;
  }
  for (const sk in (m.sub_chunks || {})) parents[sk] = 1;
  m.__hashParents = parents;
  return parents;
}

function expandPrefix(prefix) {
  const m = state.manifests && state.manifests.search;
  if (!m) return [];
  const chunks = m.chunks || {};
  const subs = m.sub_chunks || {};
  if (chunks[prefix]) return [prefix];
  if (!_searchHashParents(m)[prefix]) return [];
  const direct = subs[prefix];
  if (Array.isArray(direct) && direct.length) {
    return direct.flatMap(expandPrefix);
  }
  // Fallback: scan chunks for leaves under this prefix (covers the
  // empty-sub_chunks build bug). Both separators: '-' for hash buckets,
  // '~' for character + tier leaves (docs/search-prefix-locality.md).
  // 143 united-states prefixes ship an empty sub_chunks list and are
  // reachable only here, so a '-'-only scan would return nothing on a
  // character-split ZIM.
  return Object.keys(chunks).filter(k =>
    k === prefix || k.startsWith(prefix + '-') || k.startsWith(prefix + '~'));
}

async function loadChunk(prefix) {
  if (state.cache.chunks.has(prefix)) {
    return cacheKeep(state.cache.chunks, prefix, state.cache.chunks.get(prefix));
  }
  const leaves = expandPrefix(prefix);
  if (leaves.length === 1 && leaves[0] === prefix) {
    const data = await fetchJSON(DATA + prefix + '.json');
    return cacheKeep(state.cache.chunks, prefix, data);
  }
  if (leaves.length === 0) {
    return cacheKeep(state.cache.chunks, prefix, []);
  }
  const blobs = await Promise.all(leaves.map(name =>
    fetchJSON(DATA + name + '.json').catch(() => [])));
  const merged = [].concat(...blobs);
  return cacheKeep(state.cache.chunks, prefix, merged);
}

async function loadCategory(slug) {
  if (state.cache.cats.has(slug)) {
    return cacheKeep(state.cache.cats, slug, state.cache.cats.get(slug));
  }
  if (!state.manifests.cat && state.manifestCatFailed) {
    throw new Error('the category index could not be loaded');
  }
  if (!state.manifests.cat || !state.manifests.cat.categories
      || !(slug in state.manifests.cat.categories)) {
    const err = new Error(`category ‘${slug}’ not in the index`);
    err.code = 'no-category';
    throw err;
  }
  // Oversized categories are geo-sharded at build time exactly like `place`
  // (create_osm_zim.py, cloud/chip_shards.py). Read the shards around the
  // viewport when the manifest says so; older ZIMs still have one file.
  // Without this, generalising the build-side sharding to `park` would make
  // this legacy path 404 on ZIMs that have no whole-file copy.
  // Same origin resolution the geo-chip path uses (loadGeoChip): the user's
  // origin if set, else the centre of the map area, else the region centre.
  const catShard = state.manifests.cat.category_shards
                   && state.manifests.cat.category_shards[slug];
  if (CHIP_SHARDS.isGeo(catShard)) {
    const v = state.mapArea;
    let point = state.origin;
    if (!point && v) point = { lat: (v.s + v.n) / 2, lon: (v.w + v.e) / 2 };
    if (!point) point = await _regionCentre(catShard);
    if (point) {
      const res = await CHIP_SHARDS.load(catShard, {
        fetchShard: (suffix) => fetchJSON(CAT + slug + '-' + suffix + '.json'),
        cache: chipShardCache,
        cacheKey: 'cat:' + slug,
        point,
        bbox: (state.mapAreaOn && v) ? { s: v.s, w: v.w, n: v.n, e: v.e } : null,
        k: 300,
        fallbackToNearest: true,
      }).catch(() => null);
      if (res && res.records) return cacheKeep(state.cache.cats, slug, res.records);
    }
  }
  const data = await fetchJSON(CAT + slug + '.json');
  return cacheKeep(state.cache.cats, slug, data);
}

async function fetchJSON(url) {
  const res = await fetch(url, { cache: 'force-cache' });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

// ---------- helpers ----------

// `kind` says what the (translatable) text means, as data-state, for the
// smoke gates: loading / searching / locating / error / empty / done / info.
function setStatus(text, kind) {
  els.statusText.textContent = text;
  els.statusText.dataset.state = kind || 'info';
}

function debounce(fn, ms) {
  let t = null;
  return function () {
    const a = arguments, c = this;
    if (t) clearTimeout(t);
    t = setTimeout(() => fn.apply(c, a), ms);
  };
}

function parseHash(h) {
  const out = {};
  if (!h || h[0] !== '#') return out;
  for (const pair of h.slice(1).split('&')) {
    const [k, ...rest] = pair.split('=');
    if (!k) continue;
    const raw = rest.join('=');
    // A malformed escape (`#q=50%`) used to throw URIError out of the
    // async init and leave the page stuck on "Loading places index…".
    try { out[k] = decodeURIComponent(raw); } catch (_) { out[k] = raw; }
  }
  return out;
}

// Only http(s) links may come out of index data — a `javascript:`
// website/social value in a record would otherwise execute on tap.
function safeHttpUrl(u) {
  if (typeof u !== 'string') return null;
  const t = u.trim();
  return /^https?:\/\//i.test(t) ? t : null;
}

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000; // metres
  const r = Math.PI / 180;
  const dLat = (lat2 - lat1) * r;
  const dLon = (lon2 - lon1) * r;
  const a = Math.sin(dLat / 2) ** 2
          + Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(a)));
}

// Longitude-inside-bounds with antimeridian wraparound. MapLibre's
// getBounds() returns UNWRAPPED longitudes when the camera spans
// 180° (e.g. west=170, east=190) while records store [-180, 180], so
// also test the record shifted by ±360°. Kept the e<w union form for
// callers that hand us pre-wrapped bounds.
function _lonInside(lon, w, e) {
  if (w <= e) {
    return (lon >= w && lon <= e)
        || (lon + 360 >= w && lon + 360 <= e)
        || (lon - 360 >= w && lon - 360 <= e);
  }
  return lon >= w || lon <= e;
}
