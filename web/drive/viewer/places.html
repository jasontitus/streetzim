<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Find places</title>
<!-- See viewer/index.html — same favicon hack to keep the browser
     from auto-probing /favicon.ico (outside SW scope = 404). -->
<link rel="icon" href="data:image/x-icon;base64,AAABAAEAAQEAAAEAIAAwAAAAFgAAACgAAAABAAAAAgAAAAEAIAAAAAAABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA">
<style>
  :root {
    --bg:#fafafa; --fg:#1a1a1a; --muted:#666; --line:#e0e0e0;
    --card:#fff; --accent:#0a7cff; --chip-bg:#f0f0f0; --chip-on:#0a7cff;
    --chip-on-fg:#fff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111; --fg:#eee; --muted:#aaa; --line:#2a2a2a;
            --card:#1c1c1c; --chip-bg:#2a2a2a; }
  }
  * { box-sizing: border-box; }
  html,body { margin:0; padding:0; background:var(--bg); color:var(--fg);
              font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
              line-height:1.4; }
  header { position:sticky; top:0; z-index:10; background:var(--bg);
           border-bottom:1px solid var(--line);
           padding:env(safe-area-inset-top,12px) 16px 12px; }
  .titlebar { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .titlebar h1 { margin:0; font-size:1.2rem; flex:1 1 auto; min-width:0;
                 overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .titlebar a.back { color:var(--accent); text-decoration:none; font-weight:600;
                     font-size:0.95rem; flex:0 0 auto; }
  /* Top-right action: jump to the map with the current results plotted.
     Lives in the sticky header so it stays reachable without floating
     over the list. Pill matches the back-link's accent colour but
     filled, to read as an action rather than navigation. */
  .titlebar .map-view {
    flex:0 0 auto; padding:6px 12px; border-radius:999px;
    border:1px solid var(--accent); background:var(--accent); color:#fff;
    font:inherit; font-size:0.85rem; font-weight:600;
    text-decoration:none; cursor:pointer; line-height:1;
    display:inline-flex; align-items:center; gap:6px;
  }
  .titlebar .map-view[hidden] { display:none; }
  .titlebar .map-view:hover { filter:brightness(1.05); }
  input[type=search] { width:100%; padding:11px 14px; border-radius:10px;
                       border:1px solid var(--line); background:var(--card);
                       color:var(--fg); font-size:1rem; -webkit-appearance:none; }
  input[type=search]:focus { outline:2px solid var(--accent); border-color:transparent; }
  nav.chips { display:flex; gap:8px; overflow-x:auto; padding:10px 16px;
              -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  nav.chips::-webkit-scrollbar { display:none; }
  nav.chips button { flex:0 0 auto; padding:7px 14px; border-radius:18px;
                     border:1px solid var(--line); background:var(--chip-bg);
                     color:var(--fg); font-size:0.9rem; cursor:pointer;
                     white-space:nowrap; }
  nav.chips button.on { background:var(--chip-on); color:var(--chip-on-fg);
                        border-color:var(--chip-on); }
  .near { padding:4px 16px 12px; display:flex; align-items:center;
          gap:10px; font-size:0.9rem; color:var(--muted); }
  .near label { flex:0 0 auto; }
  .near-wrap { position:relative; flex:1 1 auto; }
  #near-input {
    width:100%; padding:8px 28px 8px 12px; border-radius:10px;
    border:1px solid var(--line); background:var(--card); color:var(--text);
    font:inherit; font-size:0.95rem;
  }
  #near-input:focus { outline:2px solid var(--chip-on); outline-offset:-1px; }
  #near-clear {
    position:absolute; right:6px; top:50%; transform:translateY(-50%);
    background:transparent; border:none; color:var(--muted);
    font-size:18px; line-height:1; cursor:pointer; padding:2px 6px;
  }
  #near-clear:hover { color:var(--text); }
  /* "Limit to map area" toggle — appears when index.html has stashed
     a recent viewport in sessionStorage. Hard-filters results to the
     bbox so "bars near my neighborhood" is just zoom + chip. */
  .map-area { padding:0 16px 12px; display:flex; align-items:center;
              gap:8px; font-size:0.85rem; color:var(--muted); }
  .map-area[hidden] { display:none; }
  .map-area input[type=checkbox] { margin:0; cursor:pointer; }
  .map-area label { cursor:pointer; user-select:none; }
  .map-area .info { color:var(--muted); font-size:0.8rem;
                    overflow:hidden; text-overflow:ellipsis;
                    white-space:nowrap; flex:1 1 auto; min-width:0; }
  /* Recent searches dropdown — reuses near-results visuals so the
     hit area + selection styling are familiar. */
  #recent-searches {
    position:absolute; left:0; right:0; top:calc(100% + 4px);
    background:var(--card); border:1px solid var(--line);
    border-radius:10px; box-shadow:0 6px 20px rgba(0,0,0,0.18);
    z-index:1100; max-height:300px; overflow-y:auto; padding:4px 0;
  }
  #recent-searches[hidden] { display:none; }
  #recent-searches .recent-head {
    padding:6px 12px; font-size:0.8rem; color:var(--muted);
    display:flex; align-items:center; justify-content:space-between;
  }
  #recent-searches .recent-head button {
    background:transparent; border:none; color:var(--accent);
    font:inherit; font-size:0.8rem; cursor:pointer; padding:2px 6px;
  }
  #recent-searches .recent-row {
    padding:8px 12px; cursor:pointer; display:flex;
    align-items:center; gap:8px; font-size:0.95rem;
  }
  #recent-searches .recent-row:hover,
  #recent-searches .recent-row.active { background:var(--chip-on); color:var(--chip-on-fg); }
  #recent-searches .recent-row .icon { color:var(--muted); flex:0 0 auto; }
  /* Sort selector — slim row above the result list. */
  .sort-row {
    padding:8px 16px 4px; display:flex; align-items:center; gap:6px;
    font-size:0.85rem; color:var(--muted); flex-wrap:wrap;
  }
  .sort-row[hidden] { display:none; }
  .sort-row label { flex:0 0 auto; }
  .sort-row .sort-btn {
    flex:0 0 auto; padding:4px 10px; border-radius:999px;
    border:1px solid var(--line); background:transparent;
    color:var(--text); font:inherit; font-size:0.85rem; cursor:pointer;
  }
  .sort-row .sort-btn.on {
    background:var(--accent); color:#fff; border-color:var(--accent);
  }
  /* Sub-filter chips — derived from the current result set's subtype
     histogram (top N). Sits above the sort row. */
  .subfilter-row {
    padding:4px 16px 8px; display:flex; gap:6px;
    overflow-x:auto; -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .subfilter-row[hidden] { display:none; }
  .subfilter-row::-webkit-scrollbar { display:none; }
  .subfilter-row .sub-chip {
    flex:0 0 auto; padding:5px 11px; border-radius:999px;
    border:1px solid var(--line); background:var(--card); color:var(--text);
    font:inherit; font-size:0.8rem; cursor:pointer;
    white-space:nowrap;
  }
  .subfilter-row .sub-chip:hover { background:#eef3fe; }
  .subfilter-row .sub-chip.on {
    background:var(--accent); color:#fff; border-color:var(--accent);
  }
  /* Wrap the search input so the recent-searches dropdown can absolutely
     position relative to it. */
  header .q-wrap { position:relative; }
  #near-results {
    position:absolute; top:calc(100% + 4px); left:0; right:0; z-index:20;
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    max-height:260px; overflow-y:auto; box-shadow:0 4px 16px rgba(0,0,0,0.4);
  }
  #near-results .near-result {
    padding:10px 12px; cursor:pointer; font-size:0.92rem; line-height:1.35;
    border-bottom:1px solid var(--line);
  }
  #near-results .near-result:last-child { border-bottom:none; }
  #near-results .near-result:hover,
  #near-results .near-result.active { background:var(--chip-on); color:var(--chip-on-fg); }
  #near-results .near-result .sub { color:var(--muted); font-size:0.82rem; }
  #near-results .near-result:hover .sub,
  #near-results .near-result.active .sub { color:var(--chip-on-fg); opacity:0.85; }
  .status { padding:18px 16px; color:var(--muted); font-size:0.9rem; }
  ol#results { list-style:none; margin:0; padding:0; }
  ol#results li { background:var(--card); margin:0 16px 10px; padding:14px;
                  border-radius:12px; border:1px solid var(--line);
                  display:flex; flex-direction:column; gap:10px; }
  ol#results h3 { margin:0; font-size:1.05rem; }
  ol#results .meta { margin:0; color:var(--muted); font-size:0.85rem; }
  ol#results .rich { margin:2px 0 6px; font-size:0.85rem;
                     display:flex; gap:10px; align-items:center;
                     flex-wrap: wrap; }
  ol#results .rich .brand { color:var(--muted); font-style:italic; }
  ol#results .rich .links { display:flex; gap:6px; }
  ol#results .rich .links a { text-decoration:none; font-size:14px;
                              padding:2px 6px; border-radius:4px;
                              background: #f0f4fc; color:#2563eb;
                              line-height:1; min-width:22px; text-align:center; }
  ol#results .rich .links a:hover { background:#e4ecfb; }
  ol#results .ctas { display:flex; gap:8px; }
  ol#results .ctas a { flex:1; text-align:center; padding:9px 12px;
                       border-radius:8px; text-decoration:none; font-weight:600;
                       font-size:0.9rem; border:1px solid var(--line); color:var(--fg);
                       background:var(--card); }
  ol#results .ctas a.primary { background:var(--accent); color:#fff;
                               border-color:var(--accent); }
  footer { padding:24px 16px 40px; color:var(--muted); font-size:0.8rem;
           text-align:center; }
</style>
</head>
<body>

<header>
  <div class="titlebar">
    <h1>Find places</h1>
    <!-- Top-right action — jump to the map with the current results
         plotted. Hidden until results land; the click handler stashes
         them in sessionStorage and routes to index.html#find=results. -->
    <button id="map-view-btn" class="map-view" type="button" hidden>
      <span aria-hidden="true">📍</span><span>On map</span>
    </button>
    <!-- Back-to-map link. Static `../index.html` works for the PWA
         (places at /drive/viewer/places/) but is OUT OF ZIM BOUNDS
         when Kiwix Desktop serves places.html at the ZIM root. We
         rewrite this href in JS once `HERE` is known (script tag
         below) so both paths resolve correctly. -->
    <a class="back" id="back-link" href="#">← Map</a>
  </div>
  <div class="q-wrap">
    <input id="q" type="search" placeholder="Search by name or category…"
           autocomplete="off" autocapitalize="none" spellcheck="false">
    <div id="recent-searches" role="listbox" aria-label="Recent searches" hidden></div>
  </div>
</header>

<nav class="chips" id="chips" aria-label="Category filter">
  <!-- buttons inserted at runtime -->
</nav>

<div class="near">
  <label for="near-input">Search near</label>
  <div class="near-wrap">
    <input id="near-input" type="search" value="My location"
           autocomplete="off" autocapitalize="none" spellcheck="false">
    <button id="near-clear" type="button" aria-label="Clear" title="Reset to my location">×</button>
    <div id="near-results" role="listbox" hidden></div>
  </div>
</div>

<div id="map-area-row" class="map-area" hidden>
  <input id="map-area-checkbox" type="checkbox">
  <label for="map-area-checkbox">Limit to map area</label>
  <span id="map-area-info" class="info"></span>
</div>

<div id="status" class="status">
  <span id="status-text" class="count">Loading places index…</span>
</div>

<div id="subfilter-row" class="subfilter-row" hidden></div>

<div id="sort-row" class="sort-row" hidden>
  <label>Sort:</label>
  <button type="button" class="sort-btn" data-sort="distance">Distance</button>
  <button type="button" class="sort-btn" data-sort="name">Name</button>
  <button type="button" class="sort-btn" data-sort="category">Category</button>
</div>

<ol id="results"></ol>

<footer>
  Searches the index baked into this map. No network required.
</footer>

<script>
"use strict";
// All data fetches go through the same origin as this page. Inside a
// ZIM (kiwix) the path is `search-data/...`; over the Firebase /drive
// PWA it's `viewer/search-data/...` because the viewer ships under
// `viewer/`. We compute the prefix once at boot.
//
// Handle both `…/viewer/places.html` (Kiwix native, no rewriting) AND
// `…/viewer/places/` (Firebase cleanUrls + trailingSlash) — treat the
// trailing slash as if it were the file extension by stripping the
// last non-empty path component plus any trailing slash.
const HERE = location.pathname.replace(/[^/]+\/?$/, '');
const DATA = HERE + 'search-data/';
const CAT  = HERE + 'category-index/';

// Wire the static back-link href now that HERE is known. Doing it
// in JS instead of HTML lets the same template work whether places
// is served at `/drive/viewer/places/` (PWA) or `<zim-root>/places.html`
// (Kiwix) — the two have different ../ semantics.
{
  const back = document.getElementById('back-link');
  if (back) back.href = HERE + 'index.html';
}

// Categories surfaced as chips. Each maps to either a single
// category-index slug (cheap one-fetch) or a subtype filter applied
// to the broader `poi` index. Order matters — first chip wins
// horizontal real-estate.
// Categories shown as chips. Each chip's filter runs on top of the
// category-index/<cat>.json records (cheap one-fetch).
// We mix two selectors: (1) `subtypes` — always-include by subtype
// (OpenMapTiles `class`/`subclass`). (2) `nameInclude` — broaden by
// name when OMT collapsed the real type into a generic bucket. OMT
// doesn't emit a dedicated `museum` class for example — those show
// up as `tourism` — so the nameInclude fallback catches them without
// inviting every random tourism POI into the Museums chip.
// Category chips. `subtypes` matches `r.s` (record subtype). After the
// Overture places merge, POI records have their subtype rewritten to
// Overture's normalized category when OMT had a noisy bucket — so a
// match like "museum" now catches everything correctly. We still keep
// OSM/OMT fallbacks (tourism etc.) for ZIMs built without Overture.
// Overture category strings follow a <noun>_<modifier> convention
// (vietnamese_restaurant, coffee_shop, wine_store, …) — `includeRegex`
// matches a regex against the subtype string for coarser buckets.
const CATEGORIES = [
  { id: 'restaurants', label: 'Restaurants', cat: 'poi',
    subtypes: ['restaurant', 'fast_food', 'food_court', 'ice_cream'],
    includeRegex: /_restaurant$|^food_/ },
  { id: 'cafes',       label: 'Cafés',       cat: 'poi',
    subtypes: ['cafe', 'coffee_shop', 'bakery', 'tea_room',
               'ice_cream_parlor'] },
  { id: 'bars',        label: 'Bars',        cat: 'poi',
    subtypes: ['bar', 'pub', 'biergarten', 'nightclub', 'beer',
               'alcohol_shop', 'wine_bar', 'sports_bar', 'cocktail_bar',
               'dive_bar', 'beer_bar', 'brewery', 'wine_store', 'liquor_store'] },
  { id: 'hotels',      label: 'Hotels',      cat: 'poi',
    subtypes: ['hotel', 'motel', 'hostel', 'bed_and_breakfast',
               'lodging', 'inn', 'guest_house', 'resort', 'campsite'] },
  { id: 'museums',     label: 'Museums',     cat: 'poi',
    // Exact `museum` (OMT + Overture generic) plus any Overture variant
    // suffixed `_museum` (art_museum, history_museum, science_museum,
    // childrens_museum, asian_art_museum, …) and the art_gallery bucket
    // — people conflate museums + galleries. Historic / landmarks /
    // monuments moved to their own "Landmarks" chip below.
    subtypes: ['museum', 'art_gallery', 'planetarium', 'observatory'],
    includeRegex: /_museum$|_gallery$/,
    nameInclude: {
      subtypes: ['tourism', 'attraction'],
      pattern: /\b(museum|gallery|exhibit|planetarium)\b/i,
    } },
  { id: 'landmarks',   label: 'Landmarks',   cat: 'poi',
    subtypes: ['historic', 'castle', 'monument', 'historical_landmark',
               'landmark_and_historical_building', 'memorial'],
    nameInclude: {
      subtypes: ['tourism', 'attraction'],
      pattern: /\b(landmark|monument|memorial|historic)\b/i,
    } },
  { id: 'parks',       label: 'Parks',       cat: 'park' },
  { id: 'libraries',   label: 'Libraries',   cat: 'poi',
    subtypes: ['library', 'public_library'] },
  { id: 'health',      label: 'Health',      cat: 'poi',
    subtypes: ['hospital', 'pharmacy', 'clinic', 'doctors', 'dentist',
               'urgent_care_clinic', 'veterinary'] },
  { id: 'shops',       label: 'Shops',       cat: 'poi',
    subtypes: ['shop', 'supermarket', 'mall', 'marketplace',
               'department_store', 'convenience', 'grocery',
               'clothing_store', 'jewelry_store'],
    includeRegex: /_store$|^store$/ },
  { id: 'fuel',        label: 'Gas',         cat: 'poi',
    subtypes: ['fuel', 'charging_station', 'gas_station', 'ev_charging_station'] },
];

const state = {
  manifests: { search: null, cat: null }, // small lookups
  cache: { chunks: new Map(), cats: new Map() }, // path → array of records
  results: [],
  lastRecords: [],     // unsorted records from the last query — re-used by sort
  query: '',
  chip: null,
  origin: null,        // {lat, lon} when GPS toggle is on
  mapArea: null,       // {n,s,e,w,z,ts} from index.html or null
  mapAreaOn: false,    // user toggled "Limit to map area"
  sortMode: null,      // 'distance' | 'name' | 'category' (null = auto)
  subFilter: null,     // selected r.s subtype (e.g. 'italian_restaurant')
};

// Recent searches are persisted in localStorage so they survive
// across sessions. Capped to keep storage bounded; users who want
// more history can star results once we ship saved-places.
const RECENT_KEY = 'streetzim_recent_searches';
const RECENT_LIMIT = 10;
function loadRecents() {
  try {
    const raw = localStorage.getItem(RECENT_KEY);
    if (!raw) return [];
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr.slice(0, RECENT_LIMIT) : [];
  } catch (e) { return []; }
}
function saveRecent(entry) {
  // entry: {kind: 'query'|'chip', label, value, ts}
  if (!entry || !entry.label) return;
  let arr = loadRecents();
  // De-dup by (kind, value); promote the existing entry to the top.
  arr = arr.filter(e => !(e.kind === entry.kind && e.value === entry.value));
  arr.unshift(entry);
  arr = arr.slice(0, RECENT_LIMIT);
  try { localStorage.setItem(RECENT_KEY, JSON.stringify(arr)); }
  catch (e) {}
}

// Viewport that index.html stashed on its last moveend. We accept it
// only if it's < 30 min old — otherwise the user has probably context-
// switched and the cached bbox is no longer what they mean by
// "this area".
const VIEWPORT_FRESH_MS = 30 * 60 * 1000;
function _readMapArea() {
  try {
    const raw = sessionStorage.getItem('streetzim_last_viewport');
    if (!raw) return null;
    const v = JSON.parse(raw);
    if (!v || typeof v.n !== 'number') return null;
    if (Date.now() - (v.ts || 0) > VIEWPORT_FRESH_MS) return null;
    return v;
  } catch (e) { return null; }
}

const els = {
  q:            document.getElementById('q'),
  chips:        document.getElementById('chips'),
  status:       document.getElementById('status'),
  statusText:   document.getElementById('status-text'),
  mapViewBtn:   document.getElementById('map-view-btn'),
  results:      document.getElementById('results'),
  near:         document.getElementById('near-input'),
  nearClear:    document.getElementById('near-clear'),
  nearResults:  document.getElementById('near-results'),
  mapAreaRow:   document.getElementById('map-area-row'),
  mapAreaCheck: document.getElementById('map-area-checkbox'),
  mapAreaInfo:  document.getElementById('map-area-info'),
  recents:      document.getElementById('recent-searches'),
  sortRow:      document.getElementById('sort-row'),
  subfilterRow: document.getElementById('subfilter-row'),
};

// If index.html stashed a recent viewport, expose the toggle so the
// user can constrain results to it. Otherwise the toggle row stays
// hidden and search is unchanged.
function initMapAreaToggle() {
  state.mapArea = _readMapArea();
  if (!state.mapArea || !els.mapAreaRow) return;
  // Brief, friendly description of the bbox. Zoom level is more
  // intuitive than degrees: "neighborhood / city / region".
  const z = state.mapArea.z || 0;
  let scale = 'map area';
  if      (z >= 15) scale = 'neighborhood';
  else if (z >= 12) scale = 'city';
  else if (z >= 9)  scale = 'region';
  els.mapAreaInfo.textContent = `(${scale}, zoom ${z.toFixed(1)})`;
  els.mapAreaRow.hidden = false;
  // Default ON when a fresh viewport is on hand. Searching the
  // user's current map area is what they almost always want; if the
  // filter would yield zero results, _sortAndShow auto-falls back
  // to the unfiltered set rather than showing nothing. The user
  // can still untick to force a wider search.
  state.mapAreaOn = true;
  els.mapAreaCheck.checked = true;
  els.mapAreaCheck.addEventListener('change', () => {
    state.mapAreaOn = els.mapAreaCheck.checked;
    rerunQuery();
  });
}

function initRecents() {
  if (!els.recents) return;
  // Show recents only when the search box is empty AND focused, so
  // typing-driven typeahead isn't competing with history. Hide on
  // outside click. Selecting an entry restores the query/chip.
  els.q.addEventListener('focus', () => {
    if (!els.q.value.trim()) renderRecents();
  });
  els.q.addEventListener('input', () => {
    // Hide as soon as the user types — typeahead takes over.
    if (els.q.value) els.recents.hidden = true;
  });
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.q-wrap')) els.recents.hidden = true;
  });
}

function renderRecents() {
  if (!els.recents) return;
  const items = loadRecents();
  if (items.length === 0) {
    els.recents.hidden = true;
    return;
  }
  // Tear down + rebuild via DOM APIs (no innerHTML) since the entries
  // come from user-typed history that can contain arbitrary text.
  while (els.recents.firstChild) els.recents.removeChild(els.recents.firstChild);
  const head = document.createElement('div');
  head.className = 'recent-head';
  const headLabel = document.createElement('span');
  headLabel.textContent = 'Recent searches';
  head.appendChild(headLabel);
  const clear = document.createElement('button');
  clear.type = 'button';
  clear.textContent = 'Clear';
  clear.addEventListener('click', (e) => {
    e.stopPropagation();
    try { localStorage.removeItem(RECENT_KEY); } catch (e2) {}
    els.recents.hidden = true;
  });
  head.appendChild(clear);
  els.recents.appendChild(head);
  for (const item of items) {
    const row = document.createElement('div');
    row.className = 'recent-row';
    row.setAttribute('role', 'option');
    const icon = document.createElement('span');
    icon.className = 'icon';
    icon.textContent = item.kind === 'chip' ? '🏷️' : '🕘';
    row.appendChild(icon);
    const label = document.createElement('span');
    label.textContent = item.label;
    row.appendChild(label);
    row.addEventListener('mousedown', (e) => e.preventDefault()); // keep focus
    row.addEventListener('click', () => applyRecent(item));
    els.recents.appendChild(row);
  }
  els.recents.hidden = false;
}

function applyRecent(item) {
  els.recents.hidden = true;
  if (item.kind === 'chip') {
    const def = CATEGORIES.find(c => c.id === item.value);
    if (!def) return;
    state.chip = null; // selectChip toggles, so make sure we end up "on"
    selectChip(def);
  } else {
    state.chip = null;
    for (const b of els.chips.querySelectorAll('button')) {
      b.classList.remove('on');
    }
    els.q.value = item.value;
    state.query = item.value;
    rerunQuery();
  }
}

function initSortRow() {
  if (!els.sortRow) return;
  for (const btn of els.sortRow.querySelectorAll('.sort-btn')) {
    btn.addEventListener('click', () => {
      state.sortMode = btn.dataset.sort;
      _refreshSortButtons();
      _sortAndShow(state.lastRecords.slice());
    });
  }
}

function _refreshSortButtons() {
  if (!els.sortRow) return;
  const mode = _effectiveSortMode();
  for (const btn of els.sortRow.querySelectorAll('.sort-btn')) {
    btn.classList.toggle('on', btn.dataset.sort === mode);
  }
}

function _effectiveSortMode() {
  return state.sortMode || (state.origin ? 'distance' : 'name');
}

// Apply ?chip=…&mapArea=1 URL params, set by the index.html Explore
// menu. Idempotent — runs once on init. Pre-toggles the bbox filter
// when mapArea=1 is requested AND a viewport is actually on hand.
function applyUrlParamsOnce() {
  let params;
  try { params = new URLSearchParams(location.search); }
  catch (e) { return; }
  const chipId = params.get('chip');
  const mapArea = params.get('mapArea') === '1';
  if (mapArea && state.mapArea && els.mapAreaCheck) {
    state.mapAreaOn = true;
    els.mapAreaCheck.checked = true;
  }
  if (chipId) {
    const def = CATEGORIES.find(c => c.id === chipId);
    if (def) {
      // selectChip toggles, so make sure the starting state is "off".
      state.chip = null;
      selectChip(def);
    }
  }
}

// ---------- bootstrapping ----------

(async function init() {
  // Manifests are tiny and always needed; fetch in parallel.
  try {
    const [s, c] = await Promise.all([
      fetchJSON(DATA + 'manifest.json'),
      fetchJSON(CAT  + 'manifest.json').catch(() => null),
    ]);
    state.manifests.search = s;
    state.manifests.cat = c; // may be null if the ZIM was built without it
  } catch (e) {
    setStatus(`Couldn't load the search index: ${e.message}`);
    return;
  }
  renderChips();
  initMapAreaToggle();
  initRecents();
  initSortRow();
  applyUrlParamsOnce();
  els.q.addEventListener('input', debounce(onSearch, 200));
  // Search-near input: typeahead into the same place/POI index, click
  // a result to set the search origin manually. "My location" (GPS)
  // is the default when the input hasn't been edited. Clearing with
  // "×" reverts to GPS.
  els.near.addEventListener('input', debounce(onNearInput, 180));
  els.near.addEventListener('focus', () => {
    // Select the whole current label so the first keystroke replaces it.
    setTimeout(() => els.near.select(), 0);
  });
  els.near.addEventListener('keydown', onNearKeydown);
  els.nearClear.addEventListener('click', clearNearCustom);
  // Clicking outside the dropdown closes it without resetting state.
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.near-wrap')) hideNearResults();
  });
  // "Map view" hand-off: stash the current result set in
  // sessionStorage and navigate to index.html. The viewer reads the
  // stash on load and drops one search-pin per record. Same-origin
  // sessionStorage works in every host (PWA, Kiwix Desktop, iOS).
  if (els.mapViewBtn) {
    els.mapViewBtn.addEventListener('click', () => {
      if (state.results.length === 0) return;
      // Build a label that names what's being plotted — the chip
      // label if a chip is active, otherwise the query string.
      const label = (state.chip && state.chip.label)
                    || state.query
                    || `${state.results.length} places`;
      if (stashResultsForMap(label)) {
        window.location.href = HERE + 'index.html#find=results';
      }
    });
  }
  // Restore filter from URL (#cat=museums or #q=foo). Also accepts
  // ``#lat=..&lon=..`` from the main viewer's Find link to default
  // "Search near" to the map's current view center instead of GPS.
  const hash = parseHash(location.hash);
  // Set state.query too so a `#cat=…&q=…` deep link name-filters the
  // chip results (onSearch only runs on the q-only path below).
  if (hash.q) { els.q.value = hash.q; state.query = hash.q.trim(); }
  if (hash.lat && hash.lon) {
    // Viewport-centered origin — kick off reverse-geocode in the
    // background so the "Search near" label reads the nearest city
    // name, but don't block chip/query rendering on it.
    const lat = parseFloat(hash.lat);
    const lon = parseFloat(hash.lon);
    if (isFinite(lat) && isFinite(lon)) {
      state.origin = { lat, lon };
      state.originMode = 'viewport';
      state.originLabel = `Near (${lat.toFixed(3)}, ${lon.toFixed(3)})`;
      els.near.value = state.originLabel;
      reverseGeocodeFromViewport(lat, lon).then(name => {
        if (name && state.originMode === 'viewport') {
          state.originLabel = name;
          els.near.value = name;
        }
      }).catch(() => {});  // fallback stays as coord label
    }
  }
  if (hash.cat) {
    const def = CATEGORIES.find(c => c.id === hash.cat);
    if (def) selectChip(def);
  } else if (hash.q) {
    onSearch();
  } else {
    setStatus('Type to search, or pick a category above.');
  }
})();

// ---------- reverse geocoder (viewport-center → nearest city) ----------

// Find the closest place:city|town|village record within ~50 km of
// (lat, lon) by scanning the category-index `place` chunk. The file
// name follows the OSM `type` field (singular `place`, never `places`)
// — older builds and the smoke harness both proved a hardcoded
// `places.json` 404s. Skip the request entirely if the manifest says
// no `place` chunk exists.
async function reverseGeocodeFromViewport(lat, lon) {
  try {
    const cats = state.manifests.cat && state.manifests.cat.categories;
    if (!cats || !cats.place) return null;
    const raw = await fetchJSON(CAT + 'place.json').catch(() => null);
    if (!raw || !Array.isArray(raw)) return null;
    const kinds = { city: 4, town: 3, village: 2, hamlet: 1, suburb: 1 };
    let bestName = null, bestScore = -Infinity;
    for (const r of raw) {
      const rlat = r.a, rlon = r.o;
      if (typeof rlat !== 'number' || typeof rlon !== 'number') continue;
      const d = haversine(lat, lon, rlat, rlon);
      if (d > 50000) continue;  // cap at 50 km
      const k = kinds[r.s] || kinds[r.t] || 0;
      if (!k) continue;
      // Score: prefer larger place types, break ties by proximity.
      const score = k * 1e6 - d;
      if (score > bestScore) {
        bestScore = score;
        bestName = r.n || null;
      }
    }
    return bestName;
  } catch (e) {
    return null;
  }
}

// ---------- chips ----------

function renderChips() {
  for (const def of CATEGORIES) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = def.label;
    b.dataset.cat = def.id;
    b.addEventListener('click', () => selectChip(def));
    els.chips.appendChild(b);
  }
}

function selectChip(def) {
  const isSame = state.chip && state.chip.id === def.id;
  state.chip = isSame ? null : def;
  for (const b of els.chips.querySelectorAll('button')) {
    b.classList.toggle('on', state.chip && b.dataset.cat === state.chip.id);
  }
  // Sub-filter is scoped to the current chip's result histogram —
  // clear it on chip change so we don't ghost-apply across queries.
  state.subFilter = null;
  rerunQuery();
}

// ---------- search ----------

function onSearch() {
  state.query = els.q.value.trim();
  // Sub-filter is scoped to the current query's result histogram.
  state.subFilter = null;
  rerunQuery();
}

function rerunQuery() {
  // 1. If a chip is on, fetch the category index.
  // 2. Else if there's a name query, fetch the matching prefix chunk(s).
  // 3. Else (nothing) — clear results.
  if (state.chip) {
    runChipQuery(state.chip);
  } else if (state.query.length >= 2) {
    runNameQuery(state.query);
  } else {
    state.results = [];
    // Drop the previous result set's chrome too — the sort row,
    // sub-filter chips and "On map" pill used to stay up over an
    // empty list after the query was cleared.
    state.lastRecords = [];
    state.subFilter = null;
    if (els.subfilterRow) _renderSubfilterChips([]);
    if (els.sortRow) els.sortRow.hidden = true;
    if (els.mapViewBtn) els.mapViewBtn.hidden = true;
    setStatus(state.query.length === 1
      ? 'Type at least 2 characters.'
      : 'Type to search, or pick a category above.');
    renderResults();
  }
}

// Generation counter so a slow earlier query can't overwrite the
// results of a newer one (tap Bars, tap Shops before Bars resolves →
// bars rendered under a highlighted Shops chip).
let _querySeq = 0;

async function runChipQuery(def) {
  if (maybeFetchOriginFirst()) return;
  const seq = ++_querySeq;
  setStatus(`Loading ${def.label.toLowerCase()}…`);
  // Prefer the pre-filtered per-chip file if the ZIM was built with
  // --split-find-chips. Otherwise fall back to loading the full OMT-
  // bucket file + client-side filtering (legacy path; OOMs Chrome on
  // Japan-sized ZIMs but works on smaller regions).
  let records;
  try {
    const chipsMani = state.manifests.cat
                      && state.manifests.cat.chips;
    if (chipsMani && chipsMani[def.id]) {
      records = await loadChipFile(def.id);
    } else {
      records = await loadCategory(def.cat);
      // Legacy filter path.
      if (def.subtypes && def.subtypes.length) {
        const allowed = new Set(def.subtypes);
        const extra = def.nameInclude;
        const extraAllowed = extra && extra.subtypes ? new Set(extra.subtypes) : null;
        const pattern = extra && extra.pattern;
        const includeRegex = def.includeRegex;
        records = records.filter(r => {
          if (allowed.has(r.s)) return true;
          if (includeRegex && r.s && includeRegex.test(r.s)) return true;
          if (extraAllowed && pattern && extraAllowed.has(r.s)
              && pattern.test(r.n || '')) return true;
          return false;
        });
      }
    }
  } catch (e) {
    if (seq !== _querySeq) return;
    setStatus(`Couldn't load ‘${def.label}’: ${e.message}`);
    return;
  }
  if (seq !== _querySeq) return;  // superseded while loading
  // Stack the name filter on top if there's a query.
  if (state.query) {
    records = filterByName(records, state.query);
  }
  applyResults(records);
}

async function loadChipFile(chipId) {
  if (state.cache.cats.has('chip:' + chipId)) {
    return state.cache.cats.get('chip:' + chipId);
  }
  // Sub-bucketed chips: the build emits chip-{id}-{NN}.json
  // when chip-{id}.json would exceed 10 MB (Japan restaurants
  // 164 MB, Canada shops 137 MB — both phone-fetchable but tight
  // against iOS heap). Manifest's chips[id].sub_chunks lists the
  // bucket suffixes; fan out parallel fetches, concatenate.
  const meta = (state.manifests.cat &&
                state.manifests.cat.chips &&
                state.manifests.cat.chips[chipId]) || {};
  const subBuckets = Array.isArray(meta.sub_chunks) ? meta.sub_chunks : null;
  if (subBuckets && subBuckets.length) {
    const blobs = await Promise.all(subBuckets.map(suffix =>
      fetchJSON(CAT + 'chip-' + chipId + '-' + suffix + '.json')
        .catch(() => [])));
    const combined = [].concat(...blobs);
    state.cache.cats.set('chip:' + chipId, combined);
    return combined;
  }
  const data = await fetchJSON(CAT + 'chip-' + chipId + '.json');
  state.cache.cats.set('chip:' + chipId, data);
  return data;
}

async function runNameQuery(q) {
  if (maybeFetchOriginFirst()) return;
  const seq = ++_querySeq;
  setStatus(`Searching for “${q}”…`);
  const prefixes = prefixesFor(q);
  let merged = [];
  const seen = new Set();
  for (const p of prefixes) {
    // Skip prefixes the manifest has nothing for. expandPrefix
    // covers the unsplit / hot-split / recursive-split layouts,
    // including the "empty sub_chunks list" build bug we saw on
    // Midwest's `ch` prefix.
    if (!expandPrefix(p).length) continue;
    let chunk;
    try {
      chunk = await loadChunk(p);
    } catch (e) {
      // Single missing chunk shouldn't kill the whole query.
      continue;
    }
    if (seq !== _querySeq) return;  // superseded while loading
    for (const rec of chunk) {
      // Substring match across name + subtype.
      const k = `${rec.n}@${rec.a},${rec.o}`;
      if (seen.has(k)) continue;
      if (matchesName(rec, q)) {
        merged.push(rec);
        seen.add(k);
      }
    }
  }
  if (seq !== _querySeq) return;
  applyResults(merged);
}

function filterByName(records, q) {
  return records.filter(r => matchesName(r, q));
}

// Accent-fold + lowercase, mirroring the writer's `_norm` in
// create_osm_zim.py (NFKD, strip combining marks) so "ecouen" finds
// "Écouen" and vice versa.
function foldText(s) {
  let t = String(s || '').toLowerCase();
  try { t = t.normalize('NFKD').replace(/[\u0300-\u036f]/g, ''); } catch (_) {}
  return t;
}

function matchesName(rec, q) {
  const ql = foldText(q);
  return foldText(rec.n).includes(ql) || foldText(rec.s).includes(ql);
}

// Chunk key for a word — MUST match the writer's `_prefix_key` in
// create_osm_zim.py (and `keyFor` in index.html): Latin-leading words
// use their first two ASCII-alnum chars (anything else → '_'),
// non-ASCII first chars bucket into 'u' + hex codepoint. The previous
// `q.slice(0, 2)` never matched the writer for accented, CJK, or
// punctuation-leading names, so those searches returned nothing.
function prefixKeyFor(word) {
  if (!word) return '__';
  const c0 = word.codePointAt(0);
  if (c0 >= 128) return 'u' + c0.toString(16);
  function asciiNorm(ch) {
    const code = ch.charCodeAt(0);
    const alnum = (code >= 48 && code <= 57) || (code >= 97 && code <= 122);
    return (alnum || ch === '_') ? ch : '_';
  }
  const a = asciiNorm(word[0]);
  const b = word.length > 1 ? asciiNorm(word[1]) : '_';
  return a + b;
}

function prefixesFor(q) {
  // Same logic the build script uses to chunk: 2-char prefixes of any
  // word in the (accent-folded) name. Try the query head and each word.
  const out = new Set();
  const folded = foldText(q).trim();
  if (folded.length >= 2) out.add(prefixKeyFor(folded.replace(/\s/g, '_')));
  for (const word of folded.split(/[^\p{L}\p{N}]+/u)) {
    if (word.length >= 2) out.add(prefixKeyFor(word));
  }
  return [...out];
}

// ---------- result presentation ----------

// sessionStorage key the viewer (index.html) reads on load to spawn
// pins for the current Find result set. Same key for places.html
// (the writer) and index.html (the reader); both are same-origin in
// every host (PWA, Kiwix Desktop, kiwix-serve, iOS Kiwix).
const FIND_RESULTS_STASH_KEY = 'streetzim_find_results';

// Only the fields the viewer actually needs to render a pin + popup
// — name, lat/lon, type/subtype/category, brand, contact links. Keeps
// the JSON blob small for sessionStorage (which has a few-MB cap on
// most browsers).
function _pinShape(r) {
  const out = { n: r.n, a: r.a, o: r.o };
  for (const k of ('t s cat l ws p soc brand wd'.split(' '))) {
    if (r[k]) out[k] = r[k];
  }
  return out;
}

function stashResultsForMap(label) {
  try {
    const stash = {
      label: label || '',
      origin: state.origin
        ? { lat: state.origin.lat, lon: state.origin.lon,
            label: state.originLabel } : null,
      items: state.results.map(_pinShape),
    };
    sessionStorage.setItem(FIND_RESULTS_STASH_KEY,
                           JSON.stringify(stash));
    return true;
  } catch (e) {
    // sessionStorage can throw QuotaExceededError on tiny mobile
    // budgets; surface to the user rather than silently navigating
    // to an empty map.
    console.warn('stash failed:', e);
    setStatus(`Couldn't hand off to the map (${e.message}). `
              + `Reduce the result set and try again.`);
    return false;
  }
}

function applyResults(records) {
  // Hard-filter to the map's last viewport when the user opted in.
  // Done before sort/cap so distance + count reflect the filtered set.
  // Auto-fallback: if the bbox filter would leave zero results,
  // expand to the unfiltered set instead of showing "0 matches".
  // The user has the toggle ticked by default; we don't want them
  // to think there's nothing in their area when there's just nothing
  // *of this type* in their immediate viewport — better to surface
  // what's around the city/region.
  let filteredOut = 0;
  let autoExpanded = false;
  if (state.mapAreaOn && state.mapArea) {
    const v = state.mapArea;
    const inside = (r) =>
      r.a >= v.s && r.a <= v.n && _lonInside(r.o, v.w, v.e);
    const next = [];
    for (const r of records) {
      if (inside(r)) next.push(r); else filteredOut++;
    }
    if (next.length > 0) {
      records = next;
    } else if (records.length > 0) {
      // Filter would have wiped everything — keep the original set
      // and flag for the status line.
      autoExpanded = true;
      filteredOut = 0;
    }
  }
  // Stash the post-filter records so the sort row can re-sort
  // without re-running the search.
  state.lastRecords = records.slice();
  state._lastFilteredOut = filteredOut;
  state._autoExpanded = autoExpanded;
  // Save to recent history when the search produced anything.
  if (records.length > 0) {
    if (state.chip) {
      saveRecent({ kind: 'chip', value: state.chip.id,
                   label: state.chip.label, ts: Date.now() });
    } else if (state.query && state.query.length >= 2) {
      saveRecent({ kind: 'query', value: state.query,
                   label: state.query, ts: Date.now() });
    }
  }
  _sortAndShow(records);
}

// Build "italian / shoe shop / bakery" style sub-filter chips from
// the current result set's r.s histogram. Top 8 by count, hidden
// when there's only one (or zero) distinct subtype — nothing to
// filter against. Idempotent: re-runs on every applyResults / sort
// change without leaking listeners.
function _renderSubfilterChips(records) {
  if (!els.subfilterRow) return;
  const counts = new Map();
  for (const r of records) {
    const s = (r.s || '').trim();
    if (!s) continue;
    counts.set(s, (counts.get(s) || 0) + 1);
  }
  const subs = Array.from(counts.entries())
    .filter(([_, n]) => n >= 2)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 8);
  while (els.subfilterRow.firstChild) {
    els.subfilterRow.removeChild(els.subfilterRow.firstChild);
  }
  if (subs.length < 2) {
    els.subfilterRow.hidden = true;
    return;
  }
  els.subfilterRow.hidden = false;
  // "All" pseudo-chip for clearing the filter — only meaningful when
  // a subfilter is currently active.
  if (state.subFilter) {
    const all = document.createElement('button');
    all.type = 'button';
    all.className = 'sub-chip';
    all.textContent = 'All';
    all.addEventListener('click', () => {
      state.subFilter = null;
      _sortAndShow(state.lastRecords.slice());
    });
    els.subfilterRow.appendChild(all);
  }
  for (const [sub, count] of subs) {
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'sub-chip' + (sub === state.subFilter ? ' on' : '');
    chip.textContent = `${_humanSubtype(sub)} · ${count}`;
    chip.addEventListener('click', () => {
      state.subFilter = (state.subFilter === sub) ? null : sub;
      _sortAndShow(state.lastRecords.slice());
    });
    els.subfilterRow.appendChild(chip);
  }
}

function _humanSubtype(s) {
  // OSM/Overture subtypes are snake_case; humans want spaces and
  // sentence case. "italian_restaurant" → "Italian restaurant".
  if (!s) return s;
  return s.replace(/_/g, ' ')
          .replace(/^./, c => c.toUpperCase());
}

function _sortAndShow(records) {
  // Render sub-filter chips from the unfiltered set so the user
  // can always see all subtypes available, even after a sub-filter
  // is applied. Then narrow `records` if a subfilter is active.
  _renderSubfilterChips(records);
  if (state.subFilter) {
    records = records.filter(r => (r.s || '') === state.subFilter);
  }
  const mode = _effectiveSortMode();
  if (mode === 'distance' && state.origin) {
    for (const r of records) {
      r._dist = haversine(state.origin.lat, state.origin.lon, r.a, r.o);
    }
    records.sort((a, b) => a._dist - b._dist);
  } else {
    // Records are shared cached objects: a distance computed for an
    // earlier origin would otherwise keep rendering after the origin
    // was dropped (GPS denied after a custom pick, etc.).
    for (const r of records) r._dist = undefined;
  }
  if (mode === 'distance' && state.origin) {
    // sorted above
  } else if (mode === 'category') {
    records.sort((a, b) => {
      const ca = (a.cat || a.s || a.t || '').toString();
      const cb = (b.cat || b.s || b.t || '').toString();
      return ca.localeCompare(cb)
          || (a.n || '').localeCompare(b.n || '');
    });
  } else { // name (default)
    records.sort((a, b) => (a.n || '').localeCompare(b.n || ''));
  }
  // Cap to keep the DOM responsive on big indices.
  state.results = records.slice(0, 300);
  let countLine;
  if (records.length > state.results.length) {
    countLine = `Showing first ${state.results.length} of ${records.length} matches`;
  } else {
    countLine = `${state.results.length} match${state.results.length === 1 ? '' : 'es'}`;
  }
  if (state.mapAreaOn && state.mapArea && state._lastFilteredOut > 0) {
    countLine += ` (filtered ${state._lastFilteredOut} outside map area)`;
  } else if (state._autoExpanded) {
    countLine += ' (none in map area — showing all)';
  }
  countLine += '.';
  state._statusBase = countLine;  // applyStatusNote rebuilds from this
  if (state.originMode === 'none' && state.originNote) {
    countLine += ' — ' + state.originNote;
  }
  setStatus(countLine);
  // Show the sort row only when there's a meaningful number to sort.
  if (els.sortRow) {
    els.sortRow.hidden = state.results.length < 2;
    _refreshSortButtons();
  }
  // Show the "On map" pill iff there's something to plot. Toggle
  // every applyResults call so chip/query swaps refresh visibility.
  if (els.mapViewBtn) els.mapViewBtn.hidden = state.results.length === 0;
  renderResults();
}

function renderResults() {
  els.results.innerHTML = '';
  for (const r of state.results) {
    const li = document.createElement('li');

    const h = document.createElement('h3');
    h.textContent = r.n || '(unnamed)';
    li.appendChild(h);

    const meta = document.createElement('p');
    meta.className = 'meta';
    const parts = [];
    // Prefer Overture's normalized category over OMT's subtype for display.
    const kindLabel = r.cat || r.s;
    if (kindLabel) parts.push(prettyKind(kindLabel));
    if (r._dist != null) parts.push(formatDistance(r._dist));
    if (r.l) parts.push(r.l);
    meta.textContent = parts.join(' · ');
    li.appendChild(meta);

    // Enrichment row — website / phone / socials when Overture supplied
    // them. Keep the markup lean: icon-only links row.
    // `ws` (website), not `w` — `w` is reserved for the OSM Wikipedia
    // tag in the same record; see commit fa6208b.
    if (r.ws || r.p || (r.soc && r.soc.length) || r.brand || r.w) {
      const rich = document.createElement('p');
      rich.className = 'rich';
      if (r.brand) {
        const b = document.createElement('span');
        b.className = 'brand';
        b.textContent = r.brand;
        rich.appendChild(b);
      }
      const links = document.createElement('span');
      links.className = 'links';
      const wsUrl = safeHttpUrl(r.ws);
      if (wsUrl) {
        const a = document.createElement('a');
        a.href = wsUrl; a.target = '_blank'; a.rel = 'noopener';
        a.title = wsUrl; a.textContent = '🌐';
        links.appendChild(a);
      }
      if (r.w) {
        // OSM Wikipedia title ("en:Article Title"), incl. titles backfilled
        // from a wikidata Q-ID. Links to the public site (the rich detail
        // panel in index.html prefers a local Wikipedia ZIM when present).
        const wt = String(r.w), wc = wt.indexOf(':');
        const isLang = wc >= 2 && wc <= 3 && /^[a-z]+$/i.test(wt.slice(0, wc));
        const wl = isLang ? wt.slice(0, wc).toLowerCase() : 'en';
        const wtitle = (isLang ? wt.slice(wc + 1) : wt).replace(/ /g, '_');
        const a = document.createElement('a');
        a.href = 'https://' + wl + '.wikipedia.org/wiki/' + encodeURIComponent(wtitle);
        a.target = '_blank'; a.rel = 'noopener';
        a.title = 'Wikipedia'; a.textContent = '📖';
        links.appendChild(a);
      }
      if (r.p) {
        const a = document.createElement('a');
        a.href = 'tel:' + String(r.p).replace(/\s+/g, '');
        a.title = String(r.p); a.textContent = '📞';
        links.appendChild(a);
      }
      if (r.soc && r.soc.length) {
        for (const raw of r.soc.slice(0, 3)) {
          const s = safeHttpUrl(raw);
          if (!s) continue;
          const host = s.toLowerCase();
          const g = /facebook/.test(host) ? 'f'
                  : /instagram/.test(host) ? 'IG'
                  : /twitter|x\.com/.test(host) ? '𝕏'
                  : /tiktok/.test(host) ? 'TT' : '•';
          const a = document.createElement('a');
          a.href = s; a.target = '_blank'; a.rel = 'noopener';
          a.title = s; a.textContent = g;
          links.appendChild(a);
        }
      }
      rich.appendChild(links);
      li.appendChild(rich);
    }

    const ctas = document.createElement('div');
    ctas.className = 'ctas';
    const dirA = document.createElement('a');
    dirA.className = 'primary';
    dirA.textContent = 'Directions';
    // If we already have the user's location (from the sort-by-distance
    // toggle), pass it as `origin=…` so the viewer's routing panel can
    // fill both endpoints up front instead of forcing the user to tap
    // the GPS button and wait for a second fix.
    // Use the runtime-computed `HERE` (line ~146) instead of static
    // `../index.html` or bare `index.html`. The two hosting paths
    // disagree on what the right base is:
    //   - Firebase PWA serves places at `/drive/viewer/places/`
    //     (trailingSlash:true) → relative `index.html` resolves to
    //     `/drive/viewer/places/index.html` (404). `../index.html`
    //     works here but…
    //   - Kiwix Desktop / iOS Kiwix serve places.html at the ZIM
    //     root → `../index.html` is OUT OF BOUNDS (zimcheck failure
    //     on every shipped ZIM). Bare `index.html` works here.
    // HERE = location.pathname stripped of the trailing filename,
    // so HERE + 'index.html' resolves correctly on both: PWA gets
    // `/drive/viewer/index.html`, Kiwix gets `<zim-root>/index.html`.
    let href = HERE + 'index.html#dest=' + r.a + ',' + r.o
             + '&label=' + encodeURIComponent(r.n || '');
    // Only a real GPS fix may ride along as origin — index.html labels
    // any `origin=` "Current location" and caches it as the device
    // position, which was wrong for a "Search near <city>" pick or a
    // viewport-centre deep link.
    if (state.origin && state.originMode === 'gps') {
      href += '&origin=' + state.origin.lat + ',' + state.origin.lon;
    }
    dirA.href = href;
    ctas.appendChild(dirA);
    const mapA = document.createElement('a');
    mapA.textContent = 'Map';
    const zoom = (r.t === 'place' || r.t === 'park') ? 14 : 16;
    mapA.href = HERE + 'index.html#map=' + zoom + '/' + r.a + '/' + r.o
              + '&pin=' + r.a + ',' + r.o
              + '&label=' + encodeURIComponent(r.n || '');
    ctas.appendChild(mapA);

    li.appendChild(ctas);
    els.results.appendChild(li);
  }
}

function prettyKind(s) {
  return s.replace(/_/g, ' ');
}

function formatDistance(m) {
  if (m == null) return '';
  if (m < 1000) return Math.round(m) + ' m';
  return (m / 1000).toFixed(1) + ' km';
}

// ---------- Origin selection ----------
// originMode: 'gps' (implicit my-location) | 'custom' (user picked a
// named place from the near-typeahead) | 'none' (GPS denied/refused —
// falls back to alphabetical sort).
state.originMode = 'gps';
state.originLabel = 'My location';

function requestGPS() {
  if (!navigator.geolocation) {
    state.origin = null;
    state.originMode = 'none';
    state.originNote = 'No geolocation on this device — pick a place under "Search near" to sort by distance.';
    // Re-run so the chip / query that triggered this isn't dropped.
    rerunQuery();
    return;
  }
  setStatus('Getting your location…');
  // Ownership: while the prompt is up the user may pick "Search near
  // <place>" or a deep link may install a viewport origin. Those set
  // originMode to 'custom' / 'viewport'; none of the callbacks below
  // may then clobber the origin they chose.
  function gpsStillWanted() {
    return state.originMode === 'gps' || state.originMode === 'none';
  }
  // The 8 s geolocation timeout only starts once permission is
  // granted; an unanswered permission prompt would otherwise leave
  // "Getting your location…" up forever with the query never run.
  let gaveUp = false;
  const giveUp = setTimeout(() => {
    gaveUp = true;
    if (!gpsStillWanted() || state.origin) return;
    state.originMode = 'none';
    state.originNote = 'Location not available yet — sorted by name.';
    rerunQuery();
  }, 12000);
  navigator.geolocation.getCurrentPosition(
    pos => {
      clearTimeout(giveUp);
      // A late grant (after the 12 s give-up) is still welcome as long
      // as nobody picked another origin in the meantime.
      if (!gpsStillWanted()) return;
      state.origin = { lat: pos.coords.latitude, lon: pos.coords.longitude };
      state.originMode = 'gps';
      state.originLabel = 'My location';
      state.originNote = '';
      els.near.value = 'My location';
      rerunQuery();
    },
    err => {
      clearTimeout(giveUp);
      if (!gpsStillWanted() || state.origin) return;
      state.originMode = 'none';
      // Kept in state and appended to the result count line by
      // _sortAndShow, because a plain setStatus here was overwritten
      // a moment later by the query's own status text.
      state.originNote = `Location unavailable (${err.message}) — sorted by name. Pick a place under "Search near" to sort by distance.`;
      if (!gaveUp) rerunQuery();  // the give-up timer already re-ran it
      else applyStatusNote();
    },
    { enableHighAccuracy: false, maximumAge: 60000, timeout: 8000 }
  );
}

// Re-apply the origin note to the current status line (used when the
// note changes after the results have already been rendered).
function applyStatusNote() {
  if (state.originNote && state._statusBase && state.results.length) {
    // Rebuild from the stored base line — splitting the live text on
    // ' — ' also cut "(none in map area — showing all)" in half.
    setStatus(state._statusBase + ' — ' + state.originNote);
  }
}

// Lazy trigger — called before running a chip or name query. When the
// user hasn't picked a custom origin and we haven't fetched GPS, ask
// for it; return true so the caller waits (requestGPS's success
// handler fires rerunQuery). Returns false when caller can proceed.
function maybeFetchOriginFirst() {
  // Viewport origin (from hash) and custom origin (user picked a
  // named place) both skip GPS — they already have a point.
  if (state.originMode === 'viewport' && state.origin) return false;
  if (state.originMode === 'custom' && state.origin) return false;
  if (state.originMode === 'none') return false;
  if (!state.origin) { requestGPS(); return true; }
  return false;
}

// --- near-typeahead ---

function hideNearResults() {
  els.nearResults.hidden = true;
  els.nearResults.replaceChildren();
}

function renderNearResults(cands, activeIdx) {
  els.nearResults.replaceChildren();
  if (!cands.length) {
    const msg = document.createElement('div');
    msg.className = 'near-result';
    msg.style.color = 'var(--muted)';
    msg.textContent = 'No matches.';
    els.nearResults.appendChild(msg);
    els.nearResults.hidden = false;
    return;
  }
  cands.forEach((c, i) => {
    const row = document.createElement('div');
    row.className = 'near-result' + (i === activeIdx ? ' active' : '');
    row.setAttribute('role', 'option');
    const nameEl = document.createElement('div');
    nameEl.textContent = c.n || '(unnamed)';
    row.appendChild(nameEl);
    const sub = [];
    if (c.cat) sub.push(prettyKind(c.cat));
    else if (c.s) sub.push(prettyKind(c.s));
    if (c.l) sub.push(c.l);
    if (sub.length) {
      const subEl = document.createElement('div');
      subEl.className = 'sub';
      subEl.textContent = sub.join(' · ');
      row.appendChild(subEl);
    }
    row.addEventListener('click', () => pickNearResult(c));
    els.nearResults.appendChild(row);
  });
  els.nearResults.hidden = false;
}

let nearActive = -1;
let nearCandidates = [];

async function onNearInput() {
  const q = els.near.value.trim();
  if (q.length < 2 || q === 'My location') { hideNearResults(); return; }
  const prefixes = prefixesFor(q);
  if (!prefixes.length) { hideNearResults(); return; }
  const seen = new Set();
  const matches = [];
  const needle = q.toLowerCase();
  for (const p of prefixes) {
    // Skip prefixes the manifest has nothing for. expandPrefix
    // covers the unsplit / hot-split / recursive-split layouts,
    // including the "empty sub_chunks list" build bug we saw on
    // Midwest's `ch` prefix.
    if (!expandPrefix(p).length) continue;
    let chunk;
    try { chunk = await loadChunk(p); } catch { continue; }
    for (const r of chunk) {
      if (!r.n) continue;
      const lower = r.n.toLowerCase();
      if (!lower.includes(needle)) continue;
      const key = `${r.n}|${r.a}|${r.o}`;
      if (seen.has(key)) continue;
      seen.add(key);
      matches.push(r);
    }
  }
  matches.sort((a, b) => {
    const aStart = a.n.toLowerCase().startsWith(needle) ? 0 : 1;
    const bStart = b.n.toLowerCase().startsWith(needle) ? 0 : 1;
    if (aStart !== bStart) return aStart - bStart;
    return a.n.length - b.n.length;
  });
  nearCandidates = matches.slice(0, 12);
  nearActive = nearCandidates.length ? 0 : -1;
  renderNearResults(nearCandidates, nearActive);
}

function onNearKeydown(e) {
  if (els.nearResults.hidden) return;
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    nearActive = Math.min(nearCandidates.length - 1, nearActive + 1);
    renderNearResults(nearCandidates, nearActive);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    nearActive = Math.max(0, nearActive - 1);
    renderNearResults(nearCandidates, nearActive);
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (nearActive >= 0 && nearCandidates[nearActive]) {
      pickNearResult(nearCandidates[nearActive]);
    }
  } else if (e.key === 'Escape') {
    hideNearResults();
  }
}

function pickNearResult(r) {
  state.origin = { lat: r.a, lon: r.o };
  state.originMode = 'custom';
  state.originLabel = r.n;
  els.near.value = r.n;
  // When the user explicitly pins a near-origin, drop the
  // "Limit to map area" filter. The implicit viewport from
  // index.html is almost certainly stale relative to the user's
  // new choice (e.g. user types "Cancún" while map is parked on
  // Caribbean center → otherwise mapArea filter strips all
  // Mexican results and we surface 600+ km Cayman gas stations
  // as "nearest to Cancún"). The user can re-tick the box to
  // re-engage map-area filtering.
  if (state.mapAreaOn) {
    state.mapAreaOn = false;
    if (els.mapAreaCheck) els.mapAreaCheck.checked = false;
  }
  hideNearResults();
  rerunQuery();
}

function clearNearCustom() {
  state.origin = null;
  state.originMode = 'gps';
  state.originLabel = 'My location';
  els.near.value = 'My location';
  hideNearResults();
  requestGPS();
}

// No-op shim — the GPS toggle is gone from the UI but we keep the
// symbol so any deep-link code that still references onGpsToggle()
// doesn't explode. Real origin-selection is in requestGPS +
// pickNearResult above.
function onGpsToggle() { /* intentionally empty */ }

// ---------- data loading ----------

// Expand a prefix to the set of leaf chunk filenames that hold its
// records. Three layouts in the wild:
//   1. Unsplit:        chunks['de'] = size; load 'de.json'.
//   2. Hot-split:      sub_chunks['de'] = ['de-0','de-1',...,'de-f'];
//                      each child appears in chunks. Load all 16.
//   3. Recursively-split (hot prefix split *again*): sub_chunks['ch']
//      may be empty, with intermediate keys ('ch-0'→['ch-0-0']) and
//      4-char leaves ('ch-0-0-0') in chunks. The Midwest build hit
//      this for "ch" (Chicago, Cherokee, …). The manifest *should*
//      list the intermediate children under sub_chunks['ch'], but
//      that array can be empty in current builds — fall back to a
//      chunks-map scan for keys starting with `<prefix>-`.
function expandPrefix(prefix) {
  const m = state.manifests && state.manifests.search;
  if (!m) return [];
  const chunks = m.chunks || {};
  const subs = m.sub_chunks || {};
  if (chunks[prefix]) return [prefix];
  const direct = subs[prefix];
  if (Array.isArray(direct) && direct.length) {
    return direct.flatMap(expandPrefix);
  }
  // Fallback: scan chunks for leaves under this prefix (covers the
  // empty-sub_chunks build bug).
  return Object.keys(chunks).filter(k =>
    k === prefix || k.startsWith(prefix + '-'));
}

async function loadChunk(prefix) {
  if (state.cache.chunks.has(prefix)) return state.cache.chunks.get(prefix);
  const leaves = expandPrefix(prefix);
  if (leaves.length === 1 && leaves[0] === prefix) {
    const data = await fetchJSON(DATA + prefix + '.json');
    state.cache.chunks.set(prefix, data);
    return data;
  }
  if (leaves.length === 0) {
    state.cache.chunks.set(prefix, []);
    return [];
  }
  const blobs = await Promise.all(leaves.map(name =>
    fetchJSON(DATA + name + '.json').catch(() => [])));
  const merged = [].concat(...blobs);
  state.cache.chunks.set(prefix, merged);
  return merged;
}

async function loadCategory(slug) {
  if (state.cache.cats.has(slug)) return state.cache.cats.get(slug);
  if (!state.manifests.cat || !state.manifests.cat.categories
      || !(slug in state.manifests.cat.categories)) {
    throw new Error(`category ‘${slug}’ not in the index`);
  }
  const data = await fetchJSON(CAT + slug + '.json');
  state.cache.cats.set(slug, data);
  return data;
}

async function fetchJSON(url) {
  const res = await fetch(url, { cache: 'force-cache' });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

// ---------- helpers ----------

function setStatus(text) { els.statusText.textContent = text; }

function debounce(fn, ms) {
  let t = null;
  return function () {
    const a = arguments, c = this;
    if (t) clearTimeout(t);
    t = setTimeout(() => fn.apply(c, a), ms);
  };
}

function parseHash(h) {
  const out = {};
  if (!h || h[0] !== '#') return out;
  for (const pair of h.slice(1).split('&')) {
    const [k, ...rest] = pair.split('=');
    if (!k) continue;
    const raw = rest.join('=');
    // A malformed escape (`#q=50%`) used to throw URIError out of the
    // async init and leave the page stuck on "Loading places index…".
    try { out[k] = decodeURIComponent(raw); } catch (_) { out[k] = raw; }
  }
  return out;
}

// Only http(s) links may come out of index data — a `javascript:`
// website/social value in a record would otherwise execute on tap.
function safeHttpUrl(u) {
  if (typeof u !== 'string') return null;
  const t = u.trim();
  return /^https?:\/\//i.test(t) ? t : null;
}

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000; // metres
  const r = Math.PI / 180;
  const dLat = (lat2 - lat1) * r;
  const dLon = (lon2 - lon1) * r;
  const a = Math.sin(dLat / 2) ** 2
          + Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(a)));
}

// Longitude-inside-bounds with antimeridian wraparound. MapLibre's
// getBounds() returns UNWRAPPED longitudes when the camera spans
// 180° (e.g. west=170, east=190) while records store [-180, 180], so
// also test the record shifted by ±360°. Kept the e<w union form for
// callers that hand us pre-wrapped bounds.
function _lonInside(lon, w, e) {
  if (w <= e) {
    return (lon >= w && lon <= e)
        || (lon + 360 >= w && lon + 360 <= e)
        || (lon - 360 >= w && lon - 360 <= e);
  }
  return lon >= w || lon <= e;
}
