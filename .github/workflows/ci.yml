# Seven jobs (docker builds the image and runs `streetzim` in it as Zimfarm would):
#   checks     - lint gate, Python unit tests (with coverage), Node viewer/PWA
#                tests. Fast, offline.
#   wheel      - `python -m build`, then the wheel installed into a fresh venv
#                and run from outside the checkout (docs/packaging.md).
#   python-3-14 - the unit tests on Python 3.14 with zimscraperlib installed.
#   openfreemap-tiles - builds from the same OpenFreeMap MBTiles openzim/maps
#                uses (no tilemaker), validates, and loads it through kiwix-serve.
#   monaco-e2e - builds a real Monaco ZIM from Geofabrik with tilemaker v3 and the
#                production routing layout, then runs cloud/validate_zim.py
#                (with a current zimcheck) and a headless-browser smoke test of
#                the viewer served straight out of the ZIM, both by a minimal
#                server and by Kiwix's own kiwix-serve. Everything here uses
#                stock libzim (python-libzim, zim-tools, kiwix-tools); nothing
#                needs the optional Rust packer. It also builds Monaco with the
#                Python manifest packer (--zim-builder manifest --xapian none)
#                and validates that with zimcheck required. It also exercises the tools
#                that rewrite published ZIMs (repackage, in-place viewer patch). Also runs weekly so
#                upstream drift (Geofabrik, the pinned fonts on their CDN,
#                tilemaker, libzim) shows up without a code change.
#   live-full  - weekly and on demand: `streetzim --profile full` in the image against
#                the live sources (Overture must work; Wikimedia only warns).
name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Per event as well as ref: the weekly run and a manual run on main must not
# cancel a push's run (its image is published after it passes).
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  TILEMAKER_REF: v3.0.0
  ZIM_TOOLS_VERSION: 3.8.0
  KIWIX_TOOLS_VERSION: 3.8.2

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install Python dependencies (osmium-tool runs the routing builder's highway filter in the tests)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q osmium-tool
          pip install -r requirements-dev.txt
      - name: Lint (ruff; the rule families are in ruff.toml)
        run: ruff check .
      - name: Type check (pyright; strict modules clean, no new findings elsewhere)
        env:
          PYRIGHT_PYTHON_FORCE_VERSION: "1.1.409"
        run: python tools/pyright_gate.py
      - name: Viewer index.html matches its parts
        run: python tools/build_viewer.py --check
      - name: Viewer search fold's combining-mark table matches unicodedata (tools/gen_combining_marks.py)
        run: python tools/gen_combining_marks.py --check
      - name: Vendored MapLibre and RTL plugin match resources/viewer-assets.lock.json
        run: python tools/pin_viewer_assets.py --check
      - name: ESLint (viewer JavaScript; eslint.config.mjs)
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
        run: |
          npm ci --no-audit --no-fund
          npm run lint:viewer
      - name: offliner-definition.json matches the streetzim flags
        run: python tools/offliner_definition.py --check
      - name: offliner-definition.json validates against Zimfarm's own schema
        # zimfarm_backend's OfflinerSpecSchema at a pinned commit, in its own
        # venv with just the packages its models import.
        env:
          ZIMFARM_REF: 917d7bc
        run: |
          git clone -q --filter=blob:none --no-checkout https://github.com/openzim/zimfarm /tmp/zimfarm
          git -C /tmp/zimfarm checkout -q "$ZIMFARM_REF" -- backend/src
          python -m venv /tmp/zfvenv
          /tmp/zfvenv/bin/pip install -q "pydantic[email]==2.11.4" "pydantic-extra-types==2.10.6" \
            "SQLAlchemy==2.0.41" "PyJWT==2.13.0" "pytz==2025.2" "humanfriendly==10.0" \
            "pycountry==24.6.1" "regex==2025.9.1" "requests==2.33.0"
          PYTHONPATH=/tmp/zimfarm/backend/src /tmp/zfvenv/bin/python tools/check_zimfarm_schema.py
          # Recipes per --profile through Zimfarm's own models and compute_flags.
          /tmp/zfvenv/bin/pip install -q "pytest>=8.0"
          PYTHONPATH=/tmp/zimfarm/backend/src:$PWD /tmp/zfvenv/bin/python -m pytest -q \
            -p no:cacheprovider -W ignore tests/test_offliner_definition.py -k zimfarm
      - name: Install pytest-cov (pyproject.toml's test extra)
        run: pip install pytest-cov==7.1.0
      - name: Python tests
        run: python -m pytest tests -q --cov --cov-report=
      - name: Core/ops boundary (ops/README.md)
        run: python tools/check_boundary.py
      - name: Ops tests (ops/tests)
        run: python -m pytest ops/tests -q --cov --cov-append --cov-report=
      # Coverage of both test runs above ([tool.coverage] in pyproject.toml;
      # code run in subprocesses is not counted). The table goes to the job
      # summary, the XML and HTML reports to the `coverage` artifact.
      - name: Coverage report
        run: |
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          coverage report | tail -1
          coverage xml -o coverage.xml
          coverage html -d htmlcov -q
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.xml
            htmlcov
          retention-days: 14
      # Optional: upload to Codecov once the maintainer adds a CODECOV_TOKEN
      # repository secret (docs/packaging.md); without it this is skipped.
      - name: Codecov token set?
        id: codecov
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -n "$CODECOV_TOKEN" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; fi
      - name: Upload coverage to Codecov
        if: steps.codecov.outputs.enabled == 'true'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false
      - name: Node tests
        env:
          PYTHON: python
        # test_picker / test_sw_streaming need a browser and the PWA server,
        # test_preview_proxy talks to archive.org; they are run by hand.
        run: |
          for t in tests/chip_rules_js.test.mjs tests/chip_shards_js.test.mjs \
                   tests/search_shards_js.test.mjs tests/search_fold_js.test.mjs \
                   tests/search_ranges_js.test.mjs \
                   tests/zim_reader_js.test.mjs \
                   tests/test_zim_http_source.mjs tests/viewer_style_js.test.mjs \
                   tests/viewer_ui_js.test.mjs tests/viewer_search_js.test.mjs \
                   tests/viewer_routing_pickers_js.test.mjs; do
            echo "::group::$t"
            node "$t"
            echo "::endgroup::"
          done

  wheel:
    # What `pip install streetzim` would get: the sdist and wheel from
    # `python -m build` (the wheel is built from the sdist), installed into a
    # fresh venv and run from /tmp, so nothing comes from the checkout.
    # tools/check_wheel_install.py needs no network; the proxy variables
    # point at a closed port so a download attempt would fail.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Build the sdist and wheel
        run: |
          pip install build==1.6.1
          python -m build
          ls -l dist
      - name: Install the wheel into a fresh venv
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/streetzim-*.whl
      - name: Run the installed `streetzim` from outside the checkout
        working-directory: /tmp
        env:
          http_proxy: http://127.0.0.1:9
          https_proxy: http://127.0.0.1:9
        run: |
          /tmp/wheel-venv/bin/streetzim --help > /dev/null
          /tmp/wheel-venv/bin/python "$GITHUB_WORKSPACE/tools/check_wheel_install.py"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 14

  python-3-14:
    # openZIM's scrapers and the Docker image run Python 3.14, where
    # zimscraperlib is installed and the `streetzim` command uses it; the
    # other jobs run 3.12 (the production host), where it is not. This runs
    # the unit tests with zimscraperlib, including the check that
    # streetzim/zim_metadata.py's copy of its rules still agrees with it.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies (zimscraperlib needs libmagic and cairo; osmium-tool runs tests/test_precut.py and the routing tests)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libmagic1t64 libcairo2 osmium-tool
          pip install -r requirements-dev.txt
          python -c "from streetzim import scraperlib; assert scraperlib.AVAILABLE"
      - name: Viewer search fold's combining-mark table is exactly this Unicode's (tools/gen_combining_marks.py)
        run: python tools/gen_combining_marks.py --check --exact
      - name: Python tests
        run: python -m pytest tests -q

  monaco-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install Python and Node dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
        run: |
          pip install -r requirements.txt
          npm ci --no-audit --no-fund
          sudo apt-get update -q
          sudo apt-get install -y -q osmium-tool unzip

      # Ubuntu's tilemaker (2.4) is too old for resources/tilemaker/*.lua.
      - name: Cache tilemaker ${{ env.TILEMAKER_REF }}
        id: tilemaker-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/tilemaker
          key: tilemaker-${{ env.TILEMAKER_REF }}-ubuntu-24.04
      # The -dev packages also pull in the runtime libraries, so install them
      # on a cache hit too rather than guessing runtime package names.
      - name: Install tilemaker build and runtime libraries
        run: |
          sudo apt-get install -y -q build-essential cmake libboost-dev \
            libboost-filesystem-dev libboost-iostreams-dev libboost-program-options-dev \
            libboost-system-dev liblua5.1-0-dev libshp-dev libsqlite3-dev rapidjson-dev zlib1g-dev
      - name: Build tilemaker ${{ env.TILEMAKER_REF }}
        if: steps.tilemaker-cache.outputs.cache-hit != 'true'
        run: |
          git clone -q --depth 1 --branch "$TILEMAKER_REF" https://github.com/systemed/tilemaker.git /tmp/tilemaker
          cmake -S /tmp/tilemaker -B /tmp/tilemaker/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/tilemaker/build -j"$(nproc)"
          mkdir -p ~/.local/tilemaker && cp /tmp/tilemaker/build/tilemaker ~/.local/tilemaker/
      # Ubuntu's zimcheck (3.2) cannot read ZIMs written by current libzim.
      # download.openzim.org can be slow, so the tarball is cached.
      - name: Cache zim-tools ${{ env.ZIM_TOOLS_VERSION }}
        id: zimtools-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/zim-tools
          key: zim-tools-${{ env.ZIM_TOOLS_VERSION }}-linux-x86_64
      - name: Download zim-tools ${{ env.ZIM_TOOLS_VERSION }}
        if: steps.zimtools-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 3 --max-time 1200 -o /tmp/zt.tgz \
            "https://download.openzim.org/release/zim-tools/zim-tools_linux-x86_64-${ZIM_TOOLS_VERSION}.tar.gz"
          mkdir -p ~/.local/zim-tools
          tar -xzf /tmp/zt.tgz -C ~/.local/zim-tools --strip-components=1
      - name: Cache kiwix-tools ${{ env.KIWIX_TOOLS_VERSION }}
        id: kiwixtools-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/kiwix-tools
          key: kiwix-tools-${{ env.KIWIX_TOOLS_VERSION }}-linux-x86_64
      - name: Download kiwix-tools ${{ env.KIWIX_TOOLS_VERSION }}
        if: steps.kiwixtools-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 3 --max-time 1200 -o /tmp/kt.tgz \
            "https://download.kiwix.org/release/kiwix-tools/kiwix-tools_linux-x86_64-${KIWIX_TOOLS_VERSION}.tar.gz"
          mkdir -p ~/.local/kiwix-tools
          tar -xzf /tmp/kt.tgz -C ~/.local/kiwix-tools --strip-components=1
      - name: Put tilemaker, zim-tools and kiwix-tools on PATH
        run: |
          echo "$HOME/.local/zim-tools" >> "$GITHUB_PATH"
          echo "$HOME/.local/kiwix-tools" >> "$GITHUB_PATH"
          echo "$HOME/.local/tilemaker" >> "$GITHUB_PATH"

      - name: Cache coastline and Natural Earth shapefiles
        id: shp-cache
        uses: actions/cache@v4
        with:
          path: |
            coastline
            landcover
          key: shapefiles-v1
      - name: Fetch shapefiles
        if: steps.shp-cache.outputs.cache-hit != 'true'
        run: scripts/fetch-shapefiles.sh .

      # The Monaco extract, fetched once a week and cached: from Geofabrik,
      # else the openstreetmap.fr mirror, else last week's copy. A Geofabrik
      # outage (2026-09-30: every extract a redirect loop, then a 404) used
      # to fail this job, and with it the image publish. When both sources
      # fail, last week's copy is used and then cached under this week's key,
      # so it stays until next week's fetch.
      - name: Week of the Monaco extract
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Cache the Monaco extract
        id: pbf-cache
        uses: actions/cache@v4
        with:
          path: monaco-latest.osm.pbf
          key: monaco-pbf-${{ steps.week.outputs.week }}
          restore-keys: monaco-pbf-
      - name: Fetch the Monaco extract
        if: steps.pbf-cache.outputs.cache-hit != 'true'
        run: |
          for url in https://download.geofabrik.de/europe/monaco-latest.osm.pbf \
                     https://download.openstreetmap.fr/extracts/europe/monaco-latest.osm.pbf; do
            if curl -fsSL --retry 3 --connect-timeout 20 --max-time 300 --max-redirs 5 \
                 -o monaco.part "$url" \
               && head -c 32 monaco.part | LC_ALL=C grep -qa OSMHeader \
               && osmium fileinfo -e -F pbf monaco.part > /dev/null; then
              mv monaco.part monaco-latest.osm.pbf; echo "fetched $url"; exit 0
            fi
            echo "::warning::could not fetch $url"
          done
          # Both down: last week's cached copy, if the cache had one.
          test -s monaco-latest.osm.pbf && echo "using the cached copy" && exit 0
          echo "::error::no Monaco extract"; exit 1

      - name: Build Monaco ZIM
        env:
          STREETZIM_REQUIRE_SHAPEFILES: "1"
        run: |
          python create_osm_zim.py --area monaco --pbf monaco-latest.osm.pbf --routing \
            --spatial-chunk-scale 10 --split-find-chips -o osm-monaco-ci.zim

      - name: Validate (cloud/validate_zim.py + zimcheck)
        env:
          STREETZIM_REQUIRE_ZIMCHECK: "1"
        run: python cloud/validate_zim.py osm-monaco-ci.zim

      # The Python manifest packer (streetzim/pack.py) on a real build, with
      # no Xapian indexes (--xapian none): the same validator, with zimcheck
      # required. Reuses this job's extract, tilemaker and zim-tools; the
      # Monaco build takes well under a minute.
      - name: Build Monaco with the manifest packer and validate it (zimcheck required)
        env:
          STREETZIM_REQUIRE_SHAPEFILES: "1"
          STREETZIM_REQUIRE_ZIMCHECK: "1"
        run: |
          python create_osm_zim.py --area monaco --pbf monaco-latest.osm.pbf --routing \
            --zim-builder manifest --xapian none -o osm-monaco-manifest.zim
          python cloud/validate_zim.py osm-monaco-manifest.zim
          rm osm-monaco-manifest.zim

      - name: Browser smoke test of the in-ZIM viewer
        run: |
          python cloud/serve_zim_entries.py osm-monaco-ci.zim --port 8899 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8899/map-config.json >/dev/null && break; sleep 1; done
          ZIM_ORIGIN=http://127.0.0.1:8899 \
            CHROME_PATH="$(command -v google-chrome || command -v chromium)" \
            node cloud/zim_viewer_smoke.mjs

      - name: Browser smoke test through kiwix-serve
        run: |
          kiwix-serve --port 8900 osm-monaco-ci.zim &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8900/content/osm-monaco-ci/map-config.json >/dev/null && break; sleep 1; done
          ZIM_ORIGIN=http://127.0.0.1:8900/content/osm-monaco-ci \
            CHROME_PATH="$(command -v google-chrome || command -v chromium)" \
            node cloud/zim_viewer_smoke.mjs

      # The production gate's overlap check. The smoke tests above never
      # measure layout, so a control drawn over another one passed CI: #22's
      # "Show the whole map" button landed under the satellite/terrain/wiki
      # panel and only the host's gates caught it.
      - name: No overlapping controls at phone widths (overlap-check)
        run: |
          kiwix-serve --port 8902 osm-monaco-ci.zim &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8902/content/osm-monaco-ci/map-config.json >/dev/null && break; sleep 1; done
          # SHOW_ALL_CONTROLS=1: Monaco has no satellite, terrain or Wikidata,
          # so the layer panel is empty here unless forced visible. Portrait
          # sizes from the device matrix, and landscape phones.
          fail=0
          for s in 320x568 375x667 390x844 430x932 844x390 667x375 932x430; do
            ZIM_ORIGIN=http://127.0.0.1:8902/content/osm-monaco-ci VW=${s%x*} VH=${s#*x} SHOW_ALL_CONTROLS=1 \
              CHROME_PATH="$(command -v google-chrome || command -v chromium)" \
              node tmp/overlap-check.mjs | tee "overlap-$s.txt"
            grep -q '^NO OVERLAPS' "overlap-$s.txt" || { echo "::error::controls overlap at $s"; fail=1; }
          done
          exit $fail

      # A chip tap and "Search this area" re-framed the results at zoom 14,
      # pulling a reader at zoom 16 out to 14 (16 times the area) on every
      # tap. Uses the kiwix-serve started by the overlap-check step.
      # GEO_ORIGIN: the same ZIM with its chips as geographic shards (a
      # tiny --chip-shard-mb; Monaco's chips are far under the 2 MB default,
      # so CI's build never uses that code path otherwise).
      - name: Search this area keeps the reader's view (search-area check)
        run: |
          python cloud/repackage_zim.py osm-monaco-ci.zim osm-monaco-geo.zim \
            --split-find-chips --chip-shard-mb 0.003
          kiwix-serve --port 8903 osm-monaco-geo.zim &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8903/content/osm-monaco-geo/map-config.json >/dev/null && break; sleep 1; done
          ZIM_ORIGIN=http://127.0.0.1:8902/content/osm-monaco-ci \
            GEO_ORIGIN=http://127.0.0.1:8903/content/osm-monaco-geo \
            CHROME_PATH="$(command -v google-chrome || command -v chromium)" \
            node tools/search_area_check.mjs | tee search-area.txt
          grep -q '^SEARCH AREA OK' search-area.txt

      # Named places without a Wikidata ID (most shops, restaurants and
      # services), and every place on a ZIM without Wikidata, did nothing
      # when tapped. Uses the kiwix-serve started by the overlap-check step.
      - name: Every named place can be tapped (tap-label check)
        run: |
          ZIM_ORIGIN=http://127.0.0.1:8902/content/osm-monaco-ci \
            CHROME_PATH="$(command -v google-chrome || command -v chromium)" \
            node tools/tap_label_check.mjs | tee tap-label.txt
          grep -q '^TAP LABEL OK' tap-label.txt

      - name: Rewrite tools on libzim (repackage, in-place viewer patch)
        env:
          STREETZIM_REQUIRE_ZIMCHECK: "1"
        run: |
          python cloud/repackage_zim.py osm-monaco-ci.zim osm-monaco-repack.zim --split-find-chips
          python cloud/validate_zim.py osm-monaco-repack.zim
          python -c "import sys; from libzim.reader import Archive; sys.exit(0 if Archive('osm-monaco-repack.zim').has_title_index else 'repackage lost the title index')"
          cp osm-monaco-ci.zim osm-monaco-patched.zim
          mkdir -p /tmp/viewer && cp resources/viewer/{index.html,places.html,routing-worker.js} /tmp/viewer/
          sed -i 's/<title>/<title>ci-patch /' /tmp/viewer/index.html
          python cloud/patch_viewer_inplace.py osm-monaco-patched.zim --viewer-dir /tmp/viewer
          zimcheck -A osm-monaco-patched.zim
          python -c "import sys; from libzim.reader import Archive; a = Archive('osm-monaco-patched.zim'); b = bytes(a.get_entry_by_path('index.html').get_item().content); sys.exit(0 if a.check() and b'ci-patch' in b else 'in-place patch not applied or checksum wrong')"

      # --profile basic plus --terrain: the per-push end-to-end terrain
      # check. Monaco fetches a GLO-30 and a GLO-90 cell (about 18 MB) from
      # the public Copernicus buckets on S3 and adds a few seconds. (The
      # docker job builds offline, so it leaves terrain out.)
      - name: Build through the openZIM-style command (streetzim --area)
        env:
          STREETZIM_REQUIRE_SHAPEFILES: "1"
          STREETZIM_REQUIRE_ZIMCHECK: "1"
        run: |
          pip install --no-deps -e .
          streetzim --name osm_en_monaco --title Monaco \
            --description "Offline map of Monaco with search and routing" \
            --tags openstreetmap --area monaco --pbf-url "file://$PWD/monaco-latest.osm.pbf" \
            --shapefiles "$PWD" --profile basic --terrain \
            --output out --stats-filename out/task_progress.json
          python tools/check_openzim_output.py out osm_en_monaco --title Monaco --routing --terrain
          python cloud/validate_zim.py out/osm_en_monaco_*.zim

      - name: Upload ZIM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osm-monaco-ci
          path: osm-monaco-ci.zim
          if-no-files-found: ignore
          retention-days: 7

  openfreemap-tiles:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install Python and Node dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
        run: |
          pip install -r requirements.txt
          npm ci --no-audit --no-fund
      - name: Cache zim-tools and kiwix-tools
        id: tools-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/zim-tools
            ~/.local/kiwix-tools
          key: zim-${{ env.ZIM_TOOLS_VERSION }}-kiwix-${{ env.KIWIX_TOOLS_VERSION }}-linux-x86_64
      - name: Download zim-tools and kiwix-tools
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/zim-tools ~/.local/kiwix-tools
          curl -fsSL --retry 3 --max-time 1200 \
            "https://download.openzim.org/release/zim-tools/zim-tools_linux-x86_64-${ZIM_TOOLS_VERSION}.tar.gz" \
            | tar -xz -C ~/.local/zim-tools --strip-components=1
          curl -fsSL --retry 3 --max-time 1200 \
            "https://download.kiwix.org/release/kiwix-tools/kiwix-tools_linux-x86_64-${KIWIX_TOOLS_VERSION}.tar.gz" \
            | tar -xz -C ~/.local/kiwix-tools --strip-components=1
      - name: Put the tools on PATH
        run: |
          echo "$HOME/.local/zim-tools" >> "$GITHUB_PATH"
          echo "$HOME/.local/kiwix-tools" >> "$GITHUB_PATH"
      - name: Fetch OpenFreeMap Monaco tiles
        run: python scripts/fetch-openfreemap-mbtiles.py monaco -o ofm-monaco.mbtiles
      - name: Build from OpenFreeMap tiles (search, Find chips, viewer)
        run: |
          python create_osm_zim.py --mbtiles ofm-monaco.mbtiles --bbox 7.39,43.715,7.46,43.765 \
            --name Monaco --split-find-chips -o osm-monaco-ofm.zim
      - name: Validate
        env:
          STREETZIM_REQUIRE_ZIMCHECK: "1"
        run: python cloud/validate_zim.py osm-monaco-ofm.zim
      - name: Browser smoke test through kiwix-serve
        run: |
          kiwix-serve --port 8900 osm-monaco-ofm.zim &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8900/content/osm-monaco-ofm/map-config.json >/dev/null && break; sleep 1; done
          ZIM_ORIGIN=http://127.0.0.1:8900/content/osm-monaco-ofm \
            CHROME_PATH="$(command -v google-chrome || command -v chromium)" \
            node cloud/zim_viewer_smoke.mjs

  docker:
    # The image as Zimfarm runs it: --profile full (tilemaker tiles, search,
    # routing, Wikidata, Wikipedia articles, Overture) on Monaco, entirely
    # with the image's own tilemaker, osmium, Python and DuckDB extensions,
    # as a non-root user and with no network: every input comes from
    # tests/fixtures/monaco-full (the extract, Overture parquets of a pinned
    # release, the Wikidata and Wikipedia caches), so the job checks the
    # code, not the APIs. Then the host validates it and checks that the
    # full features are in it. (monaco-e2e runs streetzim with --profile
    # basic; live-full runs full against the live sources weekly.)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Build the image
        run: |
          version=dev
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="${GITHUB_REF_NAME#v}"; fi
          docker build --platform linux/amd64 \
            --label org.opencontainers.image.revision="$(git rev-parse HEAD)" \
            --label org.opencontainers.image.version="$version" -t streetzim .
      - name: The image has tilemaker and osmium, and uses zimscraperlib
        run: |
          # The pinned font glyphs are baked in: re-checking them needs no network.
          docker run --rm --network none streetzim python /app/tools/pin_viewer_assets.py --prefetch /app/viewer-assets
          docker run --rm streetzim tilemaker --help > /dev/null
          docker run --rm streetzim osmium --version
          docker run --rm streetzim python -c "import sys; from streetzim import scraperlib; assert scraperlib.AVAILABLE, 'zimscraperlib missing'; print(sys.version)"
          # Terrain's GDAL (from the rasterio wheel); the build below is offline.
          docker run --rm --network none streetzim python -c "import rasterio; print('GDAL', rasterio.__gdal_version__)"

      # The same paths and keys as monaco-e2e, so the two jobs share the caches.
      - name: Cache coastline and Natural Earth shapefiles
        id: shp-cache
        uses: actions/cache@v4
        with:
          path: |
            coastline
            landcover
          key: shapefiles-v1
      - name: Fetch shapefiles
        if: steps.shp-cache.outputs.cache-hit != 'true'
        run: scripts/fetch-shapefiles.sh .
      - name: Cache zim-tools ${{ env.ZIM_TOOLS_VERSION }}
        id: zimtools-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/zim-tools
          key: zim-tools-${{ env.ZIM_TOOLS_VERSION }}-linux-x86_64
      - name: Download zim-tools ${{ env.ZIM_TOOLS_VERSION }}
        if: steps.zimtools-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 3 --max-time 1200 -o /tmp/zt.tgz \
            "https://download.openzim.org/release/zim-tools/zim-tools_linux-x86_64-${ZIM_TOOLS_VERSION}.tar.gz"
          mkdir -p ~/.local/zim-tools
          tar -xzf /tmp/zt.tgz -C ~/.local/zim-tools --strip-components=1

      - name: Build Monaco inside the image, --profile full, offline and not as root
        # No --mbtiles and no --no-routing: the flags Zimfarm's recipe would
        # pass. The shapefiles are mounted read-only (the image does not bake
        # them in); STREETZIM_REQUIRE_SHAPEFILES makes a missing one fatal
        # instead of a ZIM without ocean. /output and task_progress.json are
        # what offliner-definition.json pins. --network none: the fixture's
        # caches must be enough (a lookup they lack fails softly and shows
        # in the "sources:" line). --user: the DuckDB extensions must load
        # from /opt/duckdb-ext, not root's home. --terrain=off: the DEM is
        # not in the fixture (Monaco's two cells are about 18 MB, 15 times
        # the fixture), and offline the download would stop the build;
        # monaco-e2e (every push) and live-full (weekly, in the image) build
        # terrain from S3. About 20 s outside Docker.
        timeout-minutes: 15
        run: |
          set -o pipefail
          mkdir -p out dl && chmod 777 out dl
          cp -r tests/fixtures/monaco-full/dl/. dl/
          # An SVG illustration: zimscraperlib (Python 3.14 in the image) converts it.
          printf '<svg xmlns="http://www.w3.org/2000/svg" width="64" height="32"><rect width="64" height="32" fill="#2a7"/></svg>' > out/icon.svg
          # STREETZIM_WIKI_WAIT_BUDGET=0: the first Wikimedia request that
          # fails (no network) stops the rest instead of retrying each one
          # (38 articles the fixture lacks would take 10 minutes).
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -e STREETZIM_REQUIRE_SHAPEFILES=1 -e STREETZIM_WIKI_WAIT_BUDGET=0 \
            -v "$PWD/out:/output" -v "$PWD/dl:/dl" \
            -v "$PWD/tests/fixtures/monaco-full:/fixture:ro" \
            -v "$PWD/coastline:/shapefiles/coastline:ro" \
            -v "$PWD/landcover:/shapefiles/landcover:ro" \
            streetzim \
            streetzim --name osm_en_monaco-docker --title Monaco \
            --description "Offline map of Monaco with search and routing" \
            --illustration-url /output/icon.svg \
            --area monaco --pbf-url file:///fixture/monaco.osm.pbf \
            --profile full --terrain=off \
            --overture-release "$(cat tests/fixtures/monaco-full/OVERTURE_RELEASE)" \
            --dl /dl --shapefiles /shapefiles \
            --output /output --stats-filename /output/task_progress.json \
            --file-name osm-monaco-docker 2>&1 | tee build.log
          grep '^streetzim: sources: ' build.log
      - name: Validate the ZIM (openZIM output, cloud/validate_zim.py + zimcheck)
        env:
          STREETZIM_REQUIRE_ZIMCHECK: "1"
        run: |
          pip install -q -r requirements.txt
          python tools/check_openzim_output.py out osm_en_monaco-docker --title Monaco \
            --file osm-monaco-docker.zim --routing
          PATH="$HOME/.local/zim-tools:$PATH" python cloud/validate_zim.py out/osm-monaco-docker.zim
          python tools/check_full_profile.py out/osm-monaco-docker.zim

      - name: Export the validated image for publication
        if: github.event_name == 'push' && github.repository == 'jasontitus/streetzim' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/streetzim-image"
          docker image inspect streetzim --format '{{.Id}}' > "$RUNNER_TEMP/streetzim-image/image-id.txt"
          docker image save streetzim | gzip -1 > "$RUNNER_TEMP/streetzim-image/streetzim-image.tar.gz"
          cd "$RUNNER_TEMP/streetzim-image"
          sha256sum streetzim-image.tar.gz image-id.txt > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: github.event_name == 'push' && github.repository == 'jasontitus/streetzim' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
        with:
          name: streetzim-image-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/streetzim-image/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

  live-full:
    # Weekly (and on demand): --profile full against the live sources, as a
    # Zimfarm task would fetch them: the Geofabrik extract, Overture's latest
    # release, Wikidata and the Wikipedia API. Overture must work (a build
    # without it fails); Wikidata and Wikipedia only warn, since their APIs
    # rate limit and the build degrades by design.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Build the image
        run: docker build -t streetzim .
      - name: Cache coastline and Natural Earth shapefiles
        id: shp-cache
        uses: actions/cache@v4
        with:
          path: |
            coastline
            landcover
          key: shapefiles-v1
      - name: Fetch shapefiles
        if: steps.shp-cache.outputs.cache-hit != 'true'
        run: scripts/fetch-shapefiles.sh .
      - name: Build Monaco inside the image, --profile full, live
        timeout-minutes: 40
        run: |
          set -o pipefail
          mkdir -p out && chmod 777 out
          docker run --rm --user "$(id -u):$(id -g)" -e STREETZIM_REQUIRE_SHAPEFILES=1 \
            -v "$PWD/out:/output" \
            -v "$PWD/coastline:/shapefiles/coastline:ro" \
            -v "$PWD/landcover:/shapefiles/landcover:ro" \
            streetzim \
            streetzim --name osm_en_monaco --title Monaco \
            --description "Offline map of Monaco with search and routing" \
            --area monaco --profile full --shapefiles /shapefiles \
            --output /output --stats-filename /output/task_progress.json 2>&1 | tee build.log
          grep '^streetzim: sources: ' build.log
      - name: Check the full features (Wikimedia softly)
        run: |
          pip install -q -r requirements.txt
          python tools/check_openzim_output.py out osm_en_monaco --title Monaco --routing --terrain
          python tools/check_full_profile.py --soft-wikimedia out/osm_en_monaco_*.zim
