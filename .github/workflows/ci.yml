# Four jobs (docker builds the image and runs `streetzim` in it as Zimfarm would):
#   checks     - lint gate, Python unit tests, Node viewer/PWA tests. Fast, offline.
#   openfreemap-tiles - builds from the same OpenFreeMap MBTiles openzim/maps
#                uses (no tilemaker), validates, and loads it through kiwix-serve.
#   monaco-e2e - builds a real Monaco ZIM from Geofabrik with tilemaker v3 and the
#                production routing layout, then runs cloud/validate_zim.py
#                (with a current zimcheck) and a headless-browser smoke test of
#                the viewer served straight out of the ZIM, both by a minimal
#                server and by Kiwix's own kiwix-serve. Everything here uses
#                stock libzim (python-libzim, zim-tools, kiwix-tools); nothing
#                needs the optional Rust packer. It also exercises the tools
#                that rewrite published ZIMs (repackage, in-place viewer patch). Also runs weekly so
#                upstream drift (Geofabrik, fonts CDN, MapLibre on unpkg,
#                tilemaker, libzim) shows up without a code change.
name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  TILEMAKER_REF: v3.0.0
  ZIM_TOOLS_VERSION: 3.8.0
  KIWIX_TOOLS_VERSION: 3.8.2

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Python dependencies
        run: pip install -r requirements.txt ruff==0.15.8
      - name: Lint (narrow gate, see ruff.toml)
        run: ruff check .
      - name: Viewer index.html matches its parts
        run: python tools/build_viewer.py --check
      - name: offliner-definition.json matches the streetzim flags
        run: python tools/offliner_definition.py --check
      - name: Python tests
        run: python -m pytest tests -q
      - name: Node tests
        env:
          PYTHON: python
        # test_picker / test_sw_streaming need a browser and the PWA server,
        # test_preview_proxy talks to archive.org; they are run by hand.
        run: |
          for t in tests/chip_rules_js.test.mjs tests/chip_shards_js.test.mjs \
                   tests/search_shards_js.test.mjs tests/zim_reader_js.test.mjs \
                   tests/test_zim_http_source.mjs; do
            echo "::group::$t"
            node "$t"
            echo "::endgroup::"
          done

  monaco-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Python and Node dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
        run: |
          pip install -r requirements.txt
          npm ci --no-audit --no-fund
          sudo apt-get update -q
          sudo apt-get install -y -q osmium-tool unzip

      # Ubuntu's tilemaker (2.4) is too old for resources/tilemaker/*.lua.
      - name: Cache tilemaker ${{ env.TILEMAKER_REF }}
        id: tilemaker-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/tilemaker
          key: tilemaker-${{ env.TILEMAKER_REF }}-ubuntu-24.04
      # The -dev packages also pull in the runtime libraries, so install them
      # on a cache hit too rather than guessing runtime package names.
      - name: Install tilemaker build and runtime libraries
        run: |
          sudo apt-get install -y -q build-essential cmake libboost-dev \
            libboost-filesystem-dev libboost-iostreams-dev libboost-program-options-dev \
            libboost-system-dev liblua5.1-0-dev libshp-dev libsqlite3-dev rapidjson-dev zlib1g-dev
      - name: Build tilemaker ${{ env.TILEMAKER_REF }}
        if: steps.tilemaker-cache.outputs.cache-hit != 'true'
        run: |
          git clone -q --depth 1 --branch "$TILEMAKER_REF" https://github.com/systemed/tilemaker.git /tmp/tilemaker
          cmake -S /tmp/tilemaker -B /tmp/tilemaker/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/tilemaker/build -j"$(nproc)"
          mkdir -p ~/.local/tilemaker && cp /tmp/tilemaker/build/tilemaker ~/.local/tilemaker/
      # Ubuntu's zimcheck (3.2) cannot read ZIMs written by current libzim.
      # download.openzim.org can be slow, so the tarball is cached.
      - name: Cache zim-tools ${{ env.ZIM_TOOLS_VERSION }}
        id: zimtools-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/zim-tools
          key: zim-tools-${{ env.ZIM_TOOLS_VERSION }}-linux-x86_64
      - name: Download zim-tools ${{ env.ZIM_TOOLS_VERSION }}
        if: steps.zimtools-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 3 --max-time 1200 -o /tmp/zt.tgz \
            "https://download.openzim.org/release/zim-tools/zim-tools_linux-x86_64-${ZIM_TOOLS_VERSION}.tar.gz"
          mkdir -p ~/.local/zim-tools
          tar -xzf /tmp/zt.tgz -C ~/.local/zim-tools --strip-components=1
      - name: Cache kiwix-tools ${{ env.KIWIX_TOOLS_VERSION }}
        id: kiwixtools-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/kiwix-tools
          key: kiwix-tools-${{ env.KIWIX_TOOLS_VERSION }}-linux-x86_64
      - name: Download kiwix-tools ${{ env.KIWIX_TOOLS_VERSION }}
        if: steps.kiwixtools-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 3 --max-time 1200 -o /tmp/kt.tgz \
            "https://download.kiwix.org/release/kiwix-tools/kiwix-tools_linux-x86_64-${KIWIX_TOOLS_VERSION}.tar.gz"
          mkdir -p ~/.local/kiwix-tools
          tar -xzf /tmp/kt.tgz -C ~/.local/kiwix-tools --strip-components=1
      - name: Put tilemaker, zim-tools and kiwix-tools on PATH
        run: |
          echo "$HOME/.local/zim-tools" >> "$GITHUB_PATH"
          echo "$HOME/.local/kiwix-tools" >> "$GITHUB_PATH"
          echo "$HOME/.local/tilemaker" >> "$GITHUB_PATH"

      - name: Cache coastline and Natural Earth shapefiles
        id: shp-cache
        uses: actions/cache@v4
        with:
          path: |
            coastline
            landcover
          key: shapefiles-v1
      - name: Fetch shapefiles
        if: steps.shp-cache.outputs.cache-hit != 'true'
        run: scripts/fetch-shapefiles.sh .

      - name: Build Monaco ZIM
        env:
          STREETZIM_REQUIRE_SHAPEFILES: "1"
        run: |
          python create_osm_zim.py --area monaco --routing --spatial-chunk-scale 10 \
            --split-find-chips -o osm-monaco-ci.zim

      - name: Validate (cloud/validate_zim.py + zimcheck)
        env:
          STREETZIM_REQUIRE_ZIMCHECK: "1"
        run: python cloud/validate_zim.py osm-monaco-ci.zim

      - name: Browser smoke test of the in-ZIM viewer
        run: |
          python cloud/serve_zim_entries.py osm-monaco-ci.zim --port 8899 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8899/map-config.json >/dev/null && break; sleep 1; done
          ZIM_ORIGIN=http://127.0.0.1:8899 \
            CHROME_PATH="$(command -v google-chrome || command -v chromium)" \
            node cloud/zim_viewer_smoke.mjs

      - name: Browser smoke test through kiwix-serve
        run: |
          kiwix-serve --port 8900 osm-monaco-ci.zim &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8900/content/osm-monaco-ci/map-config.json >/dev/null && break; sleep 1; done
          ZIM_ORIGIN=http://127.0.0.1:8900/content/osm-monaco-ci \
            CHROME_PATH="$(command -v google-chrome || command -v chromium)" \
            node cloud/zim_viewer_smoke.mjs

      - name: Rewrite tools on libzim (repackage, in-place viewer patch)
        env:
          STREETZIM_REQUIRE_ZIMCHECK: "1"
        run: |
          python cloud/repackage_zim.py osm-monaco-ci.zim osm-monaco-repack.zim --split-find-chips
          python cloud/validate_zim.py osm-monaco-repack.zim
          python -c "import sys; from libzim.reader import Archive; sys.exit(0 if Archive('osm-monaco-repack.zim').has_title_index else 'repackage lost the title index')"
          cp osm-monaco-ci.zim osm-monaco-patched.zim
          mkdir -p /tmp/viewer && cp resources/viewer/{index.html,places.html,routing-worker.js} /tmp/viewer/
          sed -i 's/<title>/<title>ci-patch /' /tmp/viewer/index.html
          python cloud/patch_viewer_inplace.py osm-monaco-patched.zim --viewer-dir /tmp/viewer
          zimcheck -A osm-monaco-patched.zim
          python -c "import sys; from libzim.reader import Archive; a = Archive('osm-monaco-patched.zim'); b = bytes(a.get_entry_by_path('index.html').get_item().content); sys.exit(0 if a.check() and b'ci-patch' in b else 'in-place patch not applied or checksum wrong')"

      - name: Build through the openZIM-style command (streetzim --area)
        env:
          STREETZIM_REQUIRE_SHAPEFILES: "1"
          STREETZIM_REQUIRE_ZIMCHECK: "1"
        run: |
          pip install --no-deps -e .
          streetzim --name osm_en_monaco --title Monaco \
            --description "Offline map of Monaco with search and routing" \
            --tags openstreetmap --area monaco --shapefiles "$PWD" \
            --output out --stats-filename out/task_progress.json
          python tools/check_openzim_output.py out osm_en_monaco --title Monaco --routing
          python cloud/validate_zim.py out/osm_en_monaco_*.zim

      - name: Upload ZIM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osm-monaco-ci
          path: osm-monaco-ci.zim
          if-no-files-found: ignore
          retention-days: 7

  openfreemap-tiles:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Python and Node dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
        run: |
          pip install -r requirements.txt
          npm ci --no-audit --no-fund
      - name: Cache zim-tools and kiwix-tools
        id: tools-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/zim-tools
            ~/.local/kiwix-tools
          key: zim-${{ env.ZIM_TOOLS_VERSION }}-kiwix-${{ env.KIWIX_TOOLS_VERSION }}-linux-x86_64
      - name: Download zim-tools and kiwix-tools
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/zim-tools ~/.local/kiwix-tools
          curl -fsSL --retry 3 --max-time 1200 \
            "https://download.openzim.org/release/zim-tools/zim-tools_linux-x86_64-${ZIM_TOOLS_VERSION}.tar.gz" \
            | tar -xz -C ~/.local/zim-tools --strip-components=1
          curl -fsSL --retry 3 --max-time 1200 \
            "https://download.kiwix.org/release/kiwix-tools/kiwix-tools_linux-x86_64-${KIWIX_TOOLS_VERSION}.tar.gz" \
            | tar -xz -C ~/.local/kiwix-tools --strip-components=1
      - name: Put the tools on PATH
        run: |
          echo "$HOME/.local/zim-tools" >> "$GITHUB_PATH"
          echo "$HOME/.local/kiwix-tools" >> "$GITHUB_PATH"
      - name: Fetch OpenFreeMap Monaco tiles
        run: python scripts/fetch-openfreemap-mbtiles.py monaco -o ofm-monaco.mbtiles
      - name: Build from OpenFreeMap tiles (search, Find chips, viewer)
        run: |
          python create_osm_zim.py --mbtiles ofm-monaco.mbtiles --bbox 7.40,43.72,7.44,43.76 \
            --name Monaco --split-find-chips -o osm-monaco-ofm.zim
      - name: Validate
        env:
          STREETZIM_REQUIRE_ZIMCHECK: "1"
        run: python cloud/validate_zim.py osm-monaco-ofm.zim
      - name: Browser smoke test through kiwix-serve
        run: |
          kiwix-serve --port 8900 osm-monaco-ofm.zim &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8900/content/osm-monaco-ofm/map-config.json >/dev/null && break; sleep 1; done
          ZIM_ORIGIN=http://127.0.0.1:8900/content/osm-monaco-ofm \
            CHROME_PATH="$(command -v google-chrome || command -v chromium)" \
            node cloud/zim_viewer_smoke.mjs

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t streetzim .
      - name: Build a ZIM inside it the way Zimfarm runs an offliner
        # OpenFreeMap tiles, so no tilemaker or shapefiles; --no-routing
        # because there is no OSM extract. /output and task_progress.json
        # are what offliner-definition.json pins.
        run: |
          mkdir -p out && chmod 777 out
          python3 scripts/fetch-openfreemap-mbtiles.py monaco -o out/monaco.mbtiles
          docker run --rm -v "$PWD/out:/output" streetzim \
            streetzim --name osm_en_monaco-docker --title Monaco \
            --description "Offline map of Monaco with search" \
            --bbox 7.40,43.72,7.44,43.76 --mbtiles /output/monaco.mbtiles --no-routing \
            --output /output --stats-filename /output/task_progress.json \
            --file-name osm-monaco-docker
      - name: tilemaker works in the image
        run: docker run --rm streetzim tilemaker --help | head -3
      - name: Validate the ZIM
        run: |
          pip install -q -r requirements.txt
          python tools/check_openzim_output.py out osm_en_monaco-docker --title Monaco \
            --file osm-monaco-docker.zim
          python cloud/validate_zim.py out/osm-monaco-docker.zim
