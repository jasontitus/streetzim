# Publish streetzim to PyPI with trusted publishing (no API token).
#
# Manual only until the maintainer has set PyPI up (docs/packaging.md):
# Actions -> "Publish to PyPI" -> Run workflow, giving an existing tag such
# as v1.0.0. The tag must match streetzim/__about__.py. To publish on every
# pushed tag instead, uncomment the `push: tags` trigger below.
#
# The build job builds and checks the wheel exactly as CI's wheel job does;
# the publish job only uploads it, from the `pypi` environment, and is the
# only job with id-token. Set that environment to allow deployments from
# tags `v*` only, with a required reviewer (docs/packaging.md). Actions are
# pinned by commit (the release in the comment).
name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v1.0.0)"
        required: true
  # push:
  #   tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'jasontitus/streetzim'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
      - name: The input is an existing tag
        run: |
          if ! git rev-parse --verify --quiet "refs/tags/$TAG^{commit}" > /dev/null; then
            echo "::error::no tag $TAG"; exit 1
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: The tag matches the package version
        run: |
          version=$(python -c "import runpy; print(runpy.run_path('streetzim/__about__.py')['__version__'])")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match streetzim/__about__.py ($version)"; exit 1
          fi
      - name: Build the sdist and wheel
        run: |
          pip install build==1.6.1
          python -m build
      - name: Check the installed wheel (as CI's wheel job)
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/streetzim-*.whl
          cd /tmp
          /tmp/wheel-venv/bin/streetzim --help > /dev/null
          /tmp/wheel-venv/bin/python "$GITHUB_WORKSPACE/tools/check_wheel_install.py"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist
          path: dist

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/streetzim
    permissions:
      id-token: write     # trusted publishing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
