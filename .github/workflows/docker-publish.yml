# Publish exactly the linux/amd64 image that CI's Docker job built and validated.
# main -> dev and sha-<12 chars>; stable release tags -> X.Y.Z. Only the highest
# stable Git tag gets latest (a higher failing tag still blocks promotion).
# Keep release tags immutable. Make the GHCR package public in Package settings.
name: Publish Docker image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

# Mutable aliases share serialization. An older CI rerun must not evict
# current main's pending publication before being skipped itself.
concurrency:
  group: docker-publish
  queue: max

jobs:
  select:
    if: >-
      github.repository == 'jasontitus/streetzim'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      publish: ${{ steps.tags.outputs.publish }}
      tags: ${{ steps.tags.outputs.tags }}
      commit_sha: ${{ steps.tags.outputs.commit_sha }}
      artifact_id: ${{ steps.artifact.outputs.artifact_id }}
    env:
      REF: ${{ github.event.workflow_run.head_branch }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      CI_RUN_ID: ${{ github.event.workflow_run.id }}
      CI_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
    steps:
      # Read policy from the workflow's default-branch commit, even when the
      # tested release predates the helper. Tested metadata is literal data.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          path: policy
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          path: tested
          persist-credentials: false
      - name: Select allowed tags without executing tested source
        id: tags
        working-directory: tested
        run: python3 ../policy/tools/docker_publish_tags.py --ref "$REF" --sha "$SHA" >> "$GITHUB_OUTPUT"
      - name: Select the tested image artifact
        id: artifact
        if: steps.tags.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID/artifacts" > "$RUNNER_TEMP/artifacts.json"
          python3 policy/tools/docker_publish_tags.py --sha "$SHA" \
            --artifact-list "$RUNNER_TEMP/artifacts.json" --run-id "$CI_RUN_ID" \
            --run-attempt "$CI_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

  publish:
    needs: select
    if: needs.select.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      packages: write
    env:
      IMAGE: ghcr.io/jasontitus/streetzim
      SHA: ${{ needs.select.outputs.commit_sha }}
      TAGS: ${{ needs.select.outputs.tags }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          artifact-ids: ${{ needs.select.outputs.artifact_id }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: image
          merge-multiple: true
      # Loading and inspecting does not run image code. This job never
      # checks out or executes release source and never rebuilds the image.
      - name: Verify and load the exact CI image
        working-directory: image
        run: |
          set -o pipefail
          sha256sum --check SHA256SUMS
          gzip -dc streetzim-image.tar.gz | docker load
          test "$(docker image inspect streetzim --format '{{.Id}}')" = "$(cat image-id.txt)"
          test "$(docker image inspect streetzim --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          test "$(docker image inspect streetzim --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$SHA"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push validated tags
        run: |
          for t in $TAGS; do
            docker tag streetzim "$IMAGE:$t"
            docker push "$IMAGE:$t"
          done
          echo "pushed $IMAGE: $TAGS ($SHA)" >> "$GITHUB_STEP_SUMMARY"
