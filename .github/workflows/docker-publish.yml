# Publish the builder image to ghcr.io/jasontitus/streetzim (linux/amd64).
#
# Runs after CI passes on a push (its `docker` job builds and tests the
# image with a full-feature Monaco build), for:
#   - main           -> tags `dev` and `sha-<12 chars>`
#   - a tag vX.Y.Z   -> tags `X.Y.Z` and `latest`; the tag must match
#                       streetzim/__about__.py, as for PyPI (publish.yml)
# Only pushes to this repository publish: a pull request's CI run (a
# fork's included) never does. The image is rebuilt here from the commit
# CI tested, checked as CI checks it, then pushed with the workflow's own
# GITHUB_TOKEN (no stored secret). Actions are pinned by commit (the
# release in the comment).
#
# After the first publish, make the package public once: GitHub ->
# Packages -> streetzim -> Package settings -> Change visibility.
# Moving to openZIM later (docs/zimfarm.md, "What Zimfarm needs on its
# side") means publishing the same image as ghcr.io/openzim/streetzim.
name: Publish Docker image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, "v*"]

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'jasontitus/streetzim'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/jasontitus/streetzim
      REF: ${{ github.event.workflow_run.head_branch }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Tags for this commit
        id: tags
        run: |
          if [ "$REF" = main ]; then
            # Publish main only while it still points at the tested commit
            # (a later push publishes itself), so `dev` never goes backwards.
            git fetch -q origin main
            if [ "$(git rev-parse origin/main)" != "$SHA" ]; then
              echo "main has moved past $SHA; its own run publishes it"; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "tags=dev sha-${SHA:0:12}" >> "$GITHUB_OUTPUT"
            echo "version=dev" >> "$GITHUB_OUTPUT"
          else
            if [ "$(git rev-parse --verify --quiet "refs/tags/$REF^{commit}")" != "$SHA" ]; then
              echo "::error::$REF is not a tag of $SHA"; exit 1
            fi
            version=$(python3 -c "import runpy; print(runpy.run_path('streetzim/__about__.py')['__version__'])")
            if [ "$REF" != "v$version" ]; then
              echo "::error::tag $REF does not match streetzim/__about__.py ($version)"; exit 1
            fi
            echo "tags=$version latest" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the image (linux/amd64)
        if: steps.tags.outputs.skip != '1'
        run: |
          docker build --platform linux/amd64 \
            --label org.opencontainers.image.revision="$SHA" \
            --label org.opencontainers.image.version="${{ steps.tags.outputs.version }}" \
            -t streetzim .
      - name: The image works (as CI's docker job checks it)
        if: steps.tags.outputs.skip != '1'
        run: |
          docker run --rm --network none streetzim python /app/tools/pin_viewer_assets.py --prefetch /app/viewer-assets
          docker run --rm streetzim tilemaker --help | head -3
          docker run --rm streetzim osmium --version | head -1
          docker run --rm streetzim python -c "from streetzim import scraperlib; assert scraperlib.AVAILABLE, 'zimscraperlib missing'"
          docker run --rm streetzim streetzim --help > /dev/null
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        if: steps.tags.outputs.skip != '1'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: steps.tags.outputs.skip != '1'
        run: |
          for t in ${{ steps.tags.outputs.tags }}; do
            docker tag streetzim "$IMAGE:$t"
            docker push "$IMAGE:$t"
          done
          echo "pushed $IMAGE: ${{ steps.tags.outputs.tags }} ($SHA)" >> "$GITHUB_STEP_SUMMARY"
