# Lint gate run by CI (.github/workflows/ci.yml): syntax errors (E9) and the
# whole pyflakes family (F: undefined and unused names, unused imports and
# variables, f-strings without placeholders, `is` misuse, bad return/yield
# placement), enforced on the whole tree. Widen it one family at a time,
# fixing the tree as you go.
target-version = "py310"
extend-exclude = ["attic"]

[lint]
select = ["E9", "F"]

[lint.per-file-ignores]
# A compatibility facade: names moved to streetzim/ are re-exported, and
# tests patch create_osm_zim.time / create_osm_zim.urllib.request.
"create_osm_zim.py" = ["F401"]
